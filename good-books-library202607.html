<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>善书馆 Good Books Library</title>
<style>
:root {
  --primary: #8B4513;
  --primary-light: #D2691E;
  --accent: #CD853F;
  --bg: #FFF8F0;
  --bg-card: #FFFFFF;
  --bg-eaco: #0D1117;
  --text: #3E2723;
  --text-light: #6D4C41;
  --border: #DEB887;
  --shadow: 0 2px 12px rgba(139,69,19,0.1);
  --shadow-hover: 0 6px 24px rgba(139,69,19,0.18);
  --radius: 12px;
  --radius-sm: 8px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
/* Header */
.header {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  color: #FFF8F0;
  padding: 1.5rem 1rem;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 16px rgba(0,0,0,0.15);
}
.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0.5rem;
}
.header-title {
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: 1px;
  cursor: pointer;
}
.header-title span { font-size: 0.9rem; font-weight: 400; opacity: 0.85; }
.header-right { display:flex; align-items:center; gap:0.75rem; }
.lang-toggle {
  background: rgba(255,255,255,0.2);
  border: 1px solid rgba(255,255,255,0.4);
  color: #fff;
  padding: 0.4rem 1rem;
  border-radius: 20px;
  cursor: pointer;
  font-size: 0.85rem;
  transition: all 0.3s;
  white-space: nowrap;
}
.lang-toggle:hover { background: rgba(255,255,255,0.35); }
/* Tabs */
.tabs {
  background: var(--bg-card);
  border-bottom: 2px solid var(--border);
  display: flex;
  justify-content: center;
  gap: 0;
  padding: 0 1rem;
  position: sticky;
  top: 64px;
  z-index: 99;
  box-shadow: var(--shadow);
  overflow-x: auto;
}
.tab {
  padding: 0.9rem 1.5rem;
  cursor: pointer;
  font-size: 0.95rem;
  color: var(--text-light);
  border-bottom: 3px solid transparent;
  transition: all 0.3s;
  white-space: nowrap;
  font-weight: 500;
}
.tab:hover { color: var(--primary); }
.tab.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
  font-weight: 700;
}
/* Main */
.main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 1.5rem 1rem 3rem;
}
/* Filters */
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-bottom: 1rem;
  align-items: center;
}
.search-box {
  flex: 1;
  min-width: 200px;
  padding: 0.6rem 1rem;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 0.9rem;
  background: var(--bg-card);
  color: var(--text);
  transition: border-color 0.3s;
}
.search-box:focus { outline: none; border-color: var(--primary); }
.filter-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin-bottom: 1rem;
}
.chip {
  padding: 0.35rem 0.85rem;
  border-radius: 20px;
  font-size: 0.82rem;
  cursor: pointer;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-light);
  transition: all 0.3s;
  white-space: nowrap;
}
.chip:hover { background: var(--accent); color: #fff; }
.chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
/* Stats */
.stats {
  font-size: 0.85rem;
  color: var(--text-light);
  margin-bottom: 1rem;
  padding-left: 0.3rem;
}
/* Book Grid */
.book-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 1rem;
}
.book-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 1.2rem;
  box-shadow: var(--shadow);
  border: 1px solid rgba(222,184,135,0.3);
  transition: all 0.3s;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.book-card:hover {
  box-shadow: var(--shadow-hover);
  transform: translateY(-2px);
  border-color: var(--accent);
}
.book-card .num {
  font-size: 0.7rem;
  color: var(--accent);
  font-weight: 700;
  letter-spacing: 1px;
}
.book-card .title {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--primary);
  line-height: 1.4;
}
.book-card .title-en {
  font-size: 0.85rem;
  color: var(--text-light);
  font-style: italic;
}
.book-card .meta {
  font-size: 0.78rem;
  color: var(--text-light);
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
}
.book-card .meta span {
  background: rgba(205,133,63,0.1);
  padding: 0.15rem 0.5rem;
  border-radius: 4px;
}
.book-card .content {
  font-size: 0.88rem;
  color: var(--text);
  line-height: 1.6;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.book-card.expanded .content {
  -webkit-line-clamp: unset;
  overflow: visible;
}
.book-card .expand-hint {
  font-size: 0.78rem;
  color: var(--primary-light);
  font-weight: 500;
}
/* Section title */
.section-title {
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--primary);
  margin: 0.5rem 0 1rem;
  padding-left: 0.8rem;
  border-left: 4px solid var(--accent);
}
/* EACO Page */
.eaco-page {
  background: var(--bg-eaco);
  color: #c9d1d9;
  border-radius: 16px;
  padding: 0;
  overflow: hidden;
  max-width: 900px;
  margin: 0 auto;
}
.eaco-hero {
  background: linear-gradient(135deg, #1a1f2e 0%, #0d1117 50%, #1a2332 100%);
  padding: 3rem 2rem;
  text-align: center;
  position: relative;
}
.eaco-hero::before {
  content: '\u2B50';
  position: absolute;
  top: 1rem;
  left: 50%;
  transform: translateX(-50%);
  font-size: 2rem;
}
.eaco-hero h1 {
  font-size: 2.5rem;
  font-weight: 800;
  background: linear-gradient(135deg, #f0c040 0%, #e8a020 50%, #d48810 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 0.5rem;
  letter-spacing: 2px;
}
.eaco-hero .subtitle {
  font-size: 1.1rem;
  color: #8b949e;
  margin-bottom: 1.5rem;
}
.eaco-hero .tags {
  display: inline-block;
  font-size: 0.82rem;
  color: #f0c040;
  border: 1px solid rgba(240,192,64,0.3);
  padding: 0.3rem 1rem;
  border-radius: 20px;
  background: rgba(240,192,64,0.05);
}
.eaco-body {
  padding: 2rem;
}
.eaco-section {
  margin-bottom: 2rem;
}
.eaco-section h2 {
  font-size: 1.15rem;
  color: #f0c040;
  margin-bottom: 0.8rem;
  font-weight: 700;
  border-bottom: 1px solid rgba(240,192,64,0.2);
  padding-bottom: 0.4rem;
}
.eaco-definition {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(240,192,64,0.15);
  border-radius: 10px;
  padding: 1.2rem;
  font-size: 0.95rem;
  line-height: 1.9;
  white-space: pre-line;
  color: #d0d7de;
}
.eaco-goals {
  list-style: none;
  padding: 0;
}
.eaco-goals li {
  padding: 0.5rem 0 0.5rem 1.8rem;
  position: relative;
  font-size: 0.95rem;
}
.eaco-goals li::before {
  content: '\u2714';
  position: absolute;
  left: 0;
  color: #f0c040;
}
.eaco-ca {
  background: rgba(240,192,64,0.08);
  border: 1px solid rgba(240,192,64,0.3);
  border-radius: 8px;
  padding: 0.8rem 1rem;
  font-family: 'Courier New', monospace;
  font-size: 0.82rem;
  color: #f0c040;
  word-break: break-all;
  cursor: pointer;
  transition: all 0.3s;
}
.eaco-ca:hover { background: rgba(240,192,64,0.15); }
.eaco-ca-label {
  font-size: 0.78rem;
  color: #8b949e;
  margin-bottom: 0.4rem;
}
.eaco-links {
  display: flex;
  flex-wrap: wrap;
  gap: 0.8rem;
}
.eaco-link {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.5rem 1.2rem;
  border-radius: 8px;
  font-size: 0.88rem;
  text-decoration: none;
  background: rgba(240,192,64,0.1);
  border: 1px solid rgba(240,192,64,0.3);
  color: #f0c040;
  transition: all 0.3s;
}
.eaco-link:hover {
  background: rgba(240,192,64,0.2);
  transform: translateY(-1px);
}
.eaco-footer {
  text-align: center;
  padding: 1.5rem;
  font-size: 0.82rem;
  color: #484f58;
  border-top: 1px solid rgba(255,255,255,0.06);
}
/* Footer */
.footer {
  text-align: center;
  padding: 2rem 1rem;
  background: var(--primary);
  color: rgba(255,248,240,0.7);
  font-size: 0.82rem;
}
.footer a {
  color: #f0c040;
  text-decoration: none;
  font-weight: 600;
  font-size: 0.9rem;
  display: inline-block;
  padding: 0.4rem 1.2rem;
  border: 1px solid rgba(240,192,64,0.4);
  border-radius: 20px;
  margin-top: 0.5rem;
  transition: all 0.3s;
}
.footer a:hover { background: rgba(240,192,64,0.15); }
/* Responsive */
@media (max-width: 640px) {
  .header-title { font-size: 1.1rem; }
  .header-title span { display: none; }
  .tab { padding: 0.7rem 0.9rem; font-size: 0.85rem; }
  .book-grid { grid-template-columns: 1fr; }
  .eaco-hero h1 { font-size: 1.8rem; }
  .eaco-hero { padding: 2rem 1rem; }
  .eaco-body { padding: 1rem; }
  .tabs { top: 56px; }
}
/* Animations */
@keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
.fade-in { animation: fadeIn 0.4s ease; }
/* No results */
.no-results {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--text-light);
  font-size: 0.95rem;
}
</style>
</head>

    {
      "id": "hx012",
      "cat": "traditional",
      "title_zh": "觉世名言",
      "title_en": "Words to Awaken the World",
      "author_zh": "凌濛初",
      "author_en": "Ling Mengchu",
      "era_zh": "明代",
      "era_en": "Ming Dynasty",
      "content_zh": "即《二拍》，含《初刻拍案惊奇》《二刻拍案惊奇》。以奇闻异事为载体，寓劝善惩恶之意，展现明代社会百态，与三言并称\"三言二拍\"。",
      "content_en": "Also known as 'Two Slaps,' containing 'Amazing Tales' first and second series. Uses extraordinary stories to convey moral lessons, depicting Ming society's panorama. Together with the 'Three Words,' forms the classic 'Three Words and Two Slaps.'"
    },
    {
      "id": "hx013",
      "cat": "traditional",
      "title_zh": "阴骘文图说",
      "title_en": "Illustrated Explanations of the Hidden Merit Tractate",
      "author_zh": "佚名",
      "author_en": "Anonymous",
      "era_zh": "清代",
      "era_en": "Qing Dynasty",
      "content_zh": "以图文形式阐释《文昌帝君阴骘文》的善书。为每一句经文配以历史故事和因果实例，使抽象道理具体可感，广泛流传于民间。",
      "content_en": "An illustrated commentary on Wenchang's Tractate on Hidden Merit. Each line of scripture is paired with historical stories and karmic examples, making abstract principles concrete and accessible to common readers."
    },
    {
      "id": "hx014",
      "cat": "traditional",
      "title_zh": "玉历宝钞",
      "title_en": "The Precious Jade Calendar",
      "author_zh": "佚名（道教）",
      "author_en": "Anonymous (Daoist)",
      "era_zh": "清代",
      "era_en": "Qing Dynasty",
      "content_zh": "描述十殿阎罗及地狱因果的善书。详述各殿审判情形、善恶报应之理，以恐怖地狱景象警醒世人弃恶从善，在民间影响极大。",
      "content_en": "A Daoist moral book describing the Ten Courts of Hell and karmic retribution. Details the judgment process in each court, using vivid depictions of hell to warn people away from evil. Enormously influential in folk culture."
    },
    {
      "id": "hx015",
      "cat": "traditional",
      "title_zh": "集福消灾之道",
      "title_en": "The Way of Accumulating Blessings and Dispelling Disasters",
      "author_zh": "佚名",
      "author_en": "Anonymous",
      "era_zh": "清代",
      "era_en": "Qing Dynasty",
      "content_zh": "汇集历代因果报应故事，阐释《太上感应篇》要义。以真实案例说明善恶报应之不爽，指导世人如何通过行善积德来消灾集福。",
      "content_en": "A compilation of karmic stories explaining the essence of Taishang's Tractate. Uses real cases to demonstrate the certainty of karmic retribution, guiding readers to avert disasters through virtuous deeds."
    },
    {
      "id": "hx016",
      "cat": "confucian",
      "title_zh": "弟子规",
      "title_en": "Standards for Being a Good Student and Child",
      "author_zh": "李毓秀",
      "author_en": "Li Yuxiu",
      "era_zh": "清代",
      "era_en": "Qing Dynasty",
      "content_zh": "以《论语·学而》为纲编写的童蒙养正经典。全篇1080字，360句，讲述入则孝、出则弟、谨、信、泛爱众、亲仁、余力学文七目，是儒家修身入门第一书。",
      "content_en": "A Qing-era primer for moral education based on the Analerta. 1,080 characters in 360 lines covering filial piety, fraternal duty, carefulness, trustworthiness, universal love, closeness to the virtuous, and studying—Confucian self-cultivation's foundational text."
    },
    {
      "id": "hx017",
      "cat": "confucian",
      "title_zh": "三字经",
      "title_en": "The Three Character Classic",
      "author_zh": "王应麟",
      "author_en": "Wang Yinglin",
      "era_zh": "宋代",
      "era_en": "Song Dynasty",
      "content_zh": "中国影响最大的蒙学经典。三字一句，朗朗上口，涵盖教育、伦理、历史、天文、地理等知识，开篇\"人之初，性本善\"影响深远。",
      "content_en": "China's most influential primer. Three-character lines cover education, ethics, history, astronomy, and geography. Its opening 'People at birth are inherently good' has shaped Chinese thought for centuries."
    },
    {
      "id": "hx018",
      "cat": "confucian",
      "title_zh": "孝经",
      "title_en": "The Classic of Filial Piety",
      "author_zh": "佚名",
      "author_en": "Anonymous",
      "era_zh": "先秦",
      "era_en": "Pre-Qin",
      "content_zh": "儒家十三经之一。以孔子与曾子问答形式，论述孝为德之本、教之所由生。从天子之孝到庶人之孝，分五等论述，是中华孝道思想的根本经典。",
      "content_en": "One of the Confucian Thirteen Classics. In dialogue between Confucius and Zengzi, it argues that filial piety is the root of virtue and the origin of education. Describes five levels of filial piety from emperor to commoner."
    },
    {
      "id": "hx019",
      "cat": "confucian",
      "title_zh": "论语",
      "title_en": "The Analerta of Confucius",
      "author_zh": "孔子及其弟子",
      "author_en": "Confucius and disciples",
      "era_zh": "春秋",
      "era_en": "Spring and Autumn Period",
      "content_zh": "儒家第一经典，记载孔子及其弟子言行。核心思想：仁、义、礼、智、信。\"己所不欲，勿施于人\"\"学而时习之\"等名言影响中华文明两千余年。",
      "content_en": "The foremost Confucian classic recording the words and deeds of Confucius and his disciples. Core concepts: benevolence, righteousness, propriety, wisdom, and trust. 'Do not do to others what you do not want done to yourself' has shaped East Asian civilization for 2,000+ years."
    },
    {
      "id": "hx020",
      "cat": "confucian",
      "title_zh": "大学",
      "title_en": "The Great Learning",
      "author_zh": "曾子",
      "author_en": "Zengzi",
      "era_zh": "春秋",
      "era_en": "Spring and Autumn Period",
      "content_zh": "四书之一。提出\"格物、致知、诚意、正心、修身、齐家、治国、平天下\"八条目，以及\"明明德、亲民、止于至善\"三纲领，是儒家修身治世的总纲。",
      "content_en": "One of the Four Books. Presents the 'Eight Steps' (investigating things, extending knowledge, sincerity, rectifying the mind, self-cultivation, family regulation, state governance, world peace) and 'Three Guidelines,' serving as Confucianism's master blueprint."
    },
    {
      "id": "hx021",
      "cat": "confucian",
      "title_zh": "中庸",
      "title_en": "The Doctrine of the Mean",
      "author_zh": "子思",
      "author_en": "Zisi",
      "era_zh": "战国",
      "era_en": "Warring States",
      "content_zh": "四书之一。论述\"中庸\"为天下之正道、万物之至理。强调\"天命之谓性，率性之谓道，修道之谓教\"，讲致中和、慎独，是儒家心性之学的核心经典。",
      "content_en": "One of the Four Books. Discusses the 'Mean' as the universal Way. Key teaching: 'What Heaven confers is called nature; following nature is called the Way; cultivating the Way is called education.' Emphasizes balance, harmony, and watchfulness over oneself when alone."
    },
    {
      "id": "hx022",
      "cat": "confucian",
      "title_zh": "孟子",
      "title_en": "Mencius",
      "author_zh": "孟子",
      "author_en": "Mencius",
      "era_zh": "战国",
      "era_en": "Warring States",
      "content_zh": "四书之一。孟子主张\"性善论\"，提倡仁政、王道。\"老吾老以及人之老，幼吾幼以及人之幼\"\"富贵不能淫，贫贱不能移，威武不能屈\"等思想影响深远。",
      "content_en": "One of the Four Books. Mencius advocates 'innate goodness,' benevolent governance, and the kingly Way. Famous teachings: 'Respect the elderly of others as your own; care for the young of others as your own,' and the 'unbending great man' who cannot be corrupted by wealth, poverty, or force."
    },
    {
      "id": "hx023",
      "cat": "confucian",
      "title_zh": "礼记·曲礼",
      "title_en": "Book of Rites: Summary of Rules of Propriety",
      "author_zh": "佚名",
      "author_en": "Anonymous",
      "era_zh": "先秦",
      "era_en": "Pre-Qin",
      "content_zh": "《礼记》首篇，记述日常礼节规范。\"毋不敬，俨若思，安定辞，安民哉\"开宗明义，详述待人接物、居家出行之礼，是中华礼仪文明的基石。",
      "content_en": "The opening chapter of the Book of Rites, detailing daily etiquette. Its opening 'Be reverent, composed as in thought, steady in speech' sets the tone. Covers rules for social interaction, family life, and conduct—the foundation of Chinese ceremonial civilization."
    },
    {
      "id": "hx024",
      "cat": "confucian",
      "title_zh": "朱子家训",
      "title_en": "Master Zhu's Family Maxims",
      "author_zh": "朱柏庐",
      "author_en": "Zhu Bailu",
      "era_zh": "明末清初",
      "era_en": "Late Ming/Early Qing",
      "content_zh": "又名《朱子治家格言》。全篇524字，以\"黎明即起，洒扫庭除\"开篇，讲述勤俭持家、和睦邻里、读书明理、慎独修身等道理，被誉为\"治家之经\"。",
      "content_en": "Also known as 'Zhu's Rules for Managing the Home.' In 524 characters, starting with 'Rise at dawn, sweep the courtyard,' it teaches diligence, frugality, neighborly harmony, studying, and self-discipline. Hailed as 'the classic of household management.'"
    },
    {
      "id": "hx025",
      "cat": "confucian",
      "title_zh": "颜氏家训",
      "title_en": "Yan's Family Instructions",
      "author_zh": "颜之推",
      "author_en": "Yan Zhitui",
      "era_zh": "北齐",
      "era_en": "Northern Qi",
      "content_zh": "中国家训之祖。颜之推以一生经历教训子孙，分教子、兄弟、治家、勉学等二十篇，强调早教、勤学、务实、节俭，是历代家训的典范之作。",
      "content_en": "China's foundational family instruction text. Yan Zhitui uses his life experience to advise his descendants across 20 chapters on education, brotherhood, household management, and study. The model for all subsequent family instructions."
    },
    {
      "id": "hx026",
      "cat": "confucian",
      "title_zh": "了凡四训",
      "title_en": "Liaofan's Four Lessons",
      "author_zh": "袁了凡",
      "author_en": "Yuan Liaofan",
      "era_zh": "明代",
      "era_en": "Ming Dynasty",
      "content_zh": "（参见传统善书类）改命第一善书。四训：立命之学、改过之法、积善之方、谦德之效。证明命运可通过行善改变。",
      "content_en": "(See Traditional Classics) The foremost book on changing destiny. Four lessons: understanding destiny, correcting faults, accumulating merit, and the virtue of humility."
    },
    {
      "id": "hx027",
      "cat": "confucian",
      "title_zh": "传习录",
      "title_en": "Instructions for Practical Living",
      "author_zh": "王阳明",
      "author_en": "Wang Yangming",
      "era_zh": "明代",
      "era_en": "Ming Dynasty",
      "content_zh": "阳明心学代表作。记载王阳明语录及论学书信。核心思想：\"心即理\"\"知行合一\"\"致良知\"。强调人人皆可为圣，反求诸己，是儒家心性之学的高峰。",
      "content_en": "The definitive work of Wang Yangming's School of Mind. Contains his sayings and letters. Core teachings: 'Mind is Principle,' 'Unity of Knowledge and Action,' and 'Extending Innate Knowledge.' Argues everyone can become a sage through inner reflection—the summit of Confucian introspective philosophy."
    },
    {
      "id": "hx028",
      "cat": "confucian",
      "title_zh": "小学",
      "title_en": "Elementary Learning",
      "author_zh": "朱熹",
      "author_en": "Zhu Xi",
      "era_zh": "宋代",
      "era_en": "Song Dynasty",
      "content_zh": "朱熹编撰的童蒙教育经典。分内篇（明伦、敬身）和外篇（嘉言、善行），从小学阶段培养儿童的行为规范和道德基础，是宋以后蒙学教育的纲领。",
      "content_en": "Zhu Xi's foundational text for childhood education. Divided into inner chapters (understanding relationships, reverent conduct) and outer chapters (admirable words, virtuous deeds). The blueprint for elementary moral education after the Song dynasty."
    },
    {
      "id": "hx029",
      "cat": "confucian",
      "title_zh": "呻吟语",
      "title_en": "Groaning Words",
      "author_zh": "吕坤",
      "author_en": "Lu Kun",
      "era_zh": "明代",
      "era_en": "Ming Dynasty",
      "content_zh": "明代大儒吕坤的修身语录。分六卷，涉及性命、伦理、治道、修身等，以\"呻吟\"名之，意为病中思痛之言。强调务实、存诚、慎独，是儒家实学代表作。",
      "content_en": "Ming scholar Lu Kun's maxims on self-cultivation. Six volumes covering nature, ethics, governance, and self-discipline. Titled 'Groaning Words' as reflections during illness. Emphasizes practical action, sincerity, and watchfulness when alone."
    },
    {
      "id": "hx030",
      "cat": "confucian",
      "title_zh": "五种遗规",
      "title_en": "Five Collections of Established Rules",
      "author_zh": "陈宏谋",
      "author_en": "Chen Hongmou",
      "era_zh": "清代",
      "era_en": "Qing Dynasty",
      "content_zh": "清代名臣陈宏谋编选的道德教育丛书。含《养正遗规》《教女遗规》《训俗遗规》《学仕遗规》《从政遗规》，涵盖从童蒙到为官各阶段修身处世之道。",
      "content_en": "A Qing-era moral education anthology compiled by official Chen Hongmou. Five collections covering childhood education, women's education, public morals, scholarly conduct, and governance—spanning all life stages from youth to public service."
    },
    {
      "id": "hx031",
      "cat": "daoist",
      "title_zh": "道德经",
      "title_en": "Tao Te Ching",
      "author_zh": "老子",
      "author_en": "Laozi",
      "era_zh": "春秋",
      "era_en": "Spring and Autumn Period",
      "content_zh": "道家根本经典，五千言。核心概念：道、德、无为、自然、柔弱胜刚强。\"上善若水\"\"千里之行，始于足下\"\"天之道，损有余而补不足\"等思想影响全球。",
      "content_en": "The foundational Daoist classic, 5,000 characters. Core concepts: the Way, virtue, non-action, naturalness, and softness overcoming hardness. 'The highest good is like water' and 'A journey of a thousand miles begins with a single step' have influenced the world."
    },
    {
      "id": "hx032",
      "cat": "daoist",
      "title_zh": "庄子",
      "title_en": "Zhuangzi",
      "author_zh": "庄周",
      "author_en": "Zhuangzi",
      "era_zh": "战国",
      "era_en": "Warring States",
      "content_zh": "道家第二经典。以寓言、卮言、重言形式阐述逍遥自在的人生哲学。\"天地与我并生，万物与我为一\"\"至人无己，神人无功，圣人无名\"等思想开拓精神自由之境。",
      "content_en": "The second great Daoist classic. Uses parables and allegories to expound a philosophy of spiritual freedom. 'Heaven and Earth were born at the same time I was; the ten thousand things are one with me' expands the realm of inner liberation."
    },
    {
      "id": "hx033",
      "cat": "daoist",
      "title_zh": "太上老君说常清静经",
      "title_en": "Laozi's Classic on Constant Purity and Stillness",
      "author_zh": "佚名（道教）",
      "author_en": "Anonymous (Daoist)",
      "era_zh": "唐代",
      "era_en": "Tang Dynasty",
      "content_zh": "道教修心经典。仅四百余字，阐述\"人能常清静，天地悉皆归\"之理。讲内观其心、外观其形、远观其物，达到\"寂无所寂\"的清静境界，是道教修真入门要籍。",
      "content_en": "A Daoist meditation classic of just 400+ characters. Teaches 'if one can remain constantly pure and still, Heaven and Earth will all return.' Through observing mind, body, and objects, one reaches ultimate stillness. The entry point for Daoist inner cultivation."
    },
    {
      "id": "hx034",
      "cat": "daoist",
      "title_zh": "坐忘论",
      "title_en": "On Sitting in Oblivion",
      "author_zh": "司马承祯",
      "author_en": "Sima Chengzhen",
      "era_zh": "唐代",
      "era_en": "Tang Dynasty",
      "content_zh": "唐代道士司马承祯著。论述修道阶次：敬信、断缘、收心、简事、真观、泰定、得道七步。强调\"收心离境\"\"虚心实腹\"，是道教静坐修心理论的重要著作。",
      "content_en": "By Tang Daoist Sima Chengzhen. Outlines seven stages of cultivation: reverence, severing ties, gathering the mind, simplifying affairs, true observation, calm stability, and attaining the Way. A key text on Daoist meditation theory."
    },
    {
      "id": "hx035",
      "cat": "daoist",
      "title_zh": "化书",
      "title_en": "The Book of Transformation",
      "author_zh": "谭峭",
      "author_en": "Tan Qiao",
      "era_zh": "五代",
      "era_en": "Five Dynasties",
      "content_zh": "五代道士谭峭著。分道化、术化、德化、仁化、食化、俭化六篇，论述万物虚化之理。\"虚化神，神化气，气化血，血化形\"等思想，将道教宇宙论与社会伦理结合。",
      "content_en": "By Five Dynasties Daoist Tan Qiao. Six chapters on universal transformation. 'The void transforms into spirit, spirit into qi, qi into blood, blood into form'—integrating Daoist cosmology with social ethics."
    },
    {
      "id": "hx036",
      "cat": "daoist",
      "title_zh": "列子",
      "title_en": "The Book of Liezi",
      "author_zh": "列子",
      "author_en": "Liezi",
      "era_zh": "战国",
      "era_en": "Warring States",
      "content_zh": "道家重要经典。包含愚公移山、杞人忧天等寓言，阐述\"贵虚\"\"齐物\"思想。主张顺应自然、超脱生死，是道家哲学的重要补充。",
      "content_en": "An important Daoist classic. Contains famous parables like 'The Foolish Old Man Removes the Mountains' and 'The Man of Qi Who Worried About the Sky.' Advocates valuing emptiness and equanimity, complementing the Zhuangzi."
    },
    {
      "id": "hx037",
      "cat": "daoist",
      "title_zh": "文子",
      "title_en": "The Book of Wenzi",
      "author_zh": "文子",
      "author_en": "Wenzi",
      "era_zh": "战国",
      "era_en": "Warring States",
      "content_zh": "道家典籍，被认为是对老子思想的阐释发展。融合道、法、儒思想，主张\"以道化人，以德治国\"，对汉代黄老之学影响深远。",
      "content_en": "A Daoist text that develops Laozi's thought. Synthesizes Daoist, Legalist, and Confucian ideas, advocating 'transforming people through the Way and governing through virtue.' Deeply influenced Han-era Huang-Lao philosophy."
    },
    {
      "id": "hx038",
      "cat": "daoist",
      "title_zh": "淮南子",
      "title_en": "The Huainanzi",
      "author_zh": "刘安",
      "author_en": "Liu An",
      "era_zh": "西汉",
      "era_en": "Western Han",
      "content_zh": "西汉淮南王刘安门客编撰。以道家思想为主，兼融儒、法、阴阳等百家，论述治国、修身、天文、地理，是汉代杂家代表作，保存了大量古代思想资料。",
      "content_en": "Compiled by Prince Liu An's scholars. Primarily Daoist but incorporating all schools of thought, it covers governance, self-cultivation, astronomy, and geography. A Han-era encyclopedic work preserving ancient thought."
    },
    {
      "id": "hx039",
      "cat": "daoist",
      "title_zh": "抱朴子",
      "title_en": "The Master Who Embraces Simplicity",
      "author_zh": "葛洪",
      "author_en": "Ge Hong",
      "era_zh": "东晋",
      "era_en": "Eastern Jin",
      "content_zh": "道教炼丹与修身经典。内篇论神仙、炼丹、养生，外篇论人间得失、治国安民。\"内宝养身，外用利物\"思想将修道与社会伦理结合，对道教发展影响深远。",
      "content_en": "A Daoist classic on alchemy and self-cultivation. Inner chapters discuss immortality, elixirs, and health; outer chapters cover worldly affairs and governance. Integrates spiritual cultivation with social ethics."
    },
    {
      "id": "hx040",
      "cat": "daoist",
      "title_zh": "悟真篇",
      "title_en": "Awakening to Reality",
      "author_zh": "张伯端",
      "author_en": "Zhang Boduan",
      "era_zh": "北宋",
      "era_en": "Northern Song",
      "content_zh": "道教内丹学经典，与《周易参同契》并称丹经之祖。以诗词形式阐述内丹修炼原理，主张\"性命双修\"，先修命后修性，是内丹南宗根本经典。",
      "content_en": "A Daoist inner alchemy classic, paired with the Cantongqi as foundational alchemy texts. Uses poetry to expound inner elixir cultivation, advocating 'dual cultivation of nature and destiny.' The root text of the Southern Lineage of inner alchemy."
    },
    {
      "id": "hx041",
      "cat": "buddhist",
      "title_zh": "十善业道经",
      "title_en": "The Sutra on the Ten Virtuous Actions",
      "author_zh": "唐·实叉难陀译",
      "author_en": "Trans. Sikshananda (Tang)",
      "era_zh": "唐代",
      "era_en": "Tang Dynasty",
      "content_zh": "佛教劝善根本经典。阐述十善业：不杀生、不偷盗、不邪淫、不妄语、不两舌、不恶口、不绮语、不贪、不嗔、不痴。龙王请问，佛说十善为一切善法根本。",
      "content_en": "A fundamental Buddhist moral sutra. Describes ten virtuous actions: not killing, stealing, sexual misconduct, lying, divisive speech, harsh words, idle chatter, covetousness, anger, and wrong views. The Buddha teaches these as the foundation of all wholesome dharmas."
    },
    {
      "id": "hx042",
      "cat": "buddhist",
      "title_zh": "地藏菩萨本愿经",
      "title_en": "The Sutra of Ksitigarbha Bodhisattva's Fundamental Vows",
      "author_zh": "唐·实叉难陀译",
      "author_en": "Trans. Sikshananda (Tang)",
      "era_zh": "唐代",
      "era_en": "Tang Dynasty",
      "content_zh": "佛教孝道与因果经典。地藏菩萨发愿\"地狱不空，誓不成佛\"。详述地狱苦报、因果轮回，强调孝亲报恩、布施修福，是民间流传最广的佛经之一。",
      "content_en": "A Buddhist sutra on filial piety and karma. Ksitigarbha vows 'not to become a Buddha until all hells are empty.' Details hellish retributions and karmic cycles, emphasizing filial gratitude and charitable giving. One of the most popular Buddhist texts in folk culture."
    },
    {
      "id": "hx043",
      "cat": "buddhist",
      "title_zh": "金刚经",
      "title_en": "The Diamond Sutra",
      "author_zh": "鸠摩罗什译",
      "author_en": "Trans. Kumarajiva",
      "era_zh": "后秦",
      "era_en": "Later Qin",
      "content_zh": "般若部根本经典。阐述\"凡所有相，皆是虚妄\"\"应无所住而生其心\"。以金刚般若智慧斩断一切执着，破相显性，是禅宗印心经典，影响中华思想极深。",
      "content_en": "A fundamental Prajnaparamita text. Teaches 'all appearances are illusory' and 'one should give rise to the mind without dwelling anywhere.' Uses diamond-like wisdom to sever all attachments. The certification text of Chan/Zen Buddhism."
    },
    {
      "id": "hx044",
      "cat": "buddhist",
      "title_zh": "心经",
      "title_en": "The Heart Sutra",
      "author_zh": "玄奘译",
      "author_en": "Trans. Xuanzang",
      "era_zh": "唐代",
      "era_en": "Tang Dynasty",
      "content_zh": "般若经精要，仅260字。\"色不异空，空不异色；色即是空，空即是色\"\"心无挂碍，无有恐怖\"。浓缩般若智慧精髓，是流传最广的佛经。",
      "content_en": "The essence of Prajnaparamita in just 260 characters. 'Form is not different from emptiness; emptiness is not different from form.' 'With no obstacles in the mind, there is no fear.' The most widely circulated Buddhist scripture."
    },
    {
      "id": "hx045",
      "cat": "buddhist",
      "title_zh": "阿弥陀经",
      "title_en": "The Amitabha Sutra",
      "author_zh": "鸠摩罗什译",
      "author_en": "Trans. Kumarajiva",
      "era_zh": "后秦",
      "era_en": "Later Qin",
      "content_zh": "净土宗根本经典之一。描述西方极乐世界依正庄严，教人信愿念佛、求生净土。\"不可以少善根福德因缘得生彼国\"，强调信、愿、行三资粮。",
      "content_en": "A foundational Pure Land sutra. Describes the Western Pure Land's splendor and teaches faith, vow, and Buddha-recitation as the means of rebirth. 'One cannot be born there with few good roots, blessings, and karmic conditions.'"
    },
    {
      "id": "hx046",
      "cat": "buddhist",
      "title_zh": "法华经",
      "title_en": "The Lotus Sutra",
      "author_zh": "鸠摩罗什译",
      "author_en": "Trans. Kumarajiva",
      "era_zh": "后秦",
      "era_en": "Later Qin",
      "content_zh": "大乘经典之王。核心思想：\"会三归一\"\"开示悟入佛之知见\"\"一切众生皆可成佛\"。以七种譬喻阐述一乘佛法，是天台宗根本经典。",
      "content_en": "The king of Mahayana sutras. Core teachings: 'unifying the three vehicles into one,' 'revealing the Buddha's knowledge and vision,' and 'all beings can become Buddhas.' Uses seven parables to expound the One Vehicle. The foundational text of the Tiantai school."
    },
    {
      "id": "hx047",
      "cat": "buddhist",
      "title_zh": "楞严经",
      "title_en": "The Surangama Sutra",
      "author_zh": "般剌密帝译",
      "author_en": "Trans. Paramiti",
      "era_zh": "唐代",
      "era_en": "Tang Dynasty",
      "content_zh": "大乘修行宝典。详述二十五圆通法门、楞严咒、四种清净明诲、五十阴魔等。以\"楞严大定\"为旨归，破妄显真，是禅修理论的重要经典。",
      "content_en": "A Mahayana practice treasure. Details 25 methods of enlightenment, the Surangama Mantra, four pure precepts, and 50 demon-states. Centered on the Surangama Samadhi, it exposes illusion to reveal truth. Essential for meditation theory."
    },
    {
      "id": "hx048",
      "cat": "buddhist",
      "title_zh": "华严经",
      "title_en": "The Avatamsaka Sutra",
      "author_zh": "佛陀跋陀罗译",
      "author_en": "Trans. Buddhabhadra",
      "era_zh": "东晋",
      "era_en": "Eastern Jin",
      "content_zh": "大乘佛教最重要经典之一。阐述\"一即一切，一切即一\"的法界缘起观，普贤菩萨十大愿王导归极乐。\"不忘初心，成佛有余\"等思想影响深远。",
      "content_en": "One of the most important Mahayana sutras. Expounds the 'one is all, all is one' view of interdependent origination. Samantabhadra's Ten Great Vows guide practitioners to the Pure Land. 'Never forget the initial aspiration, and Buddhahood is assured.'"
    },
    {
      "id": "hx049",
      "cat": "buddhist",
      "title_zh": "六祖坛经",
      "title_en": "The Platform Sutra of the Sixth Patriarch",
      "author_zh": "惠能",
      "author_en": "Huineng",
      "era_zh": "唐代",
      "era_en": "Tang Dynasty",
      "content_zh": "唯一被尊为\"经\"的中国僧人著作。六祖惠能讲述禅宗心法：\"菩提本无树，明镜亦非台，本来无一物，何处惹尘埃。\"强调顿悟自性、见性成佛。",
      "content_en": "The only Chinese Buddhist work honored with the title 'Sutra.' Sixth Patriarch Huineng's teachings on Chan essence: 'Bodhi originally has no tree; the bright mirror has no stand. Originally there is not a single thing—where could dust alight?' Emphasizes sudden awakening to one's true nature."
    },
    {
      "id": "hx050",
      "cat": "buddhist",
      "title_zh": "四十二章经",
      "title_en": "The Sutra of Forty-Two Sections",
      "author_zh": "迦叶摩腾译",
      "author_en": "Trans. Kasyapa Matanga",
      "era_zh": "东汉",
      "era_en": "Eastern Han",
      "content_zh": "中国第一部汉译佛经。四十二章佛言精要，涵盖持戒、布施、忍辱、精进等修行要义。文字简练，义理精深，是佛教入华的奠基之作。",
      "content_en": "The first Buddhist sutra translated into Chinese. Forty-two sections of the Buddha's essential teachings covering precepts, charity, patience, and diligence. Concise and profound—the foundational text of Buddhism in China."
    },
    {
      "id": "hx051",
      "cat": "buddhist",
      "title_zh": "八大人觉经",
      "title_en": "The Sutra on the Eight Realizations of the Great Beings",
      "author_zh": "安世高译",
      "author_en": "Trans. An Shigao",
      "era_zh": "东汉",
      "era_en": "Eastern Han",
      "content_zh": "简明佛理入门经典。八种觉悟：世间无常、多欲为苦、心无厌足、懈怠堕落、愚痴生死、贫苦多怨、五欲过患、生死炽然。教导发菩提心、修菩萨道。",
      "content_en": "A concise Buddhist primer. Eight realizations: the world is impermanent, desire brings suffering, the mind is never satisfied, laziness leads to decline, ignorance causes rebirth, poverty breeds resentment, sensual desire is dangerous, and the cycle of birth and death burns fiercely."
    },
    {
      "id": "hx052",
      "cat": "buddhist",
      "title_zh": "佛说父母恩重难报经",
      "title_en": "The Sutra on the Profound Kindness of Parents",
      "author_zh": "佚名译",
      "author_en": "Anonymous translation",
      "era_zh": "唐代",
      "era_en": "Tang Dynasty",
      "content_zh": "佛教孝道经典。详述父母十大恩德：怀胎守护、临产受苦、生子忘忧、咽苦吐甘、回干就湿、哺乳养育、洗濯不净、远行忆念、深加体恤、究竟怜愍。劝人孝亲报恩。",
      "content_en": "A Buddhist sutra on filial piety. Details ten kindnesses of parents: protecting the fetus, suffering childbirth, forgetting pain at birth, swallowing the bitter and spitting the sweet, drying the wet for the child, nursing, washing the unclean, remembering when traveling, deep care, and ultimate compassion."
    },
    {
      "id": "hx053",
      "cat": "buddhist",
      "title_zh": "药师经",
      "title_en": "The Medicine Buddha Sutra",
      "author_zh": "玄奘译",
      "author_en": "Trans. Xuanzang",
      "era_zh": "唐代",
      "era_en": "Tang Dynasty",
      "content_zh": "药师琉璃光如来本愿功德经。药师佛发十二大愿，救度众生疾病、贫困、灾难。强调现世利益与出世修行的统一，是消灾延寿信仰的根本经典。",
      "content_en": "The sutra of Medicine Buddha's fundamental vows. Medicine Buddha made twelve great vows to relieve beings of illness, poverty, and disaster. Unifies worldly benefits with transcendent practice. The root text of healing and longevity devotion."
    },
    {
      "id": "hx054",
      "cat": "buddhist",
      "title_zh": "普贤行愿品",
      "title_en": "The Practices and Vows of Samantabhadra",
      "author_zh": "般若译",
      "author_en": "Trans. Prajna",
      "era_zh": "唐代",
      "era_en": "Tang Dynasty",
      "content_zh": "《华严经》末品，普贤菩萨十大愿王：礼敬诸佛、称赞如来、广修供养、忏悔业障、随喜功德、请转法轮、请佛住世、常随佛学、恒顺众生、普皆回向。导归极乐。",
      "content_en": "The final chapter of the Avatamsaka Sutra. Samantabhadra's Ten Great Vows: revering all Buddhas, praising them, making offerings, confessing misdeeds, rejoicing in merit, requesting teachings, asking Buddhas to remain, following their teachings, accommodating beings, and dedicating all merit."
    },
    {
      "id": "hx055",
      "cat": "buddhist",
      "title_zh": "优婆塞戒经",
      "title_en": "The Sutra of Upasaka Precepts",
      "author_zh": "昙无谶译",
      "author_en": "Trans. Dharmaksema",
      "era_zh": "北凉",
      "era_en": "Northern Liang",
      "content_zh": "在家居士戒律经典。详述在家菩萨应受持的六重戒、二十八轻戒，以及布施、持戒、忍辱等菩萨行。为在家修行者提供了系统的行为规范。",
      "content_en": "A sutra on lay Buddhist precepts. Details six major and twenty-eight minor precepts for lay bodhisattvas, plus practices of giving, discipline, and patience. Provides a systematic ethical framework for lay practitioners."
    },
    {
      "id": "hx056",
      "cat": "family",
      "title_zh": "钱氏家训",
      "title_en": "The Qian Family Instructions",
      "author_zh": "钱镠",
      "author_en": "Qian Liu",
      "era_zh": "五代",
      "era_en": "Five Dynasties",
      "content_zh": "吴越王钱镠留给子孙的家训。分个人、家庭、社会、国家四篇。\"利在一身勿谋也，利在天下者必谋之\"等理念，造就了钱氏家族千年人才辈出的奇迹。",
      "content_en": "Family instructions from King Qian Liu of Wuyue. Four sections: personal, family, social, and national. 'Do not seek what benefits only yourself; must seek what benefits the whole world.' These principles produced the Qian family's millennium of extraordinary talent."
    },
    {
      "id": "hx057",
      "cat": "family",
      "title_zh": "诸葛亮诫子书",
      "title_en": "Zhuge Liang's Letter to His Son",
      "author_zh": "诸葛亮",
      "author_en": "Zhuge Liang",
      "era_zh": "三国",
      "era_en": "Three Kingdoms",
      "content_zh": "诸葛亮写给八岁儿子的家书。\"夫君子之行，静以修身，俭以养德。非淡泊无以明志，非宁静无以致远。\"短短八十六字，浓缩修身立志之精华，影响深远。",
      "content_en": "Zhuge Liang's letter to his eight-year-old son. 'The conduct of the superior person is quiet to cultivate the self, frugal to nurture virtue. Without detachment, one cannot clarify one's aspirations; without stillness, one cannot reach far.' Eighty-six characters distilling the essence of self-cultivation."
    },
    {
      "id": "hx058",
      "cat": "family",
      "title_zh": "曾国藩家书",
      "title_en": "The Family Letters of Zeng Guofan",
      "author_zh": "曾国藩",
      "author_en": "Zeng Guofan",
      "era_zh": "清代",
      "era_en": "Qing Dynasty",
      "content_zh": "曾国藩写给家人的书信集。强调\"勤、俭、刚、明、忠、恕、谦、浑\"八字家训。论修身、读书、处事、治军之道，被誉为\"千古家训第一书\"。",
      "content_en": "A collection of Zeng Guofan's family letters. Emphasizes eight virtues: diligence, frugality, firmness, clarity, loyalty, forgiveness, humility, and integrity. Discusses self-cultivation, study, conduct, and military leadership. Hailed as 'the greatest family instructions in history.'"
    },
    {
      "id": "hx059",
      "cat": "family",
      "title_zh": "包拯家训",
      "title_en": "Bao Zheng's Family Instructions",
      "author_zh": "包拯",
      "author_en": "Bao Zheng",
      "era_zh": "宋代",
      "era_en": "Song Dynasty",
      "content_zh": "包公留给子孙的铁面家训：\"后世子孙仕宦，有犯赃滥者，不得放归本家；亡殁之后，不得葬于大茔之中。\"以廉洁为家训核心，体现\"清官\"精神传承。",
      "content_en": "The incorruptible official Bao Zheng's family decree: 'Any descendant who serves as an official and commits corruption shall not return to the family; after death, shall not be buried in the family tomb.' Integrity as the family's core value."
    },
    {
      "id": "hx060",
      "cat": "family",
      "title_zh": "陆游家训",
      "title_en": "Lu You's Family Instructions",
      "author_zh": "陆游",
      "author_en": "Lu You",
      "era_zh": "宋代",
      "era_en": "Song Dynasty",
      "content_zh": "南宋诗人陆游写给子孙的家训诗文。强调\"后生才锐者，最易坏\"须严加约束；\"天下之事，常成于困约，而败于奢靡\"。倡导勤学、节俭、爱国、忧民。",
      "content_en": "Southern Song poet Lu You's instructions to his descendants. Warns that 'talented youth are most easily corrupted' and 'affairs of the world succeed through hardship and fail through extravagance.' Advocates diligence, frugality, patriotism, and concern for the people."
    },
    {
      "id": "hx061",
      "cat": "family",
      "title_zh": "司马光家训",
      "title_en": "Sima Guang's Family Instructions",
      "author_zh": "司马光",
      "author_en": "Sima Guang",
      "era_zh": "宋代",
      "era_en": "Song Dynasty",
      "content_zh": "即《温公家范》。司马光以历史人物为范例，论述治家之道。\"有德者皆由俭来也，俭则寡欲\"\"遗金于子孙，子孙未必能守\"等思想，强调以德传家。",
      "content_en": "Also known as 'Family Models by Wen Gong.' Uses historical figures as examples to discuss household management. 'Those with virtue all come from frugality; frugal people have few desires' and 'leaving gold to descendants, they may not be able to keep it.' Emphasizes passing on virtue, not wealth."
    },
    {
      "id": "hx062",
      "cat": "family",
      "title_zh": "郑板桥家书",
      "title_en": "Zheng Banqiao's Family Letters",
      "author_zh": "郑板桥",
      "author_en": "Zheng Banqiao",
      "era_zh": "清代",
      "era_en": "Qing Dynasty",
      "content_zh": "清代书画家郑板桥写给堂弟的家书。\"难得糊涂\"\"吃亏是福\"等理念贯穿其中。强调爱民、助人、读书明理，以平等博爱之心待人处世。",
      "content_en": "Family letters from Qing artist Zheng Banqiao to his cousin. Permeated by concepts like 'rare is foolishness' and 'taking a loss is a blessing.' Emphasizes loving the people, helping others, and studying—with an egalitarian, compassionate approach to life."
    },
    {
      "id": "hx063",
      "cat": "family",
      "title_zh": "王阳明家训",
      "title_en": "Wang Yangming's Family Instructions",
      "author_zh": "王阳明",
      "author_en": "Wang Yangming",
      "era_zh": "明代",
      "era_en": "Ming Dynasty",
      "content_zh": "王阳明写给儿子正宪的《示宪儿》。以三字诗形式教子：\"勤读书，要孝弟；学谦恭，循礼仪；节饮食，戒游戏\"等，体现心学大师的教子智慧。",
      "content_en": "Wang Yangming's 'Instructions for My Son Zhengxian.' A three-character verse teaching: 'Study diligently, be filial and fraternal; learn humility, follow propriety; moderate diet, avoid idle play.' The mind-philosopher's parenting wisdom."
    },
    {
      "id": "hx064",
      "cat": "family",
      "title_zh": "朱熹家训",
      "title_en": "Zhu Xi's Family Instructions",
      "author_zh": "朱熹",
      "author_en": "Zhu Xi",
      "era_zh": "宋代",
      "era_en": "Song Dynasty",
      "content_zh": "朱熹的《朱子家训》（不同于朱柏庐版）。\"君之所贵者仁也，臣之所贵者忠也，父之所贵者慈也，子之所贵者孝也\"，以各尽其分为家训核心。",
      "content_en": "Zhu Xi's family instructions (distinct from Zhu Bailu's version). 'What the ruler values is benevolence; the minister, loyalty; the father, compassion; the son, filial piety.' Each person fulfilling their role is the core principle."
    },
    {
      "id": "hx065",
      "cat": "family",
      "title_zh": "纪晓岚家书",
      "title_en": "Ji Xiaolan's Family Letters",
      "author_zh": "纪昀",
      "author_en": "Ji Yun",
      "era_zh": "清代",
      "era_en": "Qing Dynasty",
      "content_zh": "清代学者纪昀写给家人的书信。以\"四戒\"（戒晚起、戒懒惰、戒奢华、戒骄傲）和\"四宜\"（宜勤读、宜敬师、宜爱众、宜慎食）教导后人，朴实而深刻。",
      "content_en": "Qing scholar Ji Yun's family letters. Teaches 'Four Abstentions' (late rising, laziness, extravagance, arrogance) and 'Four Shoulds' (diligent reading, respecting teachers, loving all, careful eating). Simple yet profound."
    },
    {
      "id": "hx066",
      "cat": "family",
      "title_zh": "左宗棠家书",
      "title_en": "Zuo Zongtang's Family Letters",
      "author_zh": "左宗棠",
      "author_en": "Zuo Zongtang",
      "era_zh": "清代",
      "era_en": "Qing Dynasty",
      "content_zh": "左宗棠写给子女的家书。强调\"读书不为科名\"\"崇俭可以惠下\"\"做人要从难处做\"。以经世致用为旨，教导子女务实、勤俭、担当。",
      "content_en": "Qing official Zuo Zongtang's family letters. Emphasizes 'studying not for official rank,' 'frugality benefits those below,' and 'be a person starting from the difficult parts.' Teaches pragmatism, diligence, and responsibility."
    },
    {
      "id": "hx067",
      "cat": "family",
      "title_zh": "张英家训",
      "title_en": "Zhang Ying's Family Instructions",
      "author_zh": "张英",
      "author_en": "Zhang Ying",
      "era_zh": "清代",
      "era_en": "Qing Dynasty",
      "content_zh": "清代大学士张英的家训。著名故事\"六尺巷\"——\"千里修书只为墙，让他三尺又何妨\"。以谦让、宽容、读书、力田为家训核心，成就了张氏家族的显赫。",
      "content_en": "Qing Grand Secretary Zhang Ying's instructions. Famous for the 'Six-Foot Lane' story: 'Writing from a thousand miles just for a wall—letting them have three feet, what's the harm?' Core values: humility, tolerance, reading, and hard work."
    },
    {
      "id": "hx068",
      "cat": "family",
      "title_zh": "庞氏家训",
      "title_en": "The Pang Family Instructions",
      "author_zh": "庞尚鹏",
      "author_en": "Pang Shangpeng",
      "era_zh": "明代",
      "era_en": "Ming Dynasty",
      "content_zh": "明代庞尚鹏撰。以务本、节用、积善、训子弟为纲，详述家庭日常行为规范。\"孝友勤俭四字最为紧要\"，是明代家训的代表作之一。",
      "content_en": "By Ming scholar Pang Shangpeng. Organized around fundamentals, economy, virtue, and educating children. 'Filial piety, brotherly love, diligence, and frugality are most essential.' A representative Ming-era family instruction."
    },
    {
      "id": "hx069",
      "cat": "family",
      "title_zh": "许云邨家训",
      "title_en": "Xu Yuncun's Family Instructions",
      "author_zh": "许相卿",
      "author_en": "Xu Xiangqing",
      "era_zh": "明代",
      "era_en": "Ming Dynasty",
      "content_zh": "明代许相卿撰《许云邨家规》。分立心、立身、持家、教子等目，强调\"正心修身\"为齐家之本，以儒家伦理规范家庭成员行为。",
      "content_en": "Ming scholar Xu Xiangqing's family rules. Covers setting the mind, conducting oneself, managing the household, and educating children. Emphasizes 'rectifying the mind and cultivating the self' as the foundation of family management."
    },
    {
      "id": "hx070",
      "cat": "family",
      "title_zh": "双节堂庸训",
      "title_en": "Common Instructions from the Double Chastity Hall",
      "author_zh": "汪辉祖",
      "author_en": "Wang Huizu",
      "era_zh": "清代",
      "era_en": "Qing Dynasty",
      "content_zh": "清代汪辉祖撰。以亲身经历训诫子孙，分述养亲、教子、治家、处世、做人等。朴实真切，\"事亲不可不孝，待人不欺为本\"等言，为修身治家良箴。",
      "content_en": "By Qing scholar Wang Huizu. Uses personal experience to instruct descendants on serving parents, educating children, managing households, and conducting oneself. Sincere and practical maxims for family and self-cultivation."
    },
    {
      "id": "hx071",
      "cat": "persuasion",
      "title_zh": "万善先资",
      "title_en": "The Foremost Resource of All Good Deeds",
      "author_zh": "周安士",
      "author_en": "Zhou Anshi",
      "era_zh": "清代",
      "era_en": "Qing Dynasty",
      "content_zh": "《安士全书》之一部。专论戒杀放生之理，以因果实例和佛理分析阐述杀生之害、放生之福。\"天地之大德曰生\"，劝人慈悲护生。",
      "content_en": "Part of Anshi's Complete Book. Dedicated to the principles of abstaining from killing and releasing living beings. Uses karmic cases and Buddhist analysis to show the harm of killing and the merit of saving lives. 'The greatest virtue of Heaven and Earth is life.'"
    },
    {
      "id": "hx072",
      "cat": "persuasion",
      "title_zh": "欲海回狂",
      "title_en": "Turning Back from the Sea of Desire",
      "author_zh": "周安士",
      "author_en": "Zhou Anshi",
      "era_zh": "清代",
      "era_en": "Qing Dynasty",
      "content_zh": "《安士全书》之一部。专论戒邪淫之理。以大量因果实例说明淫欲之害，引用儒释道经典论证节欲之必要，是戒淫劝善的重要文献。",
      "content_en": "Part of Anshi's Complete Book. Dedicated to abstaining from sexual misconduct. Uses numerous karmic cases to demonstrate the harms of lust, citing Confucian, Daoist, and Buddhist classics to argue for the necessity of restraint."
    },
    {
      "id": "hx073",
      "cat": "persuasion",
      "title_zh": "不可录",
      "title_en": "The Record of What Must Not Be Done",
      "author_zh": "佚名",
      "author_en": "Anonymous",
      "era_zh": "明清",
      "era_en": "Ming-Qing",
      "content_zh": "戒邪淫善书，后经印光大师增补为《寿康宝鉴》。汇集历代因邪淫遭受恶报的真实案例，警醒世人远离邪淫、保全身心。",
      "content_en": "A moral book against sexual misconduct, later expanded by Master Yin Guang into 'Treasure of Longevity and Health.' Collects real cases of karmic retribution for lust, warning people to stay away from sexual misconduct."
    },
    {
      "id": "hx074",
      "cat": "persuasion",
      "title_zh": "戒杀放生文",
      "title_en": "Essay on Abstaining from Killing and Releasing Lives",
      "author_zh": "莲池大师",
      "author_en": "Master Lianchi",
      "era_zh": "明代",
      "era_en": "Ming Dynasty",
      "content_zh": "明代高僧莲池大师著。以慈悲心阐述戒杀放生之理，\"疾病之由，多从杀生中来\"\"放生者，增福增寿\"。文字恳切，影响深远，是佛教放生运动的理论基础。",
      "content_en": "By Ming monk Master Lianchi. Explains the principles of not killing and releasing lives with compassion. 'Illness often comes from killing' and 'releasing lives increases blessings and longevity.' The theoretical basis for Buddhist life-release practices."
    },
    {
      "id": "hx075",
      "cat": "persuasion",
      "title_zh": "自知录",
      "title_en": "The Record of Self-Knowledge",
      "author_zh": "莲池大师",
      "author_en": "Master Lianchi",
      "era_zh": "明代",
      "era_en": "Ming Dynasty",
      "content_zh": "莲池大师编撰的功过格。将日常善恶行为量化打分，善事记功、恶事记过，定期核算以自省。\"一日不知非，便一日安于自是\"，是自省修身的实用工具。",
      "content_en": "A merit ledger compiled by Master Lianchi. Quantifies daily good and bad deeds with points—merit for good, demerit for bad—tallied regularly for self-reflection. 'A day without knowing one's faults is a day complacent in self-righteousness.' A practical self-cultivation tool."
    },
    {
      "id": "hx076",
      "cat": "persuasion",
      "title_zh": "功过格",
      "title_en": "The Merit and Demerit Ledger",
      "author_zh": "佚名",
      "author_en": "Anonymous",
      "era_zh": "明清",
      "era_en": "Ming-Qing",
      "content_zh": "善书运动的核心实践工具。将善恶行为量化为功过分数，日日记录、月月核算。如\"救人一命五十功\"\"杀生一命五十过\"等，是明清善书文化的重要载体。",
      "content_en": "The core practical tool of the moral books movement. Quantifies good and evil deeds into merit/demerit points, recorded daily and tallied monthly. For example, 'saving a life: 50 merit points; killing a life: 50 demerit points.' A key vehicle of Ming-Qing moral culture."
    },
    {
      "id": "hx077",
      "cat": "persuasion",
      "title_zh": "文昌孝经",
      "title_en": "Wenchang's Classic of Filial Piety",
      "author_zh": "佚名（道教）",
      "author_en": "Anonymous (Daoist)",
      "era_zh": "明清",
      "era_en": "Ming-Qing",
      "content_zh": "道教孝道经典。以文昌帝君口吻论述孝道，分开经、育子、体亲、辩孝、守身等章。将孝道扩展至\"天地之孝\"，融通儒道，是道教劝孝的代表作品。",
      "content_en": "A Daoist classic on filial piety. Written in Wenchang Dijun's voice, covering chapters on educating children, understanding parents, defining filial piety, and protecting the body. Extends filial piety to 'filial piety toward Heaven and Earth.'"
    },
    {
      "id": "hx078",
      "cat": "persuasion",
      "title_zh": "真武帝君劝孝文",
      "title_en": "Lord Zhenwu's Essay on Filial Piety",
      "author_zh": "佚名（道教）",
      "author_en": "Anonymous (Daoist)",
      "era_zh": "明清",
      "era_en": "Ming-Qing",
      "content_zh": "以真武大帝降笔形式劝人行孝。论述\"百行孝为先\"之理，以因果报应警示不孝之罪，以福报功德鼓励行孝之善，是道教劝孝善书之一。",
      "content_en": "A Daoist moral tract revealed by Lord Zhenwu urging filial piety. Argues 'of all virtues, filial piety comes first,' using karmic retribution to warn against unfilial conduct and blessings to encourage filial behavior."
    },
    {
      "id": "hx079",
      "cat": "persuasion",
      "title_zh": "关圣帝君戒淫经",
      "title_en": "Lord Guan's Classic on Abstaining from Lust",
      "author_zh": "佚名（道教）",
      "author_en": "Anonymous (Daoist)",
      "era_zh": "清代",
      "era_en": "Qing Dynasty",
      "content_zh": "以关帝降笔形式劝戒邪淫。列举因邪淫而败德亡身、家破人亡的历史实例，以关帝忠义之威严警示世人，\"万恶淫为首\"理念的体现。",
      "content_en": "A moral text revealed by Lord Guan warning against sexual misconduct. Lists historical cases of ruin caused by lust, using Lord Guan's righteous authority to warn people. Embodies the principle 'of all evils, lust is the foremost.'"
    },
    {
      "id": "hx080",
      "cat": "persuasion",
      "title_zh": "玄天上帝金科玉律",
      "title_en": "The Golden Rules of the Dark Heavenly Emperor",
      "author_zh": "佚名（道教）",
      "author_en": "Anonymous (Daoist)",
      "era_zh": "明清",
      "era_en": "Ming-Qing",
      "content_zh": "以玄天上帝（真武大帝）名义颁布的劝善律条。列举三十六条善行、三十六条恶行，以\"金科玉律\"之名强调其权威性，是道教善书体系的重要组成。",
      "content_en": "Moral commandments issued in the name of the Dark Heavenly Emperor (Lord Zhenwu). Lists 36 virtues and 36 vices, using the authoritative title 'Golden Rules' to emphasize their binding nature."
    },
    {
      "id": "hx081",
      "cat": "maxims",
      "title_zh": "格言联璧",
      "title_en": "A Collection of Maxims",
      "author_zh": "金缨",
      "author_en": "Jin Ying",
      "era_zh": "清代",
      "era_en": "Qing Dynasty",
      "content_zh": "清代格言集大成。分学问、存养、持躬、敦品、处事、接物、齐家、从政、惠吉等类。\"静坐常思己过，闲谈莫论人非\"等格言广为流传，是修身处世的实用手册。",
      "content_en": "A Qing-era comprehensive collection of maxims. Categorized by study, self-cultivation, conduct, character, affairs, social interaction, family, governance, and fortune. 'In quiet sitting, always reflect on your own faults; in idle talk, never discuss others' shortcomings.' A practical handbook for self-cultivation."
    },
    {
      "id": "hx082",
      "cat": "maxims",
      "title_zh": "增广贤文",
      "title_en": "The Enlarged Collection of Moral Sayings",
      "author_zh": "佚名",
      "author_en": "Anonymous",
      "era_zh": "明清",
      "era_en": "Ming-Qing",
      "content_zh": "民间格言谚语汇编。\"近朱者赤，近墨者黑\"\"善有善报，恶有恶报\"\"一年之计在于春，一日之计在于晨\"等，汇集历代民间智慧，语言通俗，流传极广。",
      "content_en": "A collection of folk maxims and proverbs. Includes 'Near vermilion, one becomes red; near ink, one becomes black,' 'Good is rewarded with good; evil with evil,' and 'The year's plan starts in spring; the day's plan starts in the morning.' Extremely popular and accessible."
    },
    {
      "id": "hx083",
      "cat": "maxims",
      "title_zh": "明心宝鉴",
      "title_en": "The Precious Mirror for Illuminating the Mind",
      "author_zh": "范立本",
      "author_en": "Fan Liben",
      "era_zh": "明代",
      "era_en": "Ming Dynasty",
      "content_zh": "明代流传最广的蒙学善书之一。分继善、天理、顺命、孝行、正心等二十篇，汇集儒释道格言。曾被翻译为多国文字，是中国最早走向世界的善书。",
      "content_en": "One of the most widely circulated Ming-era moral primers. Twenty chapters including continuing good deeds, heavenly principles, accepting fate, filial conduct, and rectifying the mind. Translated into multiple languages—one of China's first moral books to reach the world."
    },
    {
      "id": "hx084",
      "cat": "maxims",
      "title_zh": "小儿语",
      "title_en": "Words for Children",
      "author_zh": "吕得胜",
      "author_en": "Lu Desheng",
      "era_zh": "明代",
      "era_en": "Ming Dynasty",
      "content_zh": "明代吕得胜编撰的童蒙格言。以四言韵语形式编写，\"一切言动，都要安详；十差九错，只为慌张\"等，用儿童能懂的语言传授做人道理。",
      "content_en": "A Ming-era children's primer by Lu Desheng. Written in four-character rhyming verse: 'In all words and actions, be calm and composed; nine out of ten mistakes come from rushing.' Teaches moral principles in language children can understand."
    },
    {
      "id": "hx085",
      "cat": "maxims",
      "title_zh": "续小儿语",
      "title_en": "Continued Words for Children",
      "author_zh": "吕坤",
      "author_en": "Lu Kun",
      "era_zh": "明代",
      "era_en": "Ming Dynasty",
      "content_zh": "吕坤续其父之作。以更深刻的内容继续教化儿童，\"要好人，须寻好友；闭邪存诚，勿慎勿欺\"等，将修身格言融入童蒙教育。",
      "content_en": "Lu Kun's continuation of his father's work. More profound content for children: 'To be a good person, seek good friends; guard against evil and preserve sincerity, do not be careless, do not deceive.' Integrates self-cultivation maxims into childhood education."
    },
    {
      "id": "hx086",
      "cat": "maxims",
      "title_zh": "女四书",
      "title_en": "The Four Books for Women",
      "author_zh": "班昭等",
      "author_en": "Ban Zhao et al.",
      "era_zh": "汉至明",
      "era_en": "Han to Ming",
      "content_zh": "古代女子教育经典汇编。含《女诫》（班昭）、《内训》（徐皇后）、《女论语》（宋若昭）、《女范捷录》（王相母）。论述女子修身、相夫、教子之道，影响深远。",
      "content_en": "An anthology of classical works on women's education. Includes Ban Zhao's 'Precepts for Women,' Empress Xu's 'Inner Training,' Song Ruozhao's 'Analects for Women,' and others. Discusses women's self-cultivation, supporting husbands, and educating children."
    },
    {
      "id": "hx087",
      "cat": "maxims",
      "title_zh": "女孝经",
      "title_en": "The Classic of Filial Piety for Women",
      "author_zh": "郑氏",
      "author_en": "Lady Zheng",
      "era_zh": "唐代",
      "era_en": "Tang Dynasty",
      "content_zh": "唐代郑氏撰。模仿《孝经》体例，分十八章论述女子孝道。从\"后妃之孝\"到\"庶人之孝\"，将孝道理念系统引入女性教育。",
      "content_en": "By Tang-era Lady Zheng, modeled on the Classic of Filial Piety. Eighteen chapters on women's filial piety, from empresses to commoners. Systematically introduces filial piety into female education."
    },
    {
      "id": "hx088",
      "cat": "maxims",
      "title_zh": "省心短语",
      "title_en": "Brief Phrases for Self-Reflection",
      "author_zh": "佚名",
      "author_en": "Anonymous",
      "era_zh": "明清",
      "era_en": "Ming-Qing",
      "content_zh": "汇集历代修身省心格言。\"心不负人，面无惭色\"\"做事不可不存长远心\"等，以简短有力的语句提醒世人时时反省、处处修行。",
      "content_en": "A collection of self-reflection maxims from various dynasties. 'If the heart doesn't betray others, the face shows no shame' and 'In all actions, one must have long-term vision.' Concise reminders for constant self-examination."
    },
    {
      "id": "hx089",
      "cat": "maxims",
      "title_zh": "朱子语类·修身",
      "title_en": "Zhu Xi's Classified Conversations: Self-Cultivation",
      "author_zh": "朱熹",
      "author_en": "Zhu Xi",
      "era_zh": "宋代",
      "era_en": "Song Dynasty",
      "content_zh": "朱熹语录中关于修身部分。\"存天理，灭人欲\"\"主敬穷理\"\"格物致知\"等思想，是宋代理学修身的理论核心，影响中国思想史八百年。",
      "content_en": "Excerpts from Zhu Xi's recorded conversations on self-cultivation. 'Preserve heavenly principle, eliminate human desire,' 'reverence and investigation of principle,' and 'investigating things to extend knowledge.' The theoretical core of Neo-Confucian self-cultivation."
    },
    {
      "id": "hx090",
      "cat": "maxims",
      "title_zh": "潜书",
      "title_en": "The Hidden Book",
      "author_zh": "唐甄",
      "author_en": "Tang Zhen",
      "era_zh": "清初",
      "era_en": "Early Qing",
      "content_zh": "清初思想家唐甄著。以\"潜\"名之，意为藏之名山。论述修身、治学、治国之道，\"自天子至于庶人，皆以修身为本\"，具有启蒙思想色彩。",
      "content_en": "By early Qing thinker Tang Zhen. Titled 'Hidden' to suggest storing it away. Discusses self-cultivation, study, and governance: 'From emperor to commoner, all must take self-cultivation as the foundation.' Contains Enlightenment-era thinking."
    },
    {
      "id": "hx091",
      "cat": "modern",
      "title_zh": "王凤仪言行录",
      "title_en": "The Words and Deeds of Wang Fengyi",
      "author_zh": "王凤仪",
      "author_en": "Wang Fengyi",
      "era_zh": "清末民初",
      "era_en": "Late Qing / Early Republic",
      "content_zh": "民间教育家王凤仪的言行记录。以\"性理疗病\"\"化性\"闻名。核心思想：找好处、认不是、不怨人。强调\"不生气、不上火\"、伦常道德，是近代民间善书的代表。",
      "content_en": "Records of folk educator Wang Fengyi, known for 'nature-based healing' and 'transforming temperament.' Core teachings: find others' good points, acknowledge your own faults, and don't complain. Emphasizes emotional equanimity and moral ethics. A representative modern folk moral text."
    },
    {
      "id": "hx092",
      "cat": "modern",
      "title_zh": "王凤仪十二字薪传",
      "title_en": "Wang Fengyi's Twelve-Character Legacy",
      "author_zh": "王凤仪",
      "author_en": "Wang Fengyi",
      "era_zh": "民国",
      "era_en": "Republic of China",
      "content_zh": "王凤仪以\"性、心、身\"三界和\"木、火、土、金、水\"五行理论阐述修身化性之法。十二字：\"不怨人、找好处、认不是\"，简明而深刻，是化性修身的实用指南。",
      "content_en": "Wang Fengyi's framework of 'nature, mind, body' three realms and 'wood, fire, earth, metal, water' five elements for self-transformation. Twelve characters: 'Don't complain, find good points, acknowledge faults.' A concise yet profound guide to character transformation."
    },
    {
      "id": "hx093",
      "cat": "modern",
      "title_zh": "宣化上人开示录",
      "title_en": "Master Xuanhua's Dharma Talks",
      "author_zh": "宣化上人",
      "author_en": "Master Xuanhua",
      "era_zh": "现代",
      "era_en": "Modern",
      "content_zh": "当代高僧宣化上人的开示集。强调\"不争、不贪、不求、不自私、不自利、不打妄语\"六大宗旨。以戒律严谨著称，将佛教修行落实于日常生活。",
      "content_en": "A collection of contemporary monk Master Xuanhua's teachings. Emphasizes six principles: 'Do not contend, do not be greedy, do not seek, do not be selfish, do not pursue self-interest, do not lie.' Known for strict discipline, applying Buddhist practice to daily life."
    },
    {
      "id": "hx094",
      "cat": "modern",
      "title_zh": "印光大师文钞",
      "title_en": "The Collected Writings of Master Yin Guang",
      "author_zh": "印光大师",
      "author_en": "Master Yin Guang",
      "era_zh": "民国",
      "era_en": "Republic of China",
      "content_zh": "净土宗第十三祖印光大师的文集。强调\"敦伦尽分，闲邪存诚\"\"深信因果，老实念佛\"。以书信形式解答修行疑问，文字恳切，影响极大的近现代善书。",
      "content_en": "The collected writings of Master Yin Guang, 13th Patriarch of Pure Land Buddhism. Emphasizes 'fulfill your duties, guard against evil, preserve sincerity' and 'deeply believe in karma, sincerely recite Buddha's name.' His letters answer practice questions with earnest, accessible wisdom."
    },
    {
      "id": "hx095",
      "cat": "modern",
      "title_zh": "弘一大师文集",
      "title_en": "The Collected Works of Master Hongyi",
      "author_zh": "弘一法师",
      "author_en": "Master Hongyi",
      "era_zh": "民国",
      "era_en": "Republic of China",
      "content_zh": "近代高僧弘一法师（李叔同）著。以\"以戒为师\"为核心，强调\"惜福\"\"慎独\"\"勤俭\"。将南山律宗精神融入现代生活，是近现代佛教修身的典范。",
      "content_en": "Works of modern monk Master Hongyi (Li Shutong). Centered on 'taking precepts as teacher,' emphasizing 'cherishing blessings, watchfulness when alone, diligence and frugality.' Integrates Nanshan Vinaya spirit into modern life. A model of modern Buddhist self-cultivation."
    },
    {
      "id": "hx096",
      "cat": "modern",
      "title_zh": "虚云老和尚开示",
      "title_en": "The Teachings of Elder Master Xuyun",
      "author_zh": "虚云老和尚",
      "author_en": "Elder Master Xuyun",
      "era_zh": "现代",
      "era_en": "Modern",
      "content_zh": "禅宗泰斗虚云老和尚的开示集。强调\"参禅念佛，先须克己\"\"以戒为本\"。历经五帝四朝，一身肩挑禅宗五脉，其开示朴实深刻，是现代禅修的重要指导。",
      "content_en": "Teachings of Chan Buddhism titan Elder Master Xuyun. Emphasizes 'before meditating or reciting Buddha's name, first discipline yourself' and 'precepts as the foundation.' Lived through five dynasties, inherited five Chan lineages. His teachings are direct and profound."

    {

      "title_zh": "净空法师开示选",
      "title_en": "Selected Teachings of Master Chin Kung",

    {

  "global": [
    {
      "id": "gb001",
      "cat": "eastern",
      "title_zh": "博伽梵歌",
      "title_en": "Bhagavad Gita",
      "author_zh": "毗耶娑",
      "author_en": "Vyasa",
      "era_zh": "古印度",
      "era_en": "Ancient India",
      "content_zh": "印度教最神圣的经典。以阿周那与黑天在战场上的对话为框架，阐述行动瑜伽（无执着地行动）、知识瑜伽、奉爱瑜伽三条解脱之道。\"做你该做的事，不要执着于结果\"影响深远。",
      "content_en": "Hinduism's most sacred text. A dialogue between Arjuna and Krishna on the battlefield, expounding three paths to liberation: Karma Yoga (selfless action), Jnana Yoga (knowledge), and Bhakti Yoga (devotion). 'Do what is right without attachment to results' has influenced thinkers worldwide."
    },
    {
      "id": "gb002",
      "cat": "eastern",
      "title_zh": "法句经",
      "title_en": "The Dhammapada",

      "content_en": "One of Buddhism's oldest scriptures. 423 verses distilling the Buddha's essential teachings. 'Mind precedes all things; mind is their chief.' 'Hatred never ceases by hatred; by non-hatred alone does it cease.' Profound wisdom in concise verse."
    },
    {
      "id": "gb003",
      "cat": "eastern",
      "title_zh": "古兰经",
      "title_en": "The Quran",
      "author_zh": "穆罕默德传",
      "author_en": "Revealed to Prophet Muhammad",
      "era_zh": "7世纪",
      "era_en": "7th Century",

      "content_en": "The foundational scripture of Islam. A comprehensive guide to faith and life for Muslims, covering belief, ethics, law, and social order. Emphasizes monotheism, compassion, justice, and charity. Shapes the spiritual world of over a billion Muslims."
    },
    {
      "id": "gb004",
      "cat": "eastern",
      "title_zh": "圣经",
      "title_en": "The Bible",
      "author_zh": "多位作者",
      "author_en": "Multiple authors",
      "era_zh": "古代至1世纪",
      "era_en": "Ancient to 1st Century CE",
      "content_zh": "犹太教与基督教的根本经典。旧约39卷、新约27卷。核心教导：爱上帝、爱人如己。\"你们愿意人怎样待你们，你们也要怎样待人\"（金律），是全球发行量最大的书。",
      "content_en": "The foundational scripture of Judaism and Christianity. 39 Old Testament and 27 New Testament books. Core teaching: Love God and love your neighbor as yourself. 'Do to others as you would have them do to you' (the Golden Rule). The most widely distributed book in history."
    },
    {
      "id": "gb005",
      "cat": "eastern",
      "title_zh": "奥义书",
      "title_en": "The Upanishads",
      "author_zh": "多位圣人",
      "author_en": "Various sages",

      "content_en": "The foundational texts of Indian philosophy. Expound the ultimate truth of 'Brahman-Atman unity'—the individual soul and cosmic reality are one. 'That thou art' (Tat tvam asi) is an eternal philosophical declaration."
    },
    {
      "id": "gb006",
      "cat": "eastern",
      "title_zh": "瑜伽经",
      "title_en": "The Yoga Sutras of Patanjali",
      "author_zh": "帕坦伽利",
      "author_en": "Patanjali",
      "era_zh": "古印度",
      "era_en": "Ancient India",
      "content_zh": "瑜伽体系的根本经典。196条经文阐述\"瑜伽是心念活动的止息\"。八支瑜伽：戒律、精进、体式、调息、制感、专注、冥想、三摩地，是身心修行的系统指南。",
      "content_en": "The foundational text of the Yoga system. 196 sutras defining 'yoga as the cessation of mind's fluctuations.' The Eight Limbs: ethical discipline, self-restraint, posture, breath control, sense withdrawal, concentration, meditation, and samadhi. A systematic guide to spiritual practice."
    },
    {
      "id": "gb007",
      "cat": "eastern",
      "title_zh": "摩诃婆罗多",
      "title_en": "The Mahabharata",
      "author_zh": "毗耶娑",
      "author_en": "Vyasa",
      "era_zh": "古印度",
      "era_en": "Ancient India",
      "content_zh": "世界最长史诗，含《博伽梵歌》。以俱卢族与般度族的大战为叙事，探讨正法（Dharma）、责任、伦理、人生意义。\"什么是正法？什么是终极利益？\"贯穿全书。",
      "content_en": "The world's longest epic, containing the Bhagavad Gita. Uses the great war between the Kauravas and Pandavas to explore dharma (righteousness), duty, ethics, and life's meaning. 'What is dharma? What is the ultimate good?' permeates the work."
    },
    {
      "id": "gb008",
      "cat": "eastern",
      "title_zh": "罗摩衍那",
      "title_en": "The Ramayana",
      "author_zh": "蚁垤",
