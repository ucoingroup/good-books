    {
      "id": "gb020",
      "cat": "philosophy",
      "title_zh": "实践理性批判",
      "title_en": "Critique of Practical Reason",
      "author_zh": "康德",
      "author_en": "Immanuel Kant",
      "era_zh": "18世纪",
      "era_en": "18th Century",
      "content_zh": "康德伦理学的核心著作。提出\"定言命令\"：\"只按照你同时愿意它成为普遍法则的准则行动。\"强调道德出于理性自律，\"位我上者灿烂星空，道德律在我心中\"。",
      "content_en": "The core work of Kant's ethics. Proposes the 'categorical imperative': 'Act only according to that maxim by which you can at the same time will that it should become a universal law.' 'Two things fill me with awe: the starry heavens above and the moral law within.'"
    },
    {
      "id": "gb021",
      "cat": "philosophy",
      "title_zh": "论自由",
      "title_en": "On Liberty",
      "author_zh": "约翰·密尔",
      "author_en": "John Stuart Mill",
      "era_zh": "19世纪",
      "era_en": "19th Century",
      "content_zh": "自由主义经典。提出\"伤害原则\"——个人自由止于伤害他人。论述思想自由、言论自由、个性发展的重要性。\"人类不是机器，而是活树\"，是现代公民伦理的基石。",
      "content_en": "A liberal classic. Proposes the 'harm principle'—individual freedom ends where harm to others begins. Discusses freedom of thought, speech, and individual development. 'Human beings are not machines, but living trees.' A cornerstone of modern civic ethics."
    },
    {
      "id": "gb022",
      "cat": "philosophy",
      "title_zh": "存在与时间",
      "title_en": "Being and Time",
      "author_zh": "海德格尔",
      "author_en": "Martin Heidegger",
      "era_zh": "20世纪",
      "era_en": "20th Century",
      "content_zh": "20世纪最重要的哲学著作之一。探讨\"存在\"的意义，提出\"此在\"概念。\"向死而生\"——面对死亡的真实可能性才能本真地活着。深刻影响了现代人的存在反思。",
      "content_en": "One of the most important philosophical works of the 20th century. Explores the meaning of 'Being,' introducing 'Dasein.' 'Being-toward-death'—only by confronting the real possibility of death can one live authentically. Profoundly influenced modern existential reflection."
    },
    {
      "id": "gb023",
      "cat": "philosophy",
      "title_zh": "西西弗神话",
      "title_en": "The Myth of Sisyphus",
      "author_zh": "加缪",
      "author_en": "Albert Camus",
      "era_zh": "20世纪",
      "era_en": "20th Century",
      "content_zh": "存在主义经典。以推石上山的西西弗为喻，面对荒诞人生。\"我们必须想象西西弗是幸福的\"——在无意义中创造意义，在反抗中找到尊严，是现代人的精神宣言。",
      "content_en": "An existentialist classic. Uses Sisyphus pushing his boulder as a metaphor for the absurd human condition. 'One must imagine Sisyphus happy.' Finding meaning in meaninglessness and dignity in rebellion—a spiritual manifesto for modern people."
    },
    {
      "id": "gb024",
      "cat": "philosophy",
      "title_zh": "功利主义",
      "title_en": "Utilitarianism",
      "author_zh": "约翰·密尔",
      "author_en": "John Stuart Mill",
      "era_zh": "19世纪",
      "era_en": "19th Century",
      "content_zh": "功利主义伦理学经典。主张\"最大多数人的最大幸福\"为道德标准。区分高级快乐与低级快乐，\"宁做不满的人类，不做满足的猪\"。影响了现代福利经济学和政策伦理。",
      "content_en": "The classic of utilitarian ethics. Argues 'the greatest happiness for the greatest number' as the moral standard. Distinguishes higher from lower pleasures: 'Better to be a dissatisfied human than a satisfied pig.' Influenced modern welfare economics and policy ethics."
    },
    {
      "id": "gb025",
      "cat": "philosophy",
      "title_zh": "正义论",
      "title_en": "A Theory of Justice",
      "author_zh": "约翰·罗尔斯",
      "author_en": "John Rawls",
      "era_zh": "20世纪",
      "era_en": "20th Century",
      "content_zh": "当代政治哲学里程碑。提出\"正义即公平\"，以\"无知之幕\"思想实验推导出正义原则：平等自由原则+差别原则。重新定义了社会公正，影响深远。",
      "content_en": "A milestone in contemporary political philosophy. Proposes 'justice as fairness,' using the 'veil of ignorance' thought experiment to derive principles of justice: equal liberty + the difference principle. Redefined social justice."
    },
    {
      "id": "gb026",
      "cat": "religious",
      "title_zh": "登山宝训",
      "title_en": "The Sermon on the Mount",
      "author_zh": "耶稣基督",
      "author_en": "Jesus Christ",
      "era_zh": "1世纪",
      "era_en": "1st Century CE",
      "content_zh": "基督教伦理的核心教导。\"虚心的人有福了\"\"使人和睦的人有福了\"\"你们要爱仇敌\"\"你们愿意人怎样待你们，你们也要怎样待人\"。以八福为核心，奠定基督教道德基础。",
      "content_en": "The core ethical teaching of Christianity. 'Blessed are the poor in spirit,' 'Blessed are the peacemakers,' 'Love your enemies,' 'Do to others as you would have them do to you.' The Beatitudes form the foundation of Christian morality."
    },
    {
      "id": "gb027",
      "cat": "religious",
      "title_zh": "箴言",
      "title_en": "The Book of Proverbs",
      "author_zh": "所罗门等",
      "author_en": "Solomon et al.",
      "era_zh": "古代",
      "era_en": "Ancient",
      "content_zh": "圣经智慧文学代表。\"敬畏耶和华是智慧的开端\"\"骄傲在败坏以先，狂心在跌倒之前\"。以格言形式传授处世、品格、家庭、言语之智慧，是西方道德教育的重要来源。",
      "content_en": "A representative of biblical wisdom literature. 'The fear of the Lord is the beginning of wisdom.' 'Pride goes before destruction, a haughty spirit before a fall.' Imparts practical wisdom on conduct, character, family, and speech."
    },
    {
      "id": "gb028",
      "cat": "religious",
      "title_zh": "效法基督",
      "title_en": "The Imitation of Christ",
      "author_zh": "托马斯·厄·肯培",
      "author_en": "Thomas a Kempis",
      "era_zh": "15世纪",
      "era_en": "15th Century",
      "content_zh": "基督教灵修经典，仅次于圣经的阅读量。强调谦卑、舍己、背十字架跟从基督。\"骄傲是一切诱惑之源\"\"若无谦卑，不能蒙主悦纳\"。影响无数信徒的内在灵性修炼。",
      "content_en": "A Christian devotional classic, second only to the Bible in readership. Emphasizes humility, self-denial, and carrying the cross. 'Pride is the source of all temptation.' 'Without humility, one cannot be accepted by the Lord.' Has shaped countless believers' inner spiritual lives."
    },
    {
      "id": "gb029",
      "cat": "religious",
      "title_zh": "忏悔录",
      "title_en": "Confessions",
      "author_zh": "奥古斯丁",
      "author_en": "St. Augustine",
      "era_zh": "5世纪",
      "era_en": "5th Century",
      "content_zh": "西方自传文学与灵性经典。奥古斯丁回顾自己从罪恶到皈信的历程，深刻反省人性、自由意志与恩典。\"主啊，你造我们为你，我们的心若不安息在你里面，便不得安宁。\"",
      "content_en": "A classic of Western autobiography and spirituality. Augustine reviews his journey from sin to faith, deeply reflecting on human nature, free will, and grace. 'You have made us for yourself, O Lord, and our heart is restless until it rests in you.'"
    },
    {
      "id": "gb030",
      "cat": "religious",
      "title_zh": "古兰经注解选",
      "title_en": "Selected Quranic Commentaries",
      "author_zh": "多位学者",
      "author_en": "Various scholars",
      "era_zh": "中世纪至现代",
      "era_en": "Medieval to Modern",
      "content_zh": "伊斯兰学者对古兰经的权威注解精选。阐释经文含义、伦理教导与实践指导。强调公正、慈悲、知识、清洁、诚信，帮助穆斯林将经文教导落实于生活。",
      "content_en": "Selected authoritative commentaries on the Quran by Islamic scholars. Explains meanings, ethical teachings, and practical guidance. Emphasizes justice, mercy, knowledge, purity, and integrity, helping Muslims apply scripture to daily life."
    },
    {
      "id": "gb031",
      "cat": "religious",
      "title_zh": "犹太教伦理选读",
      "title_en": "Selected Jewish Ethics",
      "author_zh": "多位拉比",
      "author_en": "Various Rabbis",
      "era_zh": "古代至现代",
      "era_en": "Ancient to Modern",
      "content_zh": "犹太伦理思想精选。涵盖\"修复世界\"（Tikkun Olam）、\"义人\"（Tzadik）、\"施舍\"（Tzedakah）等核心概念。\"拯救一条生命即拯救整个世界\"，体现犹太伦理的深刻人道精神。",
      "content_en": "Selected Jewish ethical thought. Covers core concepts like 'Tikkun Olam' (repairing the world), 'Tzadik' (the righteous), and 'Tzedakah' (righteous giving). 'Whoever saves a single life saves an entire world.' Embodies Jewish ethics' profound humanitarian spirit."
    },
    {
      "id": "gb032",
      "cat": "religious",
      "title_zh": "薄伽梵歌（全球版）",
      "title_en": "Bhagavad Gita",
      "author_zh": "毗耶娑",
      "author_en": "Vyasa",
      "era_zh": "古印度",
      "era_en": "Ancient India",
      "content_zh": "（参见东方智慧）被誉为\"印度圣经\"的灵性经典。无执着地行动、以奉献之心服务——其教导超越了宗教界限，影响甘地、爱默生等世界伟人。",
      "content_en": "(See Eastern Wisdom) Hailed as 'India's Bible.' Selfless action and devotional service—teachings that transcend religious boundaries, influencing Gandhi, Emerson, and other world figures."
    },
    {
      "id": "gb033",
      "cat": "religious",
      "title_zh": "金刚经（全球版）",
      "title_en": "The Diamond Sutra",
      "author_zh": "佛教",
      "author_en": "Buddhist",
      "era_zh": "印度/中国",
      "era_en": "India/China",
      "content_zh": "（参见佛家经典）全球流传的般若经典。\"凡所有相皆是虚妄\"\"应无所住而生其心\"——其\"空\"的智慧超越文化与宗教，被全球禅修者和哲学家珍视。",
      "content_en": "(See Buddhist section) A globally circulated Prajnaparamita text. 'All appearances are illusory' and 'give rise to the mind without dwelling anywhere.' The wisdom of 'emptiness' transcends culture and religion, cherished by meditators and philosophers worldwide."
    },
    {
      "id": "gb034",
      "cat": "religious",
      "title_zh": "道德经（全球版）",
      "title_en": "Tao Te Ching",
      "author_zh": "老子",
      "author_en": "Laozi",
      "era_zh": "春秋",
      "era_en": "Spring and Autumn Period",
      "content_zh": "（参见道家经典）全球翻译版本最多的哲学经典。\"道法自然\"\"无为而治\"\"上善若水\"——老子的智慧跨越时空，成为全球环境保护、和平主义、简约生活的哲学源头。",
      "content_en": "(See Daoist section) The most translated philosophical classic globally. 'The Way follows nature,' 'governing through non-action,' 'the highest good is like water.' Laozi's wisdom transcends time, inspiring global environmentalism, pacifism, and simplicity."
    },
    {
      "id": "gb035",
      "cat": "religious",
      "title_zh": "死海古卷选",
      "title_en": "Selected Dead Sea Scrolls",
      "author_zh": "犹太社团",
      "author_en": "Jewish Community",
      "era_zh": "公元前2世纪-1世纪",
      "era_en": "2nd Century BCE - 1st Century CE",
      "content_zh": "20世纪最重大的考古发现之一。保存了最古老的希伯来圣经手稿及犹太社团文献。揭示了早期犹太教与基督教的信仰实践和道德教导，是了解西方宗教根源的窗口。",
      "content_en": "One of the 20th century's most significant archaeological discoveries. Preserves the oldest Hebrew biblical manuscripts and Jewish community documents. Reveals the faith practices and moral teachings of early Judaism and Christianity."
    },
    {
      "id": "gb036",
      "cat": "literature",
      "title_zh": "悲惨世界",
      "title_en": "Les Miserables",
      "author_zh": "维克多·雨果",
      "author_en": "Victor Hugo",
      "era_zh": "19世纪",
      "era_en": "19th Century",
      "content_zh": "雨果的不朽巨著。冉阿让从苦役犯到圣人的转化之路，展现慈悲、宽恕、救赎的力量。\"爱他人，就是看见上帝的面容\"——以文学形式传递深刻的人道主义精神。",
      "content_en": "Hugo's immortal masterpiece. Jean Valjean's transformation from convict to saint demonstrates the power of compassion, forgiveness, and redemption. 'To love another person is to see the face of God.' Profound humanitarianism in literary form."
    },
    {
      "id": "gb037",
      "cat": "literature",
      "title_zh": "战争与和平",
      "title_en": "War and Peace",
      "author_zh": "列夫·托尔斯泰",
      "author_en": "Leo Tolstoy",
      "era_zh": "19世纪",
      "era_en": "19th Century",
      "content_zh": "托尔斯泰的史诗巨著。以拿破仑战争为背景，探讨战争、和平、爱情、信仰、人生意义。\"我们能够知道的唯一可知之事是我们一无所知\"，蕴含深刻的和平主义与道德反思。",
      "content_en": "Tolstoy's epic masterpiece. Against the backdrop of the Napoleonic Wars, it explores war, peace, love, faith, and life's meaning. 'The only thing we can know is that we know nothing.' Contains profound pacifist and moral reflection."
    },
    {
      "id": "gb038",
      "cat": "literature",
      "title_zh": "罪与罚",
      "title_en": "Crime and Punishment",
      "author_zh": "陀思妥耶夫斯基",
      "author_en": "Fyodor Dostoevsky",
      "era_zh": "19世纪",
      "era_en": "19th Century",
      "content_zh": "陀思妥耶夫斯基的心理道德杰作。大学生拉斯柯尔尼科夫杀人后的良心折磨，探讨罪恶、救赎、苦难的意义。\"苦难是良知的觉醒\"——深刻剖析人性的光明与黑暗。",
      "content_en": "Dostoevsky's psychological and moral masterpiece. Student Raskolnikov's torment after murder explores guilt, redemption, and the meaning of suffering. 'Suffering is the awakening of conscience.' A profound analysis of humanity's light and darkness."
    },
    {
      "id": "gb039",
      "cat": "literature",
      "title_zh": "卡拉马佐夫兄弟",
      "title_en": "The Brothers Karamazov",
      "author_zh": "陀思妥耶夫斯基",
      "author_en": "Fyodor Dostoevsky",
      "era_zh": "19世纪",
      "era_en": "19th Century",
      "content_zh": "陀思妥耶夫斯基最后巨著。以三兄弟的故事探讨信仰与无神论、自由与责任、善恶与救赎。\"每个人的确都对所有人负责，为所有事负责\"——终极的道德追问。",
      "content_en": "Dostoevsky's final masterpiece. Through three brothers, it explores faith and atheism, freedom and responsibility, good and evil. 'Everyone is really responsible to all men for all men and for everything.' The ultimate moral inquiry."
    },
    {
      "id": "gb040",
      "cat": "literature",
      "title_zh": "堂吉诃德",
      "title_en": "Don Quixote",
      "author_zh": "塞万提斯",
      "author_en": "Miguel de Cervantes",
      "era_zh": "17世纪",
      "era_en": "17th Century",
      "content_zh": "西方文学第一部现代小说。堂吉诃德追逐骑士理想的荒诞与崇高，探讨理想与现实、疯狂与清醒。\"世界需要梦想者\"——以幽默与悲悯讲述坚持理想的永恒价值。",
      "content_en": "The first modern Western novel. Don Quixote's absurd yet noble pursuit of chivalric ideals explores ideal vs. reality, madness vs. sanity. 'The world needs dreamers.' Tells the eternal value of holding fast to ideals with humor and compassion."
    },
    {
      "id": "gb041",
      "cat": "literature",
      "title_zh": "小王子",
      "title_en": "The Little Prince",
      "author_zh": "圣埃克苏佩里",
      "author_en": "Antoine de Saint-Exupery",
      "era_zh": "20世纪",
      "era_en": "20th Century",
      "content_zh": "全球最畅销的哲学童话。\"真正重要的东西用眼睛是看不见的，要用心去看\"\"你对你的玫瑰负有责任\"。以纯真视角揭示爱、责任、友谊的真谛，感动全球数亿读者。",
      "content_en": "The world's bestselling philosophical fairy tale. 'What is essential is invisible to the eye.' 'You become responsible, forever, for what you have tamed.' Reveals the essence of love, responsibility, and friendship through innocent eyes, moving hundreds of millions."
    },
    {
      "id": "gb042",
      "cat": "literature",
      "title_zh": "瓦尔登湖",
      "title_en": "Walden",
      "author_zh": "梭罗",
      "author_en": "Henry David Thoreau",
      "era_zh": "19世纪",
      "era_en": "19th Century",
      "content_zh": "超验主义文学经典。梭罗在瓦尔登湖畔独居两年的记录。\"我步入丛林，因为我希望生活有意义\"\"简朴，简朴，再简朴\"。倡导简朴生活、精神追求、与自然和谐。",
      "content_en": "A Transcendentalist literary classic. Thoreau's record of two years alone at Walden Pond. 'I went to the woods because I wished to live deliberately.' 'Simplicity, simplicity, simplicity.' Advocates simple living, spiritual pursuit, and harmony with nature."
    },
    {
      "id": "gb043",
      "cat": "literature",
      "title_zh": "杀死一只知更鸟",
      "title_en": "To Kill a Mockingbird",
      "author_zh": "哈珀·李",
      "author_en": "Harper Lee",
      "era_zh": "20世纪",
      "era_en": "20th Century",
      "content_zh": "美国文学经典。律师阿迪克斯为黑人辩护的故事，展现勇气、正义、同理心。\"除非你穿上别人的鞋子走一走，否则你永远无法真正了解一个人\"——关于种族正义与道德勇气。",
      "content_en": "An American literary classic. Lawyer Atticus Finch defends a Black man, demonstrating courage, justice, and empathy. 'You never really understand a person until you consider things from his point of view.' About racial justice and moral courage."
    },
    {
      "id": "gb044",
      "cat": "literature",
      "title_zh": "简爱",
      "title_en": "Jane Eyre",
      "author_zh": "夏洛蒂·勃朗特",
      "author_en": "Charlotte Bronte",
      "era_zh": "19世纪",
      "era_en": "19th Century",
      "content_zh": "女性独立精神先驱之作。简爱在逆境中坚守尊严与自立。\"我们是平等的——至少我们透过坟墓站在上帝的脚下时是平等的\"。以文学形式传递自立、尊严、平等的精神力量。",
      "content_en": "A pioneering work of female independence. Jane Eyre maintains dignity and self-reliance through adversity. 'We are equal—at least we stand equal at God's feet when we die.' Delivers spiritual power of self-reliance, dignity, and equality through literature."
    },
    {
      "id": "gb045",
      "cat": "literature",
      "title_zh": "老人与海",
      "title_en": "The Old Man and the Sea",
      "author_zh": "海明威",
      "author_en": "Ernest Hemingway",
      "era_zh": "20世纪",
      "era_en": "20th Century",
      "content_zh": "海明威诺贝尔奖作品。老渔夫圣地亚哥与巨大马林鱼的搏斗。\"一个人可以被毁灭，但不能被打败\"——以极简文字展现人类面对命运时的尊严与不屈。",
      "content_en": "Hemingway's Nobel Prize work. Old fisherman Santiago's battle with a giant marlin. 'A man can be destroyed but not defeated.' Demonstrates human dignity and resilience in the face of fate in minimalist prose."
    },
    {
      "id": "gb046",
      "cat": "literature",
      "title_zh": "百年孤独",
      "title_en": "One Hundred Years of Solitude",
      "author_zh": "加西亚·马尔克斯",
      "author_en": "Gabriel Garcia Marquez",
      "era_zh": "20世纪",
      "era_en": "20th Century",
      "content_zh": "魔幻现实主义巅峰之作。布恩迪亚家族七代人的兴衰史，隐喻拉丁美洲的苦难与命运。\"过去都是假的，回忆是一条没有归途的路\"——在魔幻与现实的交织中追问人性与历史。",
      "content_en": "The pinnacle of magical realism. Seven generations of the Buendia family metaphorically represent Latin America's suffering and destiny. 'The past is a lie; memory is a road with no return.' Questions human nature and history through magic and reality."
    },
    {
      "id": "gb047",
      "cat": "literature",
      "title_zh": "牧羊少年奇幻之旅",
      "title_en": "The Alchemist",
      "author_zh": "保罗·柯艾略",
      "author_en": "Paulo Coelho",
      "era_zh": "20世纪",
      "era_en": "20th Century",
      "content_zh": "全球畅销灵性寓言。牧羊少年圣地亚哥追寻宝藏的旅程。\"当你真心渴望某样东西时，整个宇宙都会联合起来帮助你完成\"——关于天命、勇气和心灵之书的寓言。",
      "content_en": "A globally bestselling spiritual fable. Shepherd Santiago's journey to find treasure. 'When you want something, all the universe conspires in helping you to achieve it.' An allegory about destiny, courage, and listening to the heart."
    },
    {
      "id": "gb048",
      "cat": "literature",
      "title_zh": "安娜·卡列尼娜",
      "title_en": "Anna Karenina",
      "author_zh": "列夫·托尔斯泰",
      "author_en": "Leo Tolstoy",
      "era_zh": "19世纪",
      "era_en": "19th Century",
      "content_zh": "托尔斯泰的文学巨著。\"幸福的家庭都是相似的，不幸的家庭各有各的不幸\"。通过多条线索探讨爱情、婚姻、家庭、信仰与社会道德，是人性洞察的文学巅峰。",
      "content_en": "Tolstoy's literary masterpiece. 'All happy families are alike; each unhappy family is unhappy in its own way.' Through multiple storylines, it explores love, marriage, family, faith, and social morality—the literary summit of human insight."
    },
    {
      "id": "gb049",
      "cat": "literature",
      "title_zh": "傲慢与偏见",
      "title_en": "Pride and Prejudice",
      "author_zh": "简·奥斯汀",
      "author_en": "Jane Austen",
      "era_zh": "19世纪",
      "era_en": "19th Century",
      "content_zh": "英国文学经典。以伊丽莎白与达西的故事探讨傲慢、偏见、自尊与成长。\"虚荣与骄傲是不同的东西\"——以细腻笔触揭示人性弱点与自我超越的可能。",
      "content_en": "An English literary classic. Through Elizabeth and Darcy's story, it explores pride, prejudice, self-respect, and growth. 'Vanity and pride are different things.' Reveals human weaknesses and the possibility of self-transcendence with delicate insight."
    },
    {
      "id": "gb050",
      "cat": "literature",
      "title_zh": "复活",
      "title_en": "Resurrection",
      "author_zh": "列夫·托尔斯泰",
      "author_en": "Leo Tolstoy",
      "era_zh": "19世纪",
      "era_en": "19th Century",
      "content_zh": "托尔斯泰晚年道德小说。聂赫留朵夫为赎罪而追随被自己害过的喀秋莎。探讨忏悔、救赎、社会不公与精神复活。\"每个人都以为自己是审判者，其实每个人都是罪人\"。",
      "content_en": "Tolstoy's late moral novel. Nekhlyudov seeks redemption by following Katusha, whom he wronged. Explores repentance, salvation, social injustice, and spiritual resurrection. 'Everyone thinks himself a judge, but everyone is a sinner.'"
    },
    {
      "id": "gb051",
      "cat": "selfcult",
      "title_zh": "人性的弱点",
      "title_en": "How to Win Friends and Influence People",
      "author_zh": "戴尔·卡耐基",
      "author_en": "Dale Carnegie",
      "era_zh": "20世纪",
      "era_en": "20th Century",
      "content_zh": "全球最畅销的人际关系指南。\"真诚地对他人感兴趣\"\"记住对方的名字\"\"让对方觉得自己重要\"。以尊重、理解、真诚为核心原则，是社交道德的实用宝典。",
      "content_en": "The world's bestselling interpersonal guide. 'Become genuinely interested in other people.' 'Remember a person's name.' 'Make the other person feel important.' Centered on respect, understanding, and sincerity—a practical handbook for social ethics."
    },
    {
      "id": "gb052",
      "cat": "selfcult",
      "title_zh": "高效能人士的七个习惯",
      "title_en": "The 7 Habits of Highly Effective People",
      "author_zh": "史蒂芬·柯维",
      "author_en": "Stephen Covey",
      "era_zh": "20世纪",
      "era_en": "20th Century",
      "content_zh": "全球影响力最大的个人成长经典。七个习惯：积极主动、以终为始、要事第一、双赢思维、知彼解己、统合综效、不断更新。以品格伦理为核心，影响数千万读者。",
      "content_en": "The world's most influential personal growth classic. Seven habits: Be proactive, Begin with the end in mind, Put first things first, Think win-win, Seek first to understand, Synergize, and Sharpen the saw. Centered on character ethics, influencing tens of millions."
    },
    {
      "id": "gb053",
      "cat": "selfcult",
      "title_zh": "活出意义来",
      "title_en": "Man's Search for Meaning",
      "author_zh": "维克多·弗兰克尔",
      "author_en": "Viktor Frankl",
      "era_zh": "20世纪",
      "era_en": "20th Century",
      "content_zh": "弗兰克尔在集中营经历中创立的意义疗法经典。\"人可以被夺走一切，唯独不能被夺走在任何境遇中选择自己态度的自由\"。\"知道为什么而活的人，便能生存\"。",
      "content_en": "Frankl's logotherapy classic born from concentration camp experience. 'Everything can be taken from a man but one thing: the freedom to choose his attitude in any given circumstances.' 'He who has a why to live can bear almost any how.'"
    },
    {
      "id": "gb054",
      "cat": "selfcult",
      "title_zh": "沉思录（全球版）",
      "title_en": "Meditations",
      "author_zh": "马可·奥勒留",
      "author_en": "Marcus Aurelius",
      "era_zh": "古罗马",
      "era_en": "Ancient Rome",
      "content_zh": "（参见西方哲学）斯多葛哲学的全球经典。\"你掌控的是内心，而非外在事件\"\"每一刻都过得好像它是最后一刻\"。影响了无数现代人的自控力、韧性与内心平静。",
      "content_en": "(See Western Philosophy) The global classic of Stoic philosophy. 'You have power over your mind, not outside events.' Influenced countless modern people's self-control, resilience, and inner peace."
    },
    {
      "id": "gb055",
      "cat": "selfcult",
      "title_zh": "被讨厌的勇气",
      "title_en": "The Courage to Be Disliked",
      "author_zh": "岸见一郎",
      "author_en": "Ichiro Kishimi",
      "era_zh": "21世纪",
      "era_en": "21st Century",
      "content_zh": "阿德勒心理学的对话体入门。\"一切烦恼都来自人际关系\"\"自由就是被别人讨厌\"。以\"课题分离\"\"共同体感觉\"为工具，帮助读者获得真正的自由与幸福。",
      "content_en": "A dialogue-based introduction to Adlerian psychology. 'All problems are interpersonal relationship problems.' 'Freedom is being disliked by other people.' Uses 'separation of tasks' and 'community feeling' to help readers achieve true freedom and happiness."
    },
    {
      "id": "gb056",
      "cat": "selfcult",
      "title_zh": "当下的力量",
      "title_en": "The Power of Now",
      "author_zh": "埃克哈特·托利",
      "author_en": "Eckhart Tolle",
      "era_zh": "21世纪",
      "era_en": "21st Century",
      "content_zh": "当代灵性修行经典。\"你即当下的存在\"\"痛苦来自对当下的抗拒\"。教导人们从思维认同中解脱，活在当下，找到内在的宁静与力量。影响了全球数千万读者。",
      "content_en": "A contemporary spiritual classic. 'You are the presence of Now.' 'Suffering comes from resistance to the present moment.' Teaches liberation from identification with thought, living in the present, and finding inner peace and power."
    },
    {
      "id": "gb057",
      "cat": "selfcult",
      "title_zh": "非暴力沟通",
      "title_en": "Nonviolent Communication",
      "author_zh": "马歇尔·卢森堡",
      "author_en": "Marshall Rosenberg",
      "era_zh": "20世纪",
      "era_en": "20th Century",
      "content_zh": "全球影响力的沟通与伦理经典。四步：观察、感受、需要、请求。\"不带评论的观察是人类智力的最高形式\"——以同理心为基础，教导人们如何真诚沟通、化解冲突。",
      "content_en": "A globally influential communication and ethics classic. Four steps: Observe, Feel, Need, Request. 'Observation without evaluation is the highest form of human intelligence.' Teaches empathetic, honest communication and conflict resolution."
    },
    {
      "id": "gb058",
      "cat": "selfcult",
      "title_zh": "自卑与超越",
      "title_en": "What Life Could Mean to You",
      "author_zh": "阿尔弗雷德·阿德勒",
      "author_en": "Alfred Adler",
      "era_zh": "20世纪",
      "era_en": "20th Century",
      "content_zh": "阿德勒心理学经典。\"自卑感是人类奋斗的源泉\"\"人的一切行为都有目的\"。阐述自卑感、追求优越、社会兴趣等概念，帮助人们理解自我、超越局限、服务社会。",
      "content_en": "An Adlerian psychology classic. 'Feelings of inferiority are the source of all human striving.' 'All human behavior has purpose.' Explores inferiority, pursuit of superiority, and social interest, helping people understand themselves and serve society."
    },
    {
      "id": "gb059",
      "cat": "selfcult",
      "title_zh": "爱的艺术",
      "title_en": "The Art of Loving",
      "author_zh": "埃里希·弗洛姆",
      "author_en": "Erich Fromm",
      "era_zh": "20世纪",
      "era_en": "20th Century",
      "content_zh": "人本主义心理学经典。\"爱不是一种感情，而是一种能力\"\"爱是给予，不是接受\"。论述爱的本质——关心、责任、尊重、了解。将爱从情感提升为艺术和修行。",
      "content_en": "A humanistic psychology classic. 'Love is not a feeling but a capability.' 'Love is giving, not receiving.' Discusses love's essence: care, responsibility, respect, and understanding. Elevates love from emotion to art and practice."
    },
    {
      "id": "gb060",
      "cat": "selfcult",
      "title_zh": "少有人走的路",
      "title_en": "The Road Less Traveled",
      "author_zh": "M·斯科特·派克",
      "author_en": "M. Scott Peck",
      "era_zh": "20世纪",
      "era_en": "20th Century",
      "content_zh": "心理学与灵性成长经典。\"人生困难重重\"\"自律是解决人生问题的首要工具\"。四大纪律：推迟满足、承担责任、忠于真实、保持平衡。以心理治疗视角探索心灵成长。",
      "content_en": "A psychology and spiritual growth classic. 'Life is difficult.' 'Discipline is the basic set of tools we require to solve life's problems.' Four disciplines: Delay gratification, Accept responsibility, Dedication to truth, and Balancing."
    },
    {
      "id": "gb061",
      "cat": "selfcult",
      "title_zh": "正念的奇迹",
      "title_en": "The Miracle of Mindfulness",
      "author_zh": "一行禅师",
      "author_en": "Thich Nhat Hanh",
      "era_zh": "20世纪",
      "era_en": "20th Century",
      "content_zh": "越南禅师一行禅师的正念修行经典。\"洗碗时就是洗碗\"\"呼吸是连接生命与意识的桥梁\"。以日常正念为基础，教导在平凡生活中找到奇迹与平静。",
      "content_en": "A mindfulness classic by Vietnamese Zen Master Thich Nhat Hanh. 'While washing the dishes, just wash the dishes.' 'Breath is the bridge which connects life to consciousness.' Teaches finding miracles and peace in ordinary daily life through mindfulness."
    },
    {
      "id": "gb062",
      "cat": "selfcult",
      "title_zh": "静心·正念",
      "title_en": "Wherever You Go, There You Are",
      "author_zh": "乔恩·卡巴金",
      "author_en": "Jon Kabat-Zinn",
      "era_zh": "20世纪",
      "era_en": "20th Century",
      "content_zh": "正念减压疗法创始人卡巴金的入门经典。\"你无法平息海浪，但可以学会冲浪\"。将东方禅修智慧融入现代心理学框架，是正念运动在全球普及的关键著作。",
      "content_en": "An introductory classic by MBSR founder Kabat-Zinn. 'You can't stop the waves, but you can learn to surf.' Integrates Eastern meditation wisdom into modern psychology. The key work in bringing mindfulness to the global mainstream."
    },
    {
      "id": "gb063",
      "cat": "selfcult",
      "title_zh": "不抱怨的世界",
      "title_en": "A Complaint Free World",
      "author_zh": "威尔·鲍温",
      "author_en": "Will Bowen",
      "era_zh": "21世纪",
      "era_en": "21st Century",
      "content_zh": "全球不抱怨运动发起之作。戴上紫色手环，21天不抱怨挑战。\"你的思想创造你的生活，你的话语表明你的思想\"——以简单行动改变思维习惯，传递积极能量。",
      "content_en": "The book that launched the global complaint-free movement. Wear a purple bracelet, take the 21-day no-complaint challenge. 'Your thoughts create your life, and your words indicate your thoughts.' Changing thinking through simple action."
    },
    {
      "id": "gb064",
      "cat": "selfcult",
      "title_zh": "秘密",
      "title_en": "The Secret",
      "author_zh": "朗达·拜恩",
      "author_en": "Rhonda Byrne",
      "era_zh": "21世纪",
      "era_en": "21st Century",
      "content_zh": "吸引力法则畅销书。\"同类相吸——你的思想吸引相同频率的事物\"。以\"要求、相信、接受\"三步法教导积极思维的力量。虽受争议，但影响了全球数千万人的心态。",
      "content_en": "A bestselling book on the Law of Attraction. 'Like attracts like—your thoughts attract things of the same frequency.' Teaches the power of positive thinking through 'Ask, Believe, Receive.' Though controversial, it has influenced tens of millions globally."
    },
    {
      "id": "gb065",
      "cat": "selfcult",
      "title_zh": "终身成长",
      "title_en": "Mindset",
      "author_zh": "卡罗尔·德韦克",
      "author_en": "Carol Dweck",
      "era_zh": "21世纪",
      "era_en": "21st Century",
      "content_zh": "斯坦福心理学家的成长型思维经典。区分固定型思维与成长型思维。\"不是你多聪明，而是你怎样变聪明\"——以\"还可以\"（not yet）代替\"做不到\"，改变对失败与学习的态度。",
      "content_en": "Stanford psychologist Dweck's classic on growth mindset. Distinguishes fixed vs. growth mindset. 'It's not about how smart you are, but how you become smart.' Replacing 'I can't' with 'not yet' transforms attitudes toward failure and learning."
    },
    {
      "id": "gb066",
      "cat": "ethics",
      "title_zh": "国富论",
      "title_en": "The Wealth of Nations",
      "author_zh": "亚当·斯密",
      "author_en": "Adam Smith",
      "era_zh": "18世纪",
      "era_en": "18th Century",
      "content_zh": "现代经济学奠基之作。阐述市场经济的\"看不见的手\"原理。但在伦理层面，斯密同样强调同情心与道德情操——经济行为不能脱离道德基础。",
      "content_en": "The foundational work of modern economics. Expounds the 'invisible hand' of markets. But ethically, Smith equally emphasizes sympathy and moral sentiment—economic behavior cannot be divorced from moral foundations."
    },
    {
      "id": "gb067",
      "cat": "ethics",
      "title_zh": "道德情操论",
      "title_en": "The Theory of Moral Sentiments",
      "author_zh": "亚当·斯密",
      "author_en": "Adam Smith",
      "era_zh": "18世纪",
      "era_en": "18th Century",
      "content_zh": "亚当·斯密的伦理学著作，比《国富论》更重要。以\"同情心\"为核心，论述道德判断的基础。\"无论人多么自私，本性中显然有些原则使他关心别人的命运\"。",
      "content_en": "Adam Smith's ethical work, more important than The Wealth of Nations. Centered on 'sympathy' as the basis of moral judgment. 'How selfish soever man may be supposed, there are evidently some principles in his nature which interest him in the fortune of others.'"
    },
    {
      "id": "gb068",
      "cat": "ethics",
      "title_zh": "论自由（全球版）",
      "title_en": "On Liberty",
      "author_zh": "约翰·密尔",
      "author_en": "John Stuart Mill",
      "era_zh": "19世纪",
      "era_en": "19th Century",
      "content_zh": "（参见西方哲学）自由主义伦理的基石。\"个人自由止于伤害他人\"——界定了个人权利与社会权力的边界，是现代民主社会公民伦理的基础文本。",
      "content_en": "(See Western Philosophy) The cornerstone of liberal ethics. 'Individual freedom ends where harm to others begins.' Defines the boundary between individual rights and social power. The foundational text of modern democratic civic ethics."
    },
    {
      "id": "gb069",
      "cat": "ethics",
      "title_zh": "世界人权宣言",
      "title_en": "The Universal Declaration of Human Rights",
      "author_zh": "联合国",
      "author_en": "United Nations",
      "era_zh": "1948年",
      "era_en": "1948",
      "content_zh": "人类历史上最重要的国际伦理文件。\"人人生而自由，在尊严和权利上一律平等\"。30条款涵盖生命、自由、平等、公正等基本人权，是全人类共同认可的道德底线。",
      "content_en": "The most important international ethical document in human history. 'All human beings are born free and equal in dignity and rights.' Thirty articles cover fundamental rights to life, liberty, equality, and justice—the common moral baseline of all humanity."
    },
    {
      "id": "gb070",
      "cat": "ethics",
      "title_zh": "地球宪章",
      "title_en": "The Earth Charter",
      "author_zh": "国际委员会",
      "author_en": "International Commission",
      "era_zh": "2000年",
      "era_en": "2000",
      "content_zh": "全球伦理与可持续发展宣言。\"尊重生命，维护地球\"。涵盖尊重生命、生态完整性、社会正义、民主非暴力四大支柱，是人类对地球家园的共同伦理承诺。",
      "content_en": "A global declaration of ethics and sustainable development. 'Respect and care for the community of life.' Four pillars: respect for life, ecological integrity, social justice, and democracy/nonviolence. Humanity's shared ethical commitment to our planetary home."
    },
    {
      "id": "gb071",
      "cat": "ethics",
      "title_zh": "甘地自传",
      "title_en": "The Story of My Experiments with Truth",
      "author_zh": "甘地",
      "author_en": "Mahatma Gandhi",
      "era_zh": "20世纪",
      "era_en": "20th Century",
      "content_zh": "甘地的自传，以\"真理实验\"为名。阐述非暴力（Ahimsa）、真理（Satya）、简朴生活、自力更生等理念。\"以眼还眼只会让全世界都瞎掉\"——以生命实践道德信念。",
      "content_en": "Gandhi's autobiography, titled 'Experiments with Truth.' Expounds nonviolence (Ahimsa), truth (Satya), simple living, and self-reliance. 'An eye for an eye makes the whole world blind.' Living moral conviction through one's life."
    },
    {
      "id": "gb072",
      "cat": "ethics",
      "title_zh": "我有一个梦想",
      "title_en": "I Have a Dream",
      "author_zh": "马丁·路德·金",
      "author_en": "Martin Luther King Jr.",
      "era_zh": "20世纪",
      "era_en": "20th Century",
      "content_zh": "马丁·路德·金的演讲与文集。\"我梦想有一天，我的四个孩子将生活在一个不以肤色而以品格评判人的国家\"。以非暴力抗争追求种族平等，是现代人权运动的道德灯塔。",
      "content_en": "Speeches and writings of Martin Luther King Jr. 'I have a dream that my four little children will one day live in a nation where they will be judged not by the color of their skin but by the content of their character.' The moral beacon of the modern civil rights movement."
    },
    {
      "id": "gb073",
      "cat": "ethics",
      "title_zh": "漫漫自由路",
      "title_en": "Long Walk to Freedom",
      "author_zh": "纳尔逊·曼德拉",
      "author_en": "Nelson Mandela",
      "era_zh": "20世纪",
      "era_en": "20th Century",
      "content_zh": "曼德拉的自传。27年牢狱生涯后选择宽恕与和解。\"勇气不是没有恐惧，而是战胜恐惧\"\"没有人天生会因为肤色、背景或宗教而仇恨另一个人\"。以宽恕化解仇恨。",
      "content_en": "Mandela's autobiography. After 27 years in prison, he chose forgiveness and reconciliation. 'Courage is not the absence of fear, but the triumph over it.' 'No one is born hating another person because of the color of his skin.' Transforming hatred through forgiveness."
    },
    {
      "id": "gb074",
      "cat": "ethics",
      "title_zh": "寂静的春天",
      "title_en": "Silent Spring",
      "author_zh": "蕾切尔·卡逊",
      "author_en": "Rachel Carson",
      "era_zh": "20世纪",
      "era_en": "20th Century",
      "content_zh": "环境保护运动的奠基之作。揭示农药滥用对生态的破坏，唤醒全球环保意识。\"人类对自然的态度决定了人类对自己的态度\"——是现代生态伦理的起点。",
      "content_en": "The foundational work of the environmental movement. Reveals the ecological devastation of pesticide abuse, awakening global environmental consciousness. 'Man's attitude toward nature is ultimately his attitude toward himself.' The starting point of modern ecological ethics."
    },
    {
      "id": "gb075",
      "cat": "ethics",
      "title_zh": "只有一个地球",
      "title_en": "Only One Earth",
      "author_zh": "芭芭拉·沃德",
      "author_en": "Barbara Ward",
      "era_zh": "20世纪",
      "era_en": "20th Century",
      "content_zh": "联合国人类环境大会的背景报告。\"我们只有一个地球\"——以全球视角阐述环境保护与人类发展的关系，是可持续发展理念的重要源头，影响了全球环保政策。",
      "content_en": "The background report for the UN Conference on the Human Environment. 'We have only one Earth.' Explores the relationship between environmental protection and human development from a global perspective. A key source of sustainable development thinking."
    },
    {
      "id": "gb076",
      "cat": "spirit",
      "title_zh": "与神对话",
      "title_en": "Conversations with God",
      "author_zh": "尼尔·唐纳德·沃尔什",
      "author_en": "Neale Donald Walsch",
      "era_zh": "20世纪",
      "era_en": "20th Century",
      "content_zh": "当代灵性畅销书。以与\"神\"对话的形式探讨人生根本问题。\"你不是在发现自己，而是在创造自己\"\"爱没有条件\"。以超越宗教的视角传递灵性智慧。",
      "content_en": "A contemporary spiritual bestseller. Explores life's fundamental questions through 'conversations with God.' 'You are not discovering yourself, you are creating yourself.' 'Love has no conditions.' Spiritual wisdom beyond religion."
    },
    {
      "id": "gb077",
      "cat": "spirit",
      "title_zh": "告别娑婆",
      "title_en": "The Disappearance of the Universe",
      "author_zh": "加里·雷纳",
      "author_en": "Gary Renard",
      "era_zh": "21世纪",
      "era_en": "21st Century",
      "content_zh": "以灵性对话形式诠释《奇迹课程》。\"宽恕是通向觉醒的唯一道路\"\"世界是你投射的幻相\"。以现代语言传递古老的非二元论智慧，影响了全球灵性探索者。",
      "content_en": "An interpretation of A Course in Miracles in dialogue form. 'Forgiveness is the only path to awakening.' 'The world is a projection of your illusion.' Ancient non-dual wisdom in modern language, influencing global spiritual seekers."
    },
    {
      "id": "gb078",
      "cat": "spirit",
      "title_zh": "塞莱斯廷预言",
      "title_en": "The Celestine Prophecy",
      "author_zh": "詹姆斯·雷德菲尔德",
      "author_en": "James Redfield",
      "era_zh": "20世纪",
      "era_en": "20th Century",
      "content_zh": "灵性冒险小说。九种洞察揭示人类灵性进化的路线图：从注意到巧合、看清历史、能量流动、权力争夺、慈悲、意识进化到全球觉醒。影响了新世纪运动。",
      "content_en": "A spiritual adventure novel. Nine insights reveal a roadmap for humanity's spiritual evolution: from noticing coincidences to understanding energy flows, power struggles, compassion, and global awakening. Influenced the New Age movement."
    },
    {
      "id": "gb079",
      "cat": "spirit",
      "title_zh": "一个瑜伽行者的自传",
      "title_en": "Autobiography of a Yogi",
      "author_zh": "帕拉宏撒·尤迦南达",
      "author_en": "Paramahansa Yogananda",
      "era_zh": "20世纪",
      "era_en": "20th Century",
      "content_zh": "将印度瑜伽智慧引入西方的经典自传。尤迦南达以亲身经历展示克利亚瑜伽的灵性力量。\"深入冥想的人会发现上帝就在内心\"——东西方灵性交流的里程碑。",
      "content_en": "The classic autobiography that brought Indian yoga wisdom to the West. Yogananda demonstrates the spiritual power of Kriya Yoga through personal experience. 'The meditator finds God within.' A milestone in East-West spiritual exchange."
    },
    {
      "id": "gb080",
      "cat": "spirit",
      "title_zh": "悉达多",
      "title_en": "Siddhartha",
      "author_zh": "赫尔曼·黑塞",
      "author_en": "Hermann Hesse",
      "era_zh": "20世纪",
      "era_en": "20th Century",
      "content_zh": "诺贝尔文学奖得主黑塞的灵性小说。讲述印度青年悉达多求道之旅——从苦行到世俗再到的悟道。\"知识可以传授，智慧不能\"\"河流无处不在\"——以文学传达东方智慧。",
      "content_en": "Nobel laureate Hesse's spiritual novel. The journey of Indian youth Siddhartha from asceticism through worldly life to enlightenment. 'Knowledge can be communicated, but not wisdom.' 'The river is everywhere.' Eastern wisdom conveyed through literature."
    },
    {
      "id": "gb081",
      "cat": "spirit",
      "title_zh": "新世界·灵性的觉醒",
      "title_en": "A New Earth",
      "author_zh": "埃克哈特·托利",
      "author_en": "Eckhart Tolle",
      "era_zh": "21世纪",
      "era_en": "21st Century",
      "content_zh": "托利继《当下的力量》后的灵性巨著。分析\"小我\"如何制造痛苦与冲突，教导\"临在\"的觉醒。\"承认你内在的缺乏，才能找到真正的丰盈\"——以意识进化促进人类觉醒。",
      "content_en": "Tolle's follow-up spiritual masterpiece. Analyzes how the 'ego' creates suffering and conflict, teaching the awakening of 'presence.' 'Acknowledging the lack within is the only way to find true abundance.' Promoting human awakening through consciousness evolution."
    },
    {
      "id": "gb082",
      "cat": "spirit",
      "title_zh": "生命之书",
      "title_en": "The Book of Life",
      "author_zh": "吉杜·克里希那穆提",
      "author_en": "Jiddu Krishnamurti",
      "era_zh": "20世纪",
      "era_en": "20th Century",
      "content_zh": "克里希那穆提的365天每日冥想。\"真理是无路之国\"\"观察者即所观之物\"。以去权威、去教条的纯粹觉察为路径，引导人们直接体验自由的真理。",
      "content_en": "Krishnamurti's 365-day daily meditations. 'Truth is a pathless land.' 'The observer is the observed.' Guides people to directly experience the freedom of truth through pure awareness, free from authority and dogma."
    },
    {
      "id": "gb083",
      "cat": "spirit",
      "title_zh": "告别恐惧",
      "title_en": "Love is Letting Go of Fear",
      "author_zh": "杰拉尔德·扬波尔斯基",
      "author_en": "Gerald Jampolsky",
      "era_zh": "20世纪",
      "era_en": "20th Century",
      "content_zh": "基于《奇迹课程》的实用心灵指南。\"爱是放下恐惧\"\"我可以选择以爱或恐惧来回应一切\"。以12个态度转变帮助读者从恐惧走向爱，是心灵疗愈的经典。",
      "content_en": "A practical guide based on A Course in Miracles. 'Love is letting go of fear.' 'I can experience peace or conflict.' Twelve attitude shifts help readers move from fear to love. A classic of spiritual healing."
    },
    {
      "id": "gb084",
      "cat": "spirit",
      "title_zh": "恩宠与勇气",
      "title_en": "Grace and Grit",
      "author_zh": "肯·威尔伯",
      "author_en": "Ken Wilber",
      "era_zh": "20世纪",
      "era_en": "20th Century",
      "content_zh": "超个人哲学家威尔伯的爱的编年史。记录妻子崔雅抗癌五年的灵性旅程。\"痛苦不可避免，受苦则是选择\"——在疾病与死亡面前展现爱与觉知的终极力量。",
      "content_en": "Transpersonal philosopher Wilber's chronicle of love. Records his wife Treya's five-year spiritual journey with cancer. 'Pain is inevitable; suffering is optional.' Demonstrates the ultimate power of love and awareness in the face of illness and death."
    },
    {
      "id": "gb085",
      "cat": "spirit",
      "title_zh": "当尼采哭泣",
      "title_en": "When Nietzsche Wept",
      "author_zh": "欧文·亚隆",
      "author_en": "Irvin Yalom",
      "era_zh": "20世纪",
      "era_en": "20th Century",
      "content_zh": "存在主义心理治疗小说。虚构尼采与布雷尔的相遇，探讨死亡、自由、孤独、无意义四大终极关怀。\"选择的焦虑是自由的代价\"——以文学探索人生终极问题。",
      "content_en": "An existential psychotherapy novel. Fictional encounter between Nietzsche and Breuer, exploring the four ultimate concerns: death, freedom, isolation, and meaninglessness. 'The anxiety of choice is the price of freedom.' Literary exploration of life's ultimate questions."
    },
    {
      "id": "gb086",
      "cat": "modern",
      "title_zh": "活法",
      "title_en": "A Compass to Fulfillment",
      "author_zh": "稻盛和夫",
      "author_en": "Kazuo Inamori",
      "era_zh": "21世纪",
      "era_en": "21st Century",
      "content_zh": "稻盛和夫的人生哲学。\"敬天爱人\"\"作为人，何谓正确？\"以利他之心经营企业和人生，创建两家世界500强。\"人生的目的是提升心性、磨炼灵魂\"——将经营哲学升华为人生修行。",
      "content_en": "Kazuo Inamori's life philosophy. 'Respect the divine and love people.' 'What is the right thing to do as a human being?' Built two Fortune 500 companies with altruistic principles. 'Life's purpose is to elevate the mind and refine the soul.'"
    },
    {
      "id": "gb087",
      "cat": "modern",
      "title_zh": "干法",
      "title_en": "A Compass to Fulfillment: How to Work",
      "author_zh": "稻盛和夫",
      "author_en": "Kazuo Inamori",
      "era_zh": "21世纪",
      "era_en": "21st Century",
      "content_zh": "稻盛和夫的工作哲学。\"工作是最好的修行\"\"极度认真地过好每一天\"。将劳动视为磨炼心性的道场，以\"付出不亚于任何人的努力\"为信条，重新定义工作的意义。",
      "content_en": "Inamori's work philosophy. 'Work is the best spiritual practice.' 'Live each day with extreme earnestness.' Treats labor as a dojo for refining character, with 'effort that doesn't lose to anyone' as the creed, redefining the meaning of work."
    },
    {
      "id": "gb088",
      "cat": "modern",
      "title_zh": "原则",
      "title_en": "Principles",
      "author_zh": "瑞·达利欧",
      "author_en": "Ray Dalio",
      "era_zh": "21世纪",
      "era_en": "21st Century",
      "content_zh": "桥水基金创始人达利欧的人生与工作原则。\"痛苦+反思=进步\"\"极度透明、极度真实\"。以系统化原则应对人生与决策，是现代理性伦理与决策科学的代表。",
      "content_en": "Bridgewater founder Dalio's life and work principles. 'Pain + Reflection = Progress.' 'Radical transparency, radical truth.' Systematic principles for life and decision-making. A representative of modern rational ethics and decision science."
    },
    {
      "id": "gb089",
      "cat": "modern",
      "title_zh": "人类简史",
      "title_en": "Sapiens: A Brief History of Humankind",
      "author_zh": "尤瓦尔·赫拉利",
      "author_en": "Yuval Noah Harari",
      "era_zh": "21世纪",
      "era_en": "21st Century",
      "content_zh": "全球现象级历史哲学著作。从认知革命到科技革命，审视人类文明演进。\"虚构故事是人类合作的基础\"\"快乐的生物化学机制\"——以宏阔视角反思人类何以为人。",
      "content_en": "A global phenomenon in historical philosophy. From the Cognitive to the Scientific Revolution, it examines human civilization's evolution. 'Shared fictions are the basis of human cooperation.' Reflects on what it means to be human with a sweeping perspective."
    },
    {
      "id": "gb090",
      "cat": "modern",
      "title_zh": "未来简史",
      "title_en": "Homo Deus: A Brief History of Tomorrow",
      "author_zh": "尤瓦尔·赫拉利",
      "author_en": "Yuval Noah Harari",
      "era_zh": "21世纪",
      "era_en": "21st Century",
      "content_zh": "赫拉利展望人类未来。探讨当人类通过生物工程和AI获得\"神性\"后，将面临何等伦理挑战。\"数据主义可能取代人文主义\"——对科技时代人类道德的深刻前瞻。",
      "content_en": "Harari's vision of humanity's future. Explores the ethical challenges when humans gain 'divine' powers through bioengineering and AI. 'Dataism may replace humanism.' Profound foresight on morality in the age of technology."
    },
    {
      "id": "gb091",
      "cat": "modern",
      "title_zh": "枪炮、病菌与钢铁",
      "title_en": "Guns, Germs, and Steel",
      "author_zh": "贾雷德·戴蒙德",
      "author_en": "Jared Diamond",
      "era_zh": "20世纪",
      "era_en": "20th Century",
      "content_zh": "普利策奖作品。从地理环境角度解释文明差异，打破种族优越论。\"历史遵循不同的道路，因人们所处环境不同\"——以科学视角促进全球平等与文明理解。",
      "content_en": "A Pulitzer Prize-winning work. Explains civilizational differences through geography, dismantling racial superiority theories. 'History followed different courses for different peoples because of differences in environments.' Promotes global equality through science."
    },
    {
      "id": "gb092",
      "cat": "modern",
      "title_zh": "思考，快与慢",
      "title_en": "Thinking, Fast and Slow",
      "author_zh": "丹尼尔·卡尼曼",
      "author_en": "Daniel Kahneman",
      "era_zh": "21世纪",
      "era_en": "21st Century",
      "content_zh": "诺贝尔经济学奖得主的决策心理学经典。揭示系统1（快思考）与系统2（慢思考）的运作。\"我们对自己的认知盲点远比想象的大\"——理解偏见才能做出更道德的决策。",
      "content_en": "Nobel laureate Kahneman's decision psychology classic. Reveals the operation of System 1 (fast) and System 2 (slow) thinking. 'Our cognitive blind spots are far greater than we imagine.' Understanding bias is key to more ethical decisions."
    },
    {
      "id": "gb093",
      "cat": "modern",
      "title_zh": "黑天鹅",
      "title_en": "The Black Swan",
      "author_zh": "纳西姆·塔勒布",
      "author_en": "Nassim Taleb",
      "era_zh": "21世纪",
      "era_en": "21st Century",
      "content_zh": "关于不确定性哲学的著作。\"黑天鹅\"指不可预测但影响巨大的事件。\"我们知道的东西比我们以为的少得多\"——教导谦逊面对不确定，在脆弱中寻找反脆弱的力量。",
      "content_en": "A work on the philosophy of uncertainty. 'Black Swans' are unpredictable, high-impact events. 'We know far less than we think we know.' Teaches humility in the face of uncertainty and finding antifragility within fragility."
    },
    {
      "id": "gb094",
      "cat": "modern",
      "title_zh": "穷查理宝典",
      "title_en": "Poor Charlie's Almanack",
      "author_zh": "查理·芒格",
      "author_en": "Charlie Munger",
      "era_zh": "21世纪",
      "era_en": "21st Century",
      "content_zh": "投资大师芒格的智慧集。\"反过来想，总是反过来想\"\"每天起床时比昨天聪明一点\"。强调多元思维模型、道德操守和终身学习，是理性生活与道德决策的实用指南。",
      "content_en": "The wisdom of investment master Charlie Munger. 'Invert, always invert.' 'Become a little wiser every day.' Emphasizes mental models, moral integrity, and lifelong learning. A practical guide to rational living and ethical decision-making."
    },
    {
      "id": "gb095",
      "cat": "modern",
      "title_zh": "原子习惯",
      "title_en": "Atomic Habits",
      "author_zh": "詹姆斯·克利尔",
      "author_en": "James Clear",
      "era_zh": "21世纪",
      "era_en": "21st Century",
      "content_zh": "习惯改变行为科学经典。\"每天进步1%，一年后增长37倍\"。以\"提示-渴望-回应-奖赏\"四步模型系统构建好习惯、戒除坏习惯——将道德自律转化为可操作的微小行动。",
      "content_en": "A behavioral science classic on habits. 'Improve 1% every day, and you'll grow 37 times in a year.' The four-step model (Cue-Craving-Response-Reward) systematically builds good habits and breaks bad ones—transforming moral discipline into actionable micro-steps."
    },
    {
      "id": "gb096",
      "cat": "modern",
      "title_zh": "坚毅",
      "title_en": "Grit",
      "author_zh": "安吉拉·达克沃斯",
      "author_en": "Angela Duckworth",
      "era_zh": "21世纪",
      "era_en": "21st Century",
      "content_zh": "宾大心理学家的成功要素研究。\"坚毅=激情+坚持\"。\"天赋不等于成就，持续的努力才能将天赋变为成就\"——以科学证据重新定义努力、毅力和品格的价值。",
      "content_en": "A UPenn psychologist's research on success. 'Grit = passion + perseverance.' 'Talent is not achievement; sustained effort turns talent into achievement.' Redefines the value of effort, perseverance, and character with scientific evidence."
    },
    {
      "id": "gb097",
      "cat": "modern",
      "title_zh": "幸福的方法",
      "title_en": "Happier",
      "author_zh": "泰勒·本-沙哈尔",
      "author_en": "Tal Ben-Shahar",
      "era_zh": "21世纪",
      "era_en": "21st Century",
      "content_zh": "哈佛大学最受欢迎的幸福课。\"幸福是人生的终极货币\"。区分四种人生模式，倡导\"快乐且有意义\"的汉堡模型——将幸福从感觉提升为可学习、可实践的生活能力。",
      "content_en": "Harvard's most popular course on happiness. 'Happiness is the ultimate currency.' Distinguishes four life archetypes, advocating the 'happiness hamburger' model—elevating happiness from feeling to a learnable, practicable life skill."
    },
    {
      "id": "gb098",
      "cat": "modern",
      "title_zh": "心流",
      "title_en": "Flow",
      "author_zh": "米哈里·契克森米哈赖",
      "author_en": "Mihaly Csikszentmihalyi",
      "era_zh": "20世纪",
      "era_en": "20th Century",
      "content_zh": "积极心理学经典。\"心流\"是全身心投入活动的最优体验状态。\"生命的意义在于投入\"——当挑战与技能匹配时，人进入忘我的最佳状态，是幸福与成长的科学。",
      "content_en": "A positive psychology classic. 'Flow' is the optimal experience of total absorption in an activity. 'The meaning of life consists in engagement.' When challenge matches skill, one enters the optimal state of self-forgetfulness. The science of happiness and growth."
    },
    {
      "id": "gb099",
      "cat": "modern",
      "title_zh": "不设限的人生",
      "title_en": "Unlimited Power",
      "author_zh": "安东尼·罗宾",
      "author_en": "Tony Robbins",
      "era_zh": "20世纪",
      "era_en": "20th Century",
      "content_zh": "NLP与个人成长经典。\"信念创造现实\"\"情绪是可以选择的\"。以神经语言程序学方法帮助人们突破心理限制、激发潜能。虽商业化色彩浓厚，但其积极心理学原理影响广泛。",
      "content_en": "An NLP and personal growth classic. 'Beliefs create reality.' 'Emotions are a choice.' Uses neuro-linguistic programming to help people break through psychological limits and unleash potential. Though commercially oriented, its positive psychology principles have wide influence."
    },
    {
      "id": "gb100",
      "cat": "modern",
      "title_zh": "瓦解",
      "title_en": "Things Fall Apart",
      "author_zh": "钦努阿·阿契贝",
      "author_en": "Chinua Achebe",
      "era_zh": "20世纪",
      "era_en": "20th Century",
      "content_zh": "非洲文学经典。讲述尼日利亚部落首领奥康科在殖民冲击下的悲剧。探讨传统与现代、个人与社区、文明冲突中的道德选择。\"当东西瓦解时，中心能否撑住？\"——全球视角下的人类伦理反思。",
      "content_en": "A classic of African literature. The tragedy of Nigerian tribal leader Okonkwo under colonial impact. Explores tradition vs. modernity, individual vs. community, and moral choice in civilizational conflict. 'Things fall apart; the center cannot hold.' Human ethical reflection from a global perspective."
    }
  ],
