zh": "修身治国一理也", "en": "Self-cultivation and governing the state share the same principle"}, {"zh": "道在日用之间", "en": "The Way is in daily life"}, {"zh": "启蒙思想色彩——反思传统", "en": "Enlightenment coloring—reflecting on tradition"}], "hx091": [{"zh": "找好处——发现他人优点是化解矛盾的关键", "en": "Find good points—discovering others' strengths is key to resolving conflicts"}, {"zh": "认不是——承认自己的错误是修身第一步", "en": "Acknowledge faults—admitting your mistakes is the first step of cultivation"}, {"zh": "不怨人——不抱怨是化性的根本", "en": "Don't complain—not complaining is the root of transforming character"}, {"zh": "不生气不上火——情绪管理是健康基础", "en": "Don't get angry or agitated—emotional management is the foundation of health"}, {"zh": "性理疗病——心理状态影响身体健康", "en": "Nature-based healing—psychological state affects physical health"}, {"zh": "化性——改变性格气质是修行目标", "en": "Transforming character—changing temperament is the goal of practice"}, {"zh": "伦常道德——处理好人际关系是根本", "en": "Moral relationships—handling interpersonal relationships well is fundamental"}, {"zh": "五行性理——木火土金水五种性格分析", "en": "Five-element personality—analyzing five character types"}, {"zh": "讲病——通过讲道理化解身心疾病", "en": "Talking through illness—resolving physical and mental illness through reasoning"}, {"zh": "存心——心存善念是化性的前提", "en": "Heart of goodness—maintaining good thoughts is the prerequisite for transformation"}], "hx092": [{"zh": "三界——性心身是人的三个层面", "en": "Three realms—nature, mind, and body are the three dimensions of a person"}, {"zh": "五行——木火土金水对应五种性格", "en": "Five elements—wood, fire, earth, metal, water correspond to five personality types"}, {"zh": "不怨人——十二字薪传核心之一", "en": "Don't complain—one of the twelve-character legacy's core principles"}, {"zh": "找好处——十二字薪传核心之二", "en": "Find good points—the second core principle"}, {"zh": "认不是——十二字薪传核心之三", "en": "Acknowledge faults—the third core principle"}, {"zh": "化性是修行第一要务", "en": "Transforming character is the first priority of practice"}, {"zh": "五行相生相克影响人的命运", "en": "The five elements' mutual generation and restriction affect one's destiny"}, {"zh": "木性人倔强火性人急躁需化性", "en": "Wood types are stubborn; fire types are impatient—both need transformation"}, {"zh": "土性人厚道金性人果断水性人柔和", "en": "Earth types are sincere; metal types are decisive; water types are gentle"}, {"zh": "十二字简明而深刻是化性实用指南", "en": "Twelve characters: concise yet profound—a practical guide to transformation"}], "hx093": [{"zh": "不争——六大宗旨之一", "en": "Do not contend—one of the six great principles"}, {"zh": "不贪——六大宗旨之二", "en": "Do not be greedy—the second principle"}, {"zh": "不求——六大宗旨之三", "en": "Do not seek—the third principle"}, {"zh": "不自私——六大宗旨之四", "en": "Do not be selfish—the fourth principle"}, {"zh": "不自利——六大宗旨之五", "en": "Do not pursue self-interest—the fifth principle"}, {"zh": "不打妄语——六大宗旨之六", "en": "Do not lie—the sixth principle"}, {"zh": "以戒律严谨著称", "en": "Known for strict discipline and precepts"}, {"zh": "将佛教修行落实于日常生活", "en": "Applying Buddhist practice to daily life"}, {"zh": "教育从根本做起——先做人再修行", "en": "Education from the root—first be a good person, then practice"}, {"zh": "六大宗旨是现代人修行的实用指南", "en": "The six principles are a practical guide for modern practitioners"}], "hx094": [{"zh": "敦伦尽分——尽好自己的本分", "en": "Fulfill your duties—discharge your responsibilities well"}, {"zh": "闲邪存诚——防止邪念保持真诚", "en": "Guard against evil and preserve sincerity"}, {"zh": "深信因果——因果报应真实不虚", "en": "Deeply believe in karma—retribution is real and not false"}, {"zh": "老实念佛——净土法门的修行核心", "en": "Sincerely recite Buddha's name—the core practice of Pure Land"}, {"zh": "以书信形式解答修行疑问", "en": "Answering practice questions through letters"}, {"zh": "文字恳切朴实", "en": "Earnest and plain language"}, {"zh": "强调家庭教育的重要性", "en": "Emphasizing the importance of family education"}, {"zh": "戒杀放生是修行基础", "en": "Abstaining from killing and releasing lives are foundational practices"}, {"zh": "因果是佛法根本——不信因果不能修行", "en": "Karma is the root of Buddhism—without believing in karma, one cannot practice"}, {"zh": "老实念佛是最稳妥的修行方法", "en": "Sincerely reciting Buddha's name is the most reliable practice method"}], "hx095": [{"zh": "以戒为师——戒律是修行的根本", "en": "Take precepts as your teacher—discipline is the foundation of practice"}, {"zh": "惜福——珍惜福报不浪费", "en": "Cherish blessings—value your fortune and do not waste"}, {"zh": "慎独——独处时也能自律", "en": "Watchfulness when alone—self-discipline even in solitude"}, {"zh": "勤俭——勤劳节俭是修行", "en": "Diligence and frugality—are themselves practice"}, {"zh": "将南山律宗精神融入现代生活", "en": "Integrating Nanshan Vinaya spirit into modern life"}, {"zh": "艺术与修行的结合", "en": "The union of art and spiritual practice"}, {"zh": "从繁华到简朴的人生转变", "en": "The life transformation from glamour to simplicity"}, {"zh": "以戒律规范身心", "en": "Regulating body and mind through precepts"}, {"zh": "念佛是净土修行根本", "en": "Buddha recitation is the foundation of Pure Land practice"}, {"zh": "悲欣交集——弘一法师的临终境界", "en": "'Sorrow and joy intermingle'—Master Hongyi's final state"}], "hx096": [{"zh": "参禅念佛先须克己", "en": "Before meditating or reciting Buddha's name, first discipline yourself"}, {"zh": "以戒为本——戒律是禅修基础", "en": "Precepts as the foundation—discipline is the basis of meditation"}, {"zh": "参禅须真参实悟", "en": "Meditation requires genuine practice and real awakening"}, {"zh": "禅净不二——禅宗与净土可以兼修", "en": "Chan and Pure Land are not separate—both can be practiced together"}, {"zh": "历经五帝四朝一身肩挑五脉", "en": "Lived through five dynasties, inheriting five Chan lineages"}, {"zh": "虚云精神：苦行精进", "en": "Xuyun's spirit: ascetic practice and diligence"}, {"zh": "修行不离日常生活", "en": "Practice is not separate from daily life"}, {"zh": "以一身复振禅宗五家", "en": "Single-handedly reviving the five Chan schools"}, {"zh": "戒定慧三学是修行纲领", "en": "The three studies of precepts, concentration, and wisdom are the practice framework"}, {"zh": "百年修行如一日", "en": "A century of practice like a single day"}], "hx097": [{"zh": "给人欢喜——让他人快乐是修行", "en": "Give others joy—making others happy is practice"}, {"zh": "给人信心——让他人有信心是慈悲", "en": "Give others confidence—inspiring faith in others is compassion"}, {"zh": "给人希望——让他人有希望是力量", "en": "Give others hope—providing hope is strength"}, {"zh": "给人方便——为他人提供方便是智慧", "en": "Give others convenience—providing ease is wisdom"}, {"zh": "人间佛教——佛法不离世间", "en": "Humanistic Buddhism—the Dharma is not separate from the world"}, {"zh": "以现代语言传播佛法", "en": "Spreading Buddhism in modern language"}, {"zh": "佛法生活化——将佛法融入日常", "en": "Making Buddhism part of life—integrating Dharma into daily living"}, {"zh": "慈悲喜舍四无量心", "en": "The four immeasurable minds: loving-kindness, compassion, joy, and equanimity"}, {"zh": "自利利他——修行不只是为自己", "en": "Benefiting self and others—practice is not just for oneself"}, {"zh": "三好运动：做好事说好话存好心", "en": "Three Goods movement: do good deeds, speak good words, think good thoughts"}], "hx098": [{"zh": "天上最美是星星人间最美是温情", "en": "The most beautiful in heaven are stars; on earth, it's warmth"}, {"zh": "发脾气是短暂的发疯", "en": "Losing temper is brief madness"}, {"zh": "静思——静心思考是智慧之源", "en": "Still contemplation—quiet reflection is the source of wisdom"}, {"zh": "知足感恩善解包容——慈济四神汤", "en": "Contentment, gratitude, understanding, and tolerance—Tzu Chi's four soups"}, {"zh": "做就对了——行动比空谈重要", "en": "Just do it—action matters more than talk"}, {"zh": "慈悲不只是同情而是行动", "en": "Compassion is not just sympathy but action"}, {"zh": "救贫救苦救急救难", "en": "Relieve poverty, suffering, urgency, and disaster"}, {"zh": "人伤我痛人苦我悲——同体大悲", "en": "Others' pain is my pain; others' suffering is my sorrow—great compassion of shared being"}, {"zh": "简单语言传递深刻道理", "en": "Profound principles in simple language"}, {"zh": "愿力改变世界——以愿力推动善行", "en": "Vow power changes the world—driving good deeds through aspiration"}], "hx099": [{"zh": "真诚清净平等正觉慈悲——修行五心", "en": "Sincerity, purity, equality, right awakening, compassion—five minds of practice"}, {"zh": "看破放下自在随缘念佛——修行五要", "en": "Seeing through, letting go, freedom, adapting, Buddha recitation—five essentials"}, {"zh": "以净土法门为核心", "en": "Centered on the Pure Land method"}, {"zh": "融通儒释道——三教合一", "en": "Integrating Confucian, Daoist, and Buddhist teachings"}, {"zh": "多元文化和谐——尊重所有宗教", "en": "Multi-cultural harmony—respecting all religions"}, {"zh": "教育是根本——以教育改变人心", "en": "Education is fundamental—changing hearts through education"}, {"zh": "深入经藏智慧如海", "en": "Deeply study the scriptures; wisdom becomes like the ocean"}, {"zh": "修行就是修正错误的行为", "en": "Practice means correcting wrong behavior"}, {"zh": "一门深入长时熏修", "en": "Practice one method deeply over a long time"}, {"zh": "戒定慧是修行总纲领", "en": "Precepts, concentration, and wisdom are the overall framework"}], "hx100": [{"zh": "学而时习之——学习需要不断实践", "en": "Learn and practice constantly—knowledge requires continuous application"}, {"zh": "以独特视角重新诠释孔子思想", "en": "Reinterpreting Confucius with a unique perspective"}, {"zh": "融通儒释道——三教智慧合一", "en": "Integrating Confucian, Daoist, and Buddhist wisdom"}, {"zh": "经世致用——学问要实用", "en": "Practical application—knowledge must be useful"}, {"zh": "做人是第一等学问", "en": "Being a good person is the highest learning"}, {"zh": "知行合一——理论需结合实践", "en": "Unity of knowledge and action—theory must combine with practice"}, {"zh": "以生动语言讲解经典", "en": "Explaining classics in vivid language"}, {"zh": "修身齐家治国平天下是一贯之道", "en": "Self-cultivation, family harmony, governance, and world peace form one continuous path"}, {"zh": "读书的目的是变化气质", "en": "The purpose of reading is to transform one's temperament"}, {"zh": "传统文化是现代人的精神资源", "en": "Traditional culture is a spiritual resource for modern people"}]},
  "global": {"gb001": [{"zh": "无执着地行动——做你该做的事不执着于结果", "en": "Selfless action—do your duty without attachment to results"}, {"zh": "知识瑜伽——通过智慧认识真理", "en": "Jnana Yoga—knowing truth through wisdom"}, {"zh": "奉爱瑜伽——以虔诚之心 devotion 达到解脱", "en": "Bhakti Yoga—achieving liberation through devotion"}, {"zh": "阿特曼（真我）超越肉体——灵魂不朽", "en": "Atman (true Self) transcends the body—the soul is immortal"}, {"zh": "平等看待一切众生——见梵在万有中", "en": "See the divine equally in all beings—Brahman is in everything"}, {"zh": "履行自己的正法（dharma）不可逃避", "en": "Fulfill your dharma (duty)—it cannot be evaded"}, {"zh": "不行动也是一种行动——不可逃避责任", "en": "Inaction is also action—responsibility cannot be escaped"}, {"zh": "以智慧之剑斩断无明", "en": "Cut through ignorance with the sword of wisdom"}, {"zh": "安定心神再做决定——心乱则行乱", "en": "Steady the mind before acting—a disturbed mind leads to wrong actions"}, {"zh": "人应在世间行动但不被世间所束缚", "en": "One should act in the world but not be bound by it"}], "gb002": [{"zh": "心为法本心尊心使——心是一切法的根本", "en": "Mind precedes all things; mind is their chief"}, {"zh": "怨不怨恶不止唯以息怨怨乃止——以德报怨", "en": "Hatred never ceases by hatred; by non-hatred alone does it cease"}, {"zh": "一切行无常——万物皆在变化", "en": "All conditioned things are impermanent—everything changes"}, {"zh": "苦的根源是贪爱", "en": "The root of suffering is craving"}, {"zh": "八正道是离苦之道", "en": "The Noble Eightfold Path is the way to end suffering"}, {"zh": "己恶己善自知——自我反省是修行", "en": "One knows one's own evil and good—self-reflection is practice"}, {"zh": "如守护己国当护己心", "en": "As one guards one's nation, one should guard one's mind"}, {"zh": "自制为善不能自制为恶", "en": "Self-control is good; lack of self-control is evil"}, {"zh": "不因他人之言而动心", "en": "Do not be moved by others' words"}, {"zh": "勤修戒定慧息灭贪嗔痴", "en": "Diligently practice precepts, concentration, and wisdom; extinguish greed, anger, and delusion"}], "gb003": [{"zh": "认主独一——万物非主唯有真主", "en": "Tawhid—There is no god but God (Allah)"}, {"zh": "五功：念礼斋课朝——穆斯林的五大功课", "en": "Five Pillars: Declaration, Prayer, Fasting, Charity, Pilgrimage"}, {"zh": "慈善是天课——施舍是宗教义务", "en": "Charity is obligatory—Zakat is a religious duty"}, {"zh": "公正待人是信仰的体现", "en": "Justice toward others is a manifestation of faith"}, {"zh": "求知是每个穆斯林男女的天命", "en": "Seeking knowledge is the duty of every Muslim, male and female"}, {"zh": "孝敬父母仅次于拜主", "en": "Honoring parents comes second only to worshipping God"}, {"zh": "邻居的权利必须被尊重", "en": "Neighbors' rights must be respected"}, {"zh": "诚实是信仰的标志", "en": "Honesty is a sign of faith"}, {"zh": "宽恕优于报复", "en": "Forgiveness is superior to revenge"}, {"zh": "敬畏真主是一切智慧的开端", "en": "Reverence for God is the beginning of all wisdom"}], "gb004": [{"zh": "爱上帝——最大的诫命", "en": "Love God—the greatest commandment"}, {"zh": "爱人如己——第二条诫命", "en": "Love your neighbor as yourself—the second commandment"}, {"zh": "金律：你们愿意人怎样待你们你们也要怎样待人", "en": "The Golden Rule: Do to others as you would have them do to you"}, {"zh": "宽恕七十个七次——无限宽恕", "en": "Forgive seventy times seven—unlimited forgiveness"}, {"zh": "虚心的人有福了——八福", "en": "Blessed are the poor in spirit—the Beatitudes"}, {"zh": "使人和睦的人有福了——和平的使命", "en": "Blessed are the peacemakers—the mission of peace"}, {"zh": "爱仇敌——超越常人的爱", "en": "Love your enemies—love beyond the ordinary"}, {"zh": "不要论断人——免得被论断", "en": "Do not judge, or you will be judged"}, {"zh": "施比受更为有福", "en": "It is more blessed to give than to receive"}, {"zh": "你们必晓得真理真理必叫你们得以自由", "en": "You shall know the truth, and the truth shall set you free"}], "gb005": [{"zh": "梵我一如——个体灵魂与宇宙本体同一", "en": "Brahman-Atman unity—the individual soul and cosmic reality are one"}, {"zh": "那个就是你（Tat tvam asi）——终极哲学宣言", "en": "That thou art (Tat tvam asi)—the ultimate philosophical declaration"}, {"zh": "梵不可被感官认知只能被体验", "en": "Brahman cannot be known through senses, only experienced"}, {"zh": "一切万物皆从梵而来归于梵", "en": "All things come from Brahman and return to Brahman"}, {"zh": "知识是通向解脱的道路", "en": "Knowledge is the path to liberation"}, {"zh": "超越善恶二元对立", "en": "Transcending the duality of good and evil"}, {"zh": "内心平静是认识梵的前提", "en": "Inner stillness is the prerequisite for knowing Brahman"}, {"zh": "自我认识即认识宇宙", "en": "Self-knowledge is knowledge of the universe"}, {"zh": "不执着是解脱的关键", "en": "Non-attachment is the key to liberation"}, {"zh": "存在的本质是意识与喜乐", "en": "The essence of existence is consciousness and bliss (Sat-Chit-Ananda)"}], "gb006": [{"zh": "瑜伽是心念活动的止息", "en": "Yoga is the cessation of the mind's fluctuations"}, {"zh": "八支瑜伽——系统修行方法", "en": "Eight Limbs of Yoga—a systematic practice method"}, {"zh": "戒律（Yama）——道德准则", "en": "Yama—ethical disciplines (non-violence, truth, non-stealing, continence, non-possessiveness)"}, {"zh": "精进（Niyama）——自我修行", "en": "Niyama—self-restraint (purity, contentment, discipline, self-study, surrender)"}, {"zh": "体式（Asana）——身体姿势", "en": "Asana—physical postures"}, {"zh": "调息（Pranayama）——呼吸控制", "en": "Pranayama—breath control"}, {"zh": "制感（Pratyahara）——感官收摄", "en": "Pratyahara—withdrawing the senses"}, {"zh": "专注（Dharana）——集中注意力", "en": "Dharana—concentration"}, {"zh": "冥想（Dhyana）——持续专注", "en": "Dhyana—meditation"}, {"zh": "三摩地（Samadhi）——合一境界", "en": "Samadhi—unity consciousness"}], "gb007": [{"zh": "正法（Dharma）是人生的核心准则", "en": "Dharma is the central principle of life"}, {"zh": "履行职责不执着于结果", "en": "Perform your duty without attachment to results"}, {"zh": "战争是内在道德斗争的外化", "en": "War is the externalization of inner moral struggle"}, {"zh": "知识行动与奉献是三条解脱之路", "en": "Knowledge, action, and devotion are three paths to liberation"}, {"zh": "宇宙是周期性创造的", "en": "The universe is cyclically created and destroyed"}, {"zh": "因果业力决定命运", "en": "Karma determines destiny"}, {"zh": "灵魂超越生死轮回", "en": "The soul transcends the cycle of birth and death"}, {"zh": "在行动中保持超然", "en": "Maintain detachment while acting"}, {"zh": "正法有时需要艰难的抉择", "en": "Dharma sometimes requires difficult choices"}, {"zh": "万物互联——一切存在都是梵的显现", "en": "All things are interconnected—all existence is a manifestation of Brahman"}], "gb008": [{"zh": "正法高于个人利益", "en": "Dharma is above personal interest"}, {"zh": "忠诚与奉献是最高美德", "en": "Loyalty and devotion are the highest virtues"}, {"zh": "哈奴曼的无条件奉献是灵性典范", "en": "Hanuman's unconditional devotion is a spiritual model"}, {"zh": "恶必败善必胜——道德宇宙观", "en": "Evil will be defeated and good will prevail"}, {"zh": "家庭责任与社会责任有时冲突", "en": "Family duty and social duty sometimes conflict"}, {"zh": "忍受苦难是修行的一部分", "en": "Enduring suffering is part of practice"}, {"zh": "坚守承诺是品格的体现", "en": "Keeping promises is a sign of character"}, {"zh": "真正的力量来自内心", "en": "True strength comes from within"}, {"zh": "尊重女性是文明社会的基本标志", "en": "Respecting women is a fundamental sign of civilization"}, {"zh": "以慈悲心对待一切众生", "en": "Treat all beings with compassion"}], "gb009": [{"zh": "你并非海洋中的一滴水你是海洋本身", "en": "You are not a drop in the ocean; you are the ocean itself"}, {"zh": "爱是唯一的宗教", "en": "Love is the only religion"}, {"zh": "放下自我才能找到真我", "en": "Let go of the ego to find the true Self"}, {"zh": "痛苦是通往觉醒的道路", "en": "Suffering is the path to awakening"}, {"zh": "在每一刻中寻找神圣", "en": "Find the sacred in every moment"}, {"zh": "沉默比言语更有力量", "en": "Silence is more powerful than words"}, {"zh": "心是宇宙的镜子", "en": "The heart is the mirror of the universe"}, {"zh": "死亡不是终点而是转化", "en": "Death is not an end but a transformation"}, {"zh": "在分离中寻找合一", "en": "Find unity within separation"}, {"zh": "美是通向真理的道路", "en": "Beauty is the path to truth"}], "gb010": [{"zh": "谁是智者向所有人学习的人", "en": "Who is wise? One who learns from all people"}, {"zh": "谁是勇士征服自己欲望的人", "en": "Who is a hero? One who conquers his own desires"}, {"zh": "谁是富足知足的人", "en": "Who is wealthy? One who is content"}, {"zh": "敬畏是智慧的开端", "en": "Reverence is the beginning of wisdom"}, {"zh": "施舍（Tzedakah）是正义而非施舍", "en": "Tzedakah is justice, not charity"}, {"zh": "修复世界（Tikkun Olam）是人间的使命", "en": "Tikkun Olam (repairing the world) is humanity's mission"}, {"zh": "拯救一条生命即拯救整个世界", "en": "Whoever saves a single life saves an entire world"}, {"zh": "不可以说闲话——言语有道德分量", "en": "Do not gossip—words carry moral weight"}, {"zh": "尊重每个人的尊严", "en": "Respect the dignity of every person"}, {"zh": "学习是终身义务", "en": "Learning is a lifelong obligation"}], "gb011": [{"zh": "你掌控的是内心而非外在事件", "en": "You have power over your mind, not outside events"}, {"zh": "过好当下每一刻", "en": "Live each moment as if it were your last"}, {"zh": "障碍即道路——困难是成长的机会", "en": "The obstacle is the way—difficulties are opportunities for growth"}, {"zh": "接受你无法改变的事", "en": "Accept what you cannot change"}, {"zh": "每一天都当做最后一天来过", "en": "Live each day as if it were your last"}, {"zh": "愤怒比引起愤怒的事更有害", "en": "Anger is more harmful than the thing that caused it"}, {"zh": "人被思想所困扰而非事物本身", "en": "People are disturbed by their thoughts, not by things themselves"}, {"zh": "不要做你不愿被知道的事", "en": "Do nothing that you would not wish others to know"}, {"zh": "最好的报复是不效仿对方", "en": "The best revenge is not to be like the wrongdoer"}, {"zh": "宇宙是变化的——人生也是", "en": "The universe is change—life is change too"}], "gb012": [{"zh": "幸福（Eudaimonia）是人生最高目的", "en": "Eudaimonia (flourishing) is life's highest goal"}, {"zh": "中道（Golden Mean）——美德在于适度", "en": "The Golden Mean—virtue lies in moderation"}, {"zh": "美德是习惯养成的", "en": "Virtue is formed through habit"}, {"zh": "友谊是幸福的重要组成", "en": "Friendship is essential to happiness"}, {"zh": "理性沉思是最高的活动", "en": "Rational contemplation is the highest activity"}, {"zh": "真正的快乐来自合德性的活动", "en": "True pleasure comes from virtuous activity"}, {"zh": "人是理性的动物", "en": "Humans are rational animals"}, {"zh": "政治学是最高实践科学", "en": "Politics is the highest practical science"}, {"zh": "实践智慧（Phronesis）比理论更重要", "en": "Practical wisdom (phronesis) is more important than theory"}, {"zh": "德性使人成为善人并做好事", "en": "Virtue makes the person good and their actions right"}], "gb013": [{"zh": "洞穴喻——人需要哲学教育才能认识真理", "en": "The Allegory of the Cave—philosophical education is needed to know truth"}, {"zh": "正义是理想城邦的核心", "en": "Justice is the core of the ideal state"}, {"zh": "哲人王——最理想的统治者", "en": "The philosopher-king—the ideal ruler"}, {"zh": "善的理念是最高存在", "en": "The Form of the Good is the highest reality"}, {"zh": "知识即回忆——灵魂是不朽的", "en": "Knowledge is recollection—the soul is immortal"}, {"zh": "教育应因材施教", "en": "Education should be tailored to the individual"}, {"zh": "音乐和体育是教育两大支柱", "en": "Music and physical education are the two pillars of education"}, {"zh": "灵魂三分：理性激情欲望", "en": "The soul has three parts: reason, spirit, and appetite"}, {"zh": "正义在于各部分各尽其职", "en": "Justice means each part fulfilling its proper function"}, {"zh": "最好的城邦是和谐有序的", "en": "The best state is harmonious and orderly"}], "gb014": [{"zh": "道法自然——最高法则是自然", "en": "The Way follows nature—the highest law is naturalness"}, {"zh": "无为而治——不强为而自成", "en": "Governing through non-action—achieving without forcing"}, {"zh": "上善若水——最高善如水般利万物而不争", "en": "The highest good is like water—benefiting all without competing"}, {"zh": "柔弱胜刚强——以柔克刚", "en": "Softness overcomes hardness"}, {"zh": "千里之行始于足下", "en": "A journey of a thousand miles begins with a single step"}, {"zh": "知人者智自知者明", "en": "Knowing others is wisdom; knowing yourself is enlightenment"}, {"zh": "天之道损有余而补不足", "en": "The Way of Heaven reduces excess and supplements deficiency"}, {"zh": "祸兮福之所倚福兮祸之所伏", "en": "Fortune relies on disaster; disaster hides in fortune"}, {"zh": "见素抱朴少私寡欲", "en": "See the simple, embrace the uncarved block, reduce selfishness, lessen desires"}, {"zh": "信言不美美言不信", "en": "Truthful words are not beautiful; beautiful words are not truthful"}], "gb015": [{"zh": "己所不欲勿施于人——黄金法则", "en": "Do not do to others what you do not want done to yourself—the Golden Rule"}, {"zh": "学而时习之——学习需不断实践", "en": "Learn and practice constantly"}, {"zh": "三人行必有我师", "en": "Among three people, there must be a teacher for me"}, {"zh": "己欲立而立人己欲达而达人", "en": "Establish others as you wish to be established"}, {"zh": "君子喻于义小人喻于利", "en": "The noble person pursues righteousness; the petty pursues profit"}, {"zh": "吾日三省吾身", "en": "I reflect on myself three times daily"}, {"zh": "德不孤必有邻", "en": "Virtue is never alone; it must have neighbors"}, {"zh": "过而不改是谓过矣", "en": "To err and not reform—that is the true error"}, {"zh": "仁者爱人", "en": "The benevolent person loves others"}, {"zh": "朝闻道夕死可矣", "en": "To hear the Way in the morning and die in the evening is acceptable"}], "gb016": [{"zh": "目的与手段——统治需要兼顾道德与实效", "en": "Ends and means—governing requires balancing morality and pragmatism"}, {"zh": "领导者需具备狮子之勇与狐狸之智", "en": "Leaders need the courage of a lion and the cunning of a fox"}, {"zh": "人性本恶——权力需以制度约束", "en": "Human nature tends toward selfishness—power must be constrained by institutions"}, {"zh": "被畏惧比被爱更安全", "en": "Being feared is safer than being loved"}, {"zh": "但不可被仇恨——避免激起反抗", "en": "But avoid being hated—do not provoke rebellion"}, {"zh": "命运可以影响一半但另一半由人掌控", "en": "Fortune controls half; the other half is in human hands"}, {"zh": "君主应具备德性但必要时可不择手段", "en": "The prince should be virtuous but can act ruthlessly when necessary"}, {"zh": "君主应学习战争的艺术", "en": "The prince must master the art of war"}, {"zh": "人民满意比贵族满意更重要", "en": "Satisfying the people matters more than satisfying the nobles"}, {"zh": "国家存续高于一切道德考虑", "en": "State survival supersedes all moral considerations"}], "gb017": [{"zh": "人生而自由却处处身陷枷锁", "en": "Man is born free, and everywhere he is in chains"}, {"zh": "社会契约——人民主权的来源", "en": "The social contract—the source of popular sovereignty"}, {"zh": "公意（General Will）——集体意志高于个人", "en": "The general will—the collective will is above the individual"}, {"zh": "主权在民——政府权力来自人民", "en": "Sovereignty resides in the people—government power comes from the people"}, {"zh": "法律面前人人平等", "en": "All are equal before the law"}, {"zh": "合法政府需经被统治者同意", "en": "Legitimate government requires the consent of the governed"}, {"zh": "人有反抗暴政的权利", "en": "People have the right to resist tyranny"}, {"zh": "自由不是放任而是服从自己制定的法律", "en": "Freedom is not license but obedience to self-made law"}, {"zh": "私有财产是社会不平等的根源", "en": "Private property is the root of social inequality"}, {"zh": "教育应培养自由公民", "en": "Education should cultivate free citizens"}], "gb018": [{"zh": "正当与有利的关系是伦理核心", "en": "The relationship between 'the right' and 'the advantageous' is the core of ethics"}, {"zh": "义为一切道德行为的核心", "en": "Duty is the core of all moral action"}, {"zh": "利益不能凌驾于道义之上", "en": "Advantage cannot override duty"}, {"zh": "美德是灵魂的和谐状态", "en": "Virtue is a harmonious state of the soul"}, {"zh": "人的最终目的是过上合乎自然的生活", "en": "Humanity's ultimate purpose is to live according to nature"}, {"zh": "真正的友谊基于美德", "en": "True friendship is based on virtue"}, {"zh": "公益高于私利", "en": "Public good is above private interest"}, {"zh": "智慧是所有美德之首", "en": "Wisdom is the foremost of all virtues"}, {"zh": "公正给予每个人应得的", "en": "Justice gives each person their due"}, {"zh": "合宜感是道德判断的基础", "en": "The sense of propriety (decorum) is the basis of moral judgment"}], "gb019": [{"zh": "神即自然——一切事物都以必然性存在", "en": "God or Nature—all things exist by necessity"}, {"zh": "对神的理智之爱是最高的境界", "en": "The intellectual love of God is the highest state"}, {"zh": "在理解必然中获得自由", "en": "Freedom comes through understanding necessity"}, {"zh": "情感可以通过理性理解来克服", "en": "Emotions can be overcome through rational understanding"}, {"zh": "万物追求自存——Conatus", "en": "All things strive to persevere in their being—Conatus"}, {"zh": "心身合一——不是二元对立", "en": "Mind and body are unified—not dualistic"}, {"zh": "理性使人超越恐惧", "en": "Reason enables humans to transcend fear"}, {"zh": "善是有用的——道德以增进力量为标准", "en": "Good is what is useful—morality is measured by what increases power"}, {"zh": "自由不是随心所欲而是受理性引导", "en": "Freedom is not doing whatever one wants but being guided by reason"}, {"zh": "永恒不是时间无限而是超越时间", "en": "Eternity is not infinite time but transcendence of time"}], "gb020": [{"zh": "定言命令——只按你愿意它成为普遍法则的准则行动", "en": "The categorical imperative—act only according to maxims you can will to be universal laws"}, {"zh": "人是目的不是手段——尊重人的尊严", "en": "Treat humanity as an end, never merely as a means—respect human dignity"}, {"zh": "道德出于理性自律", "en": "Morality comes from rational self-legislation"}, {"zh": "位我上者灿烂星空道德律在我心中", "en": "Two things fill me with awe: the starry heavens above and the moral law within"}, {"zh": "善意志是唯一无条件善的东西", "en": "A good will is the only thing unconditionally good"}, {"zh": "义务而非倾向——道德行为出于义务", "en": "Duty, not inclination—moral acts are done from duty"}, {"zh": "道德法则来自实践理性", "en": "Moral law comes from practical reason"}, {"zh": "自由是道德的前提——没有自由就没有道德", "en": "Freedom is the prerequisite for morality—no freedom, no morality"}, {"zh": "人应按自律而非他律行动", "en": "One should act according to autonomy, not heteronomy"}, {"zh": "至善是德性与幸福的统一", "en": "The highest good is the union of virtue and happiness"}], "gb021": [{"zh": "伤害原则——个人自由止于伤害他人", "en": "The harm principle—individual freedom ends where harm to others begins"}, {"zh": "思想自由是进步的前提", "en": "Freedom of thought is the prerequisite for progress"}, {"zh": "言论自由保护少数意见", "en": "Free speech protects minority opinions"}, {"zh": "个性发展是人类幸福的要素", "en": "Individual development is essential to human happiness"}, {"zh": "人类不是机器而是活树", "en": "Human beings are not machines, but living trees"}, {"zh": "多数人的暴政比政府暴政更可怕", "en": "The tyranny of the majority can be worse than government tyranny"}, {"zh": "社会不应压制非主流生活方式", "en": "Society should not suppress unconventional lifestyles"}, {"zh": "自愿的行为不需社会干预", "en": "Voluntary actions need no social intervention"}, {"zh": "真理在辩论中成长", "en": "Truth grows through debate"}, {"zh": "自由是社会进步的根本动力", "en": "Liberty is the fundamental driver of social progress"}], "gb022": [{"zh": "向死而生——面对死亡才能本真地活着", "en": "Being-toward-death—confronting death enables authentic living"}, {"zh": "此在——人的存在是特殊的存在方式", "en": "Dasein—human existence is a special mode of being"}, {"zh": "被抛状态——人被抛入世界没有选择", "en": "Geworfenheit—humans are thrown into the world without choice"}, {"zh": "本真与非本真——是否忠于自己的存在", "en": "Authenticity vs. inauthenticity—whether one is true to one's being"}, {"zh": "烦——存在的根本结构", "en": "Care (Sorge)—the fundamental structure of existence"}, {"zh": "时间性是存在的根本维度", "en": "Temporality is the fundamental dimension of being"}, {"zh": "语言是存在的家", "en": "Language is the house of being"}, {"zh": "技术使人遗忘存在", "en": "Technology makes humans forget being"}, {"zh": "人是意义的存在", "en": "Humans are beings who create meaning"}, {"zh": "存在先于本质——人先存在然后定义自己", "en": "Existence precedes essence—humans exist first, then define themselves"}], "gb023": [{"zh": "我们必须想象西西弗是幸福的", "en": "One must imagine Sisyphus happy"}, {"zh": "荒诞——人寻找意义但宇宙沉默", "en": "The Absurd—humans seek meaning but the universe is silent"}, {"zh": "在无意义中创造意义", "en": "Creating meaning within meaninglessness"}, {"zh": "反抗是面对荒诞的态度", "en": "Rebellion is the attitude toward the absurd"}, {"zh": "自由激情反抗——面对荒诞的三重回应", "en": "Freedom, passion, and rebellion—three responses to the absurd"}, {"zh": "真正的哲学问题是自杀问题", "en": "The truly serious philosophical problem is suicide"}, {"zh": "当下比未来更重要", "en": "The present matters more than the future"}, {"zh": "量的问题取代质的问题——每天重复但也有意义", "en": "The question of quantity replaces quality—daily repetition can have meaning"}, {"zh": "接受荒诞但不屈服", "en": "Accept the absurd but do not submit to it"}, {"zh": "在西西弗的推石中找到尊严", "en": "Finding dignity in Sisyphus's rock-pushing"}], "gb024": [{"zh": "最大多数人的最大幸福是道德标准", "en": "The greatest happiness for the greatest number is the moral standard"}, {"zh": "区分高级快乐与低级快乐", "en": "Distinguishing higher pleasures from lower pleasures"}, {"zh": "宁做不满的人类不做满足的猪", "en": "Better to be a dissatisfied human than a satisfied pig"}, {"zh": "快乐有质的差异不只是量的", "en": "Pleasures differ in quality, not just quantity"}, {"zh": "功利原则应考虑长远后果", "en": "The utility principle should consider long-term consequences"}, {"zh": "正义是功利的延伸", "en": "Justice is an extension of utility"}, {"zh": "个人权利是社会功利的体现", "en": "Individual rights are expressions of social utility"}, {"zh": "道德不靠直觉而靠推理", "en": "Morality relies on reasoning, not intuition"}, {"zh": "法律应以促进幸福为目的", "en": "Law should aim at promoting happiness"}, {"zh": "言论自由促进真理发现", "en": "Free speech promotes the discovery of truth"}], "gb025": [{"zh": "正义即公平", "en": "Justice as fairness"}, {"zh": "无知之幕——公正需要排除偏见", "en": "The veil of ignorance—justice requires excluding bias"}, {"zh": "平等自由原则——基本自由不可被剥夺", "en": "The equal liberty principle—basic liberties cannot be taken away"}, {"zh": "差别原则——不平等须有利于最不利者", "en": "The difference principle—inequalities must benefit the least advantaged"}, {"zh": "公平的机会平等", "en": "Fair equality of opportunity"}, {"zh": "原初状态——公正社会的契约基础", "en": "The original position—the contractual basis for a just society"}, {"zh": "基本善是分配的对象", "en": "Primary goods are the objects of distribution"}, {"zh": "正当优先于善", "en": "The right is prior to the good"}, {"zh": "公共理性是民主社会的基础", "en": "Public reason is the foundation of democratic society"}, {"zh": "重叠共识是多元社会的可能", "en": "Overlapping consensus makes pluralistic society possible"}], "gb026": [{"zh": "虚心的人有福了——八福之首", "en": "Blessed are the poor in spirit—the first of the Beatitudes"}, {"zh": "使人和睦的人有福了——和平使者", "en": "Blessed are the peacemakers"}, {"zh": "你们要爱仇敌——超越常人的爱", "en": "Love your enemies—love beyond the ordinary"}, {"zh": "你们愿意人怎样待你们你们也要怎样待人——金律", "en": "Do to others as you would have them do to you—the Golden Rule"}, {"zh": "温柔的人有福了——柔韧的力量", "en": "Blessed are the meek"}, {"zh": "饥渴慕义的人有福了——追求正义", "en": "Blessed are those who hunger and thirst for righteousness"}, {"zh": "怜恤人的人有福了——慈悲心", "en": "Blessed are the merciful"}, {"zh": "清心的人有福了——纯洁的心", "en": "Blessed are the pure in heart"}, {"zh": "为义受逼迫的人有福了——坚守正义", "en": "Blessed are those persecuted for righteousness"}, {"zh": "你们是世上的盐和世上的光——积极影响世界", "en": "You are the salt of the earth and the light of the world"}], "gb027": [{"zh": "敬畏耶和华是智慧的开端", "en": "The fear of the Lord is the beginning of wisdom"}, {"zh": "骄傲在败坏以先狂心在跌倒之前", "en": "Pride goes before destruction, a haughty spirit before a fall"}, {"zh": "智慧比珍珠更美", "en": "Wisdom is more precious than rubies"}, {"zh": "舌头的力量——生死在舌头的权下", "en": "The power of the tongue—death and life are in its power"}, {"zh": "勤劳致富懒惰致贫", "en": "Diligence leads to wealth; laziness leads to poverty"}, {"zh": "诚实是品格的基石", "en": "Honesty is the cornerstone of character"}, {"zh": "管教是爱的表现", "en": "Discipline is an expression of love"}, {"zh": "结交良友受益一生", "en": "Good friends benefit one for life"}, {"zh": "嫉妒骨中的朽烂", "en": "Jealousy rots the bones"}, {"zh": "喜乐的心乃是良药", "en": "A joyful heart is good medicine"}], "gb028": [{"zh": "效法基督——以耶稣为榜样生活", "en": "Imitate Christ—live following Jesus' example"}, {"zh": "谦卑是最大的德性", "en": "Humility is the greatest virtue"}, {"zh": "舍己——背十字架跟从主", "en": "Self-denial—carry the cross and follow the Lord"}, {"zh": "骄傲是一切诱惑之源", "en": "Pride is the source of all temptation"}, {"zh": "若无谦卑不能蒙主悦纳", "en": "Without humility, one cannot be accepted by the Lord"}, {"zh": "内在的虔诚比外在的仪式重要", "en": "Inner devotion is more important than outward ritual"}, {"zh": "爱世俗不能爱上帝", "en": "Love of the world prevents love of God"}, {"zh": "忍受苦难是属灵成长的道路", "en": "Enduring suffering is the path of spiritual growth"}, {"zh": "常思念天上的事", "en": "Constantly think on heavenly things"}, {"zh": "祷告是与神沟通的桥梁", "en": "Prayer is the bridge of communication with God"}], "gb029": [{"zh": "主啊你造我们为你我们的心若不安息在你里面便不得安宁", "en": "You have made us for yourself, O Lord, and our heart is restless until it rests in you"}, {"zh": "自由意志是上帝给人的礼物", "en": "Free will is God's gift to humanity"}, {"zh": "恩典——人无法自救需要神的恩典", "en": "Grace—humans cannot save themselves; they need God's grace"}, {"zh": "原罪——人类继承了亚当的罪", "en": "Original sin—humanity inherited Adam's sin"}, {"zh": "忏悔是认识自我的途径", "en": "Confession is the path to self-knowledge"}, {"zh": "时间——只有现在是真实的", "en": "Time—only the present is real"}, {"zh": "记忆连接过去与现在", "en": "Memory connects the past with the present"}, {"zh": "美是上帝的显现", "en": "Beauty is a manifestation of God"}, {"zh": "恶不是实体而是善的缺失", "en": "Evil is not a substance but the absence of good"}, {"zh": "爱是灵魂的重力", "en": "Love is the gravity of the soul"}], "gb030": [{"zh": "公正——真主命令公正", "en": "Justice—God commands justice"}, {"zh": "慈悲——真主是最慈悲的", "en": "Mercy—God is the Most Merciful"}, {"zh": "知识——求知是穆斯林的天命", "en": "Knowledge—seeking knowledge is every Muslim's duty"}, {"zh": "清洁——身体和心灵的纯洁", "en": "Purity—cleanliness of body and soul"}, {"zh": "诚信——诚实是信仰的标志", "en": "Integrity—honesty is a sign of faith"}, {"zh": "坚忍——在考验中保持信仰", "en": "Patience—maintaining faith during trials"}, {"zh": "感恩——感谢真主的一切恩赐", "en": "Gratitude—thanking God for all blessings"}, {"zh": "施舍——分享是真主的要求", "en": "Charity—sharing is God's command"}, {"zh": "团结——穆斯林如一体", "en": "Unity—Muslims are as one body"}, {"zh": "敬畏——敬畏真主是智慧之源", "en": "Reverence—fear of God is the source of wisdom"}], "gb031": [{"zh": "修复世界（Tikkun Olam）——人间使命", "en": "Tikkun Olam—repairing the world is humanity's mission"}, {"zh": "义人（Tzadik）——以正义行为定义善人", "en": "Tzadik—the righteous person defined by just actions"}, {"zh": "施舍（Tzedakah）——是正义而非慈善", "en": "Tzedakah—justice, not charity"}, {"zh": "拯救一条生命即拯救整个世界", "en": "Whoever saves one life saves the entire world"}, {"zh": "尊重每个人的尊严——人是照上帝形象造的", "en": "Respect everyone's dignity—humans are created in God's image"}, {"zh": "学习是终身义务", "en": "Learning is a lifelong obligation"}, {"zh": "不可以说闲话——言语有道德分量", "en": "Do not gossip—words carry moral weight"}, {"zh": "接待客人——好客是美德", "en": "Hospitality—welcoming guests is a virtue"}, {"zh": "守安息日——休息是神圣的", "en": "Keeping the Sabbath—rest is sacred"}, {"zh": "忏悔（Teshuvah）——回归正道", "en": "Teshuvah—returning to the right path"}], "gb032": [{"zh": "无执着地行动——做你该做的事不执着于结果", "en": "Selfless action—do your duty without attachment to results"}, {"zh": "知识行动与奉献是三条解脱之路", "en": "Knowledge, action, and devotion are three paths to liberation"}, {"zh": "阿特曼超越肉体——灵魂不朽", "en": "Atman transcends the body—the soul is immortal"}, {"zh": "平等看待一切众生", "en": "See the divine equally in all beings"}, {"zh": "履行自己的正法不可逃避", "en": "Fulfill your dharma—it cannot be evaded"}, {"zh": "安定心神再做决定", "en": "Steady the mind before acting"}, {"zh": "超越善恶二元对立", "en": "Transcend the duality of good and evil"}, {"zh": "自我认识即认识宇宙", "en": "Self-knowledge is knowledge of the universe"}, {"zh": "瑜伽是统一与联结", "en": "Yoga means unity and connection"}, {"zh": "人应在世间行动但不被束缚", "en": "Act in the world but not be bound by it"}], "gb033": [{"zh": "凡所有相皆是虚妄——破相显性", "en": "All appearances are illusory—breaking appearances"}, {"zh": "应无所住而生其心——不执着", "en": "Give rise to the mind without dwelling anywhere"}, {"zh": "一切有为法如梦幻泡影", "en": "All conditioned phenomena are like dreams and illusions"}, {"zh": "无我相无人相无众生相无寿者相", "en": "No self, no person, no being, no life span"}, {"zh": "法尚应舍何况非法", "en": "Even the Dharma should be relinquished"}, {"zh": "以无我无人修一切善法", "en": "Practice all good without self or person"}, {"zh": "过去心不可得现在心不可得未来心不可得", "en": "Past, present, and future minds cannot be grasped"}, {"zh": "信心清净则生实相", "en": "When faith is pure, true reality manifests"}, {"zh": "所谓佛法者即非佛法", "en": "What is called Dharma is not Dharma"}, {"zh": "如来者无所从来亦无所去", "en": "The Tathagata comes from nowhere and goes nowhere"}], "gb034": [{"zh": "道法自然——最高法则是自然", "en": "The Way follows nature"}, {"zh": "无为而治——不强为而自成", "en": "Governing through non-action"}, {"zh": "上善若水——利万物而不争", "en": "The highest good is like water—benefiting all without competing"}, {"zh": "柔弱胜刚强", "en": "Softness overcomes hardness"}, {"zh": "千里之行始于足下", "en": "A journey of a thousand miles begins with a single step"}, {"zh": "知人者智自知者明", "en": "Knowing others is wisdom; knowing yourself is enlightenment"}, {"zh": "天之道损有余而补不足", "en": "Heaven reduces excess and supplements deficiency"}, {"zh": "祸兮福之所倚福兮祸之所伏", "en": "Fortune and misfortune are intertwined"}, {"zh": "见素抱朴少私寡欲", "en": "Embrace simplicity; reduce desires"}, {"zh": "信言不美美言不信", "en": "Truthful words are not beautiful; beautiful words are not truthful"}], "gb035": [{"zh": "最古老的希伯来圣经手稿", "en": "The oldest Hebrew biblical manuscripts"}, {"zh": "揭示早期犹太教与基督教的信仰实践", "en": "Reveals the faith practices of early Judaism and Christianity"}, {"zh": "库姆兰社团的社区规则", "en": "The Community Rule of the Qumran sect"}, {"zh": "感恩诗篇——灵性诗歌", "en": "Thanksgiving Psalms—spiritual poetry"}, {"zh": "战争卷——善恶之战的末世论", "en": "The War Scroll—eschatology of the war between good and evil"}, {"zh": "铜卷——可能记录圣殿宝藏", "en": "The Copper Scroll—possibly records Temple treasures"}, {"zh": "以赛亚书卷——最完整的以赛亚书抄本", "en": "The Isaiah Scroll—the most complete Isaiah manuscript"}, {"zh": "社群强调共同生活与财物共享", "en": "The community emphasized shared living and property"}, {"zh": "洁净仪式是信仰核心", "en": "Purification rituals were central to their faith"}, {"zh": "文本揭示了圣经的传播历史", "en": "The texts reveal the history of biblical transmission"}], "gb036": [{"zh": "爱他人就是看见上帝的面容", "en": "To love another person is to see the face of God"}, {"zh": "慈悲可以改变一个人的一生", "en": "Compassion can transform a person's entire life"}, {"zh": "宽恕比报复更有力量", "en": "Forgiveness is more powerful than revenge"}, {"zh": "法律与良心的冲突", "en": "The conflict between law and conscience"}, {"zh": "社会不公制造犯罪", "en": "Social injustice creates crime"}, {"zh": "每个人都有救赎的可能", "en": "Everyone has the possibility of redemption"}, {"zh": "真正的善不求回报", "en": "True goodness seeks no reward"}, {"zh": "苦难可以净化灵魂", "en": "Suffering can purify the soul"}, {"zh": "诚实比谎言更勇敢", "en": "Honesty is braver than lies"}, {"zh": "爱是唯一能战胜黑暗的力量", "en": "Love is the only force that can conquer darkness"}], "gb037": [{"zh": "我们能够知道的唯一可知之事是我们一无所知", "en": "The only thing we can know is that we know nothing"}, {"zh": "战争揭示人性最深处的真相", "en": "War reveals the deepest truths about human nature"}, {"zh": "真正的英雄在平凡生活中", "en": "The real heroes are in ordinary life"}, {"zh": "爱是生命意义的源泉", "en": "Love is the source of life's meaning"}, {"zh": "历史的必然性与个人意志", "en": "The necessity of history vs. individual will"}, {"zh": "死亡使人重新审视生命价值", "en": "Death forces re-examination of life's value"}, {"zh": "和平需要理解和宽容", "en": "Peace requires understanding and tolerance"}, {"zh": "人可以在苦难中成长", "en": "People can grow through suffering"}, {"zh": "家庭是人生的根本", "en": "Family is the foundation of life"}, {"zh": "真正的力量是内心的平静", "en": "True strength is inner peace"}], "gb038": [{"zh": "苦难是良知的觉醒", "en": "Suffering is the awakening of conscience"}, {"zh": "罪恶感的折磨比惩罚更痛苦", "en": "The torment of guilt is worse than punishment"}, {"zh": "人可以超越自己的理论", "en": "Humans can transcend their own theories"}, {"zh": "爱能救赎最深的罪", "en": "Love can redeem the deepest sin"}, {"zh": "理性不能解决所有道德问题", "en": "Reason cannot solve all moral problems"}, {"zh": "真正的忏悔带来新生", "en": "True repentance brings rebirth"}, {"zh": "贫穷不是罪但社会不公", "en": "Poverty is not a sin but social injustice is"}, {"zh": "人的尊严不可被剥夺", "en": "Human dignity cannot be taken away"}, {"zh": "选择即责任", "en": "To choose is to be responsible"}, {"zh": "良知高于法律", "en": "Conscience is above law"}], "gb039": [{"zh": "每个人都对所有人负责", "en": "Everyone is responsible to all for all"}, {"zh": "自由是沉重的负担", "en": "Freedom is a heavy burden"}, {"zh": "没有上帝一切都被允许吗", "en": "Without God, is everything permitted?"}, {"zh": "信仰与理性的永恒冲突", "en": "The eternal conflict between faith and reason"}, {"zh": "爱能战胜恨与嫉妒", "en": "Love can overcome hatred and jealousy"}, {"zh": "忏悔是灵魂的净化", "en": "Repentance is the purification of the soul"}, {"zh": "长老的诗——善恶的最终选择", "en": "The Elder's poem—the ultimate choice between good and evil"}, {"zh": "儿童的无辜与世界的痛苦", "en": "The innocence of children and the suffering of the world"}, {"zh": "每人心中都有天堂与地狱", "en": "Everyone carries both heaven and hell within"}, {"zh": "真正的自由是选择善", "en": "True freedom is choosing the good"}], "gb040": [{"zh": "世界需要梦想者", "en": "The world needs dreamers"}, {"zh": "理想与现实的永恒冲突", "en": "The eternal conflict between ideal and reality"}, {"zh": "疯狂可能是最高形式的清醒", "en": "Madness may be the highest form of sanity"}, {"zh": "骑士精神——保护弱者追求正义", "en": "Chivalry—protecting the weak and pursuing justice"}, {"zh": "坚持理想即使被嘲笑", "en": "Hold fast to ideals even when mocked"}, {"zh": "现实往往比理想更荒诞", "en": "Reality is often more absurd than ideals"}, {"zh": "勇敢是知道失败仍坚持", "en": "Courage is persisting despite knowing you'll fail"}, {"zh": "读书使人完整", "en": "Reading makes a person complete"}, {"zh": "骑士的流浪是对真理的追寻", "en": "The knight's wandering is a quest for truth"}, {"zh": "幽默是面对荒谬的武器", "en": "Humor is the weapon against absurdity"}], "gb041": [{"zh": "真正重要的东西用眼睛是看不见的", "en": "What is essential is invisible to the eye"}, {"zh": "你对你的玫瑰负有责任", "en": "You become responsible for your rose"}, {"zh": "大人们从不自己去理解任何事情", "en": "Grown-ups never understand anything by themselves"}, {"zh": "用心去看才能看清", "en": "It is only with the heart that one can see rightly"}, {"zh": "驯养就是建立联系", "en": "To tame is to establish ties"}, {"zh": "你为你的玫瑰花费的时间使她变得重要", "en": "The time you spent on your rose makes it important"}, {"zh": "每个大人都曾是孩子但很少有人记得", "en": "All grown-ups were once children, but few remember"}, {"zh": "仪式使某一天与其他日子不同", "en": "Rituals make one day different from other days"}, {"zh": "沙漠之所以美是因为某处藏着一口井", "en": "The desert is beautiful because a well is hidden somewhere"}, {"zh": "星星对每个人意味着不同的东西", "en": "The stars mean different things to different people"}], "gb042": [{"zh": "我步入丛林因为我希望生活有意义", "en": "I went to the woods because I wished to live deliberately"}, {"zh": "简朴简朴再简朴", "en": "Simplicity, simplicity, simplicity"}, {"zh": "大多数人都生活在平静的绝望中", "en": "The mass of men lead lives of quiet desperation"}, {"zh": "不要被生活的机械所困", "en": "Do not be trapped by the machinery of living"}, {"zh": "与自然和谐是心灵的归宿", "en": "Harmony with nature is the home of the soul"}, {"zh": "一个人放下的越多他越富有", "en": "A person is rich in proportion to what they can let go"}, {"zh": "时间不是金钱而是生命", "en": "Time is not money but life itself"}, {"zh": "阅读古典作品是与先哲对话", "en": "Reading classics is conversing with the ancients"}, {"zh": "真正的哲学在生活而不在书本", "en": "True philosophy is in living, not in books"}, {"zh": "听不同的鼓声走自己的路", "en": "March to a different drummer—follow your own path"}], "gb043": [{"zh": "除非你穿上别人的鞋子走一走否则你永远无法真正了解一个人", "en": "You never really understand a person until you consider things from their point of view"}, {"zh": "勇气是知道会被打败仍坚持", "en": "Real courage is when you know you're licked before you begin but you begin anyway"}, {"zh": "杀死知更鸟是罪——杀害无辜者是最大的恶", "en": "It's a sin to kill a mockingbird—killing the innocent is the greatest evil"}, {"zh": "偏见来自无知", "en": "Prejudice comes from ignorance"}, {"zh": "正义需要个人勇气", "en": "Justice requires individual courage"}, {"zh": "孩子比大人更能看清不公", "en": "Children see injustice more clearly than adults"}, {"zh": "真正的绅士善待所有人", "en": "A true gentleman treats everyone with respect"}, {"zh": "不要以貌取人", "en": "Don't judge people by appearance"}, {"zh": "教育始于家庭", "en": "Education begins at home"}, {"zh": "同理心是道德的基础", "en": "Empathy is the foundation of morality"}], "gb044": [{"zh": "我们是平等的——至少在上帝脚下是平等的", "en": "We are equal—at least we stand equal at God's feet"}, {"zh": "女性的独立与尊严不可妥协", "en": "Women's independence and dignity are non-negotiable"}, {"zh": "自尊比爱情更重要", "en": "Self-respect is more important than love"}, {"zh": "真正的爱基于平等与尊重", "en": "True love is based on equality and respect"}, {"zh": "经济独立是人格独立的基础", "en": "Economic independence is the basis of personal independence"}, {"zh": "不因贫穷而放弃尊严", "en": "Do not abandon dignity because of poverty"}, {"zh": "道德原则高于个人感情", "en": "Moral principles are above personal feelings"}, {"zh": "每个人都有追求幸福的权利", "en": "Everyone has the right to pursue happiness"}, {"zh": "坚强源于内心的信念", "en": "Strength comes from inner conviction"}, {"zh": "真正的自由是做自己的主人", "en": "True freedom is being master of oneself"}], "gb045": [{"zh": "一个人可以被毁灭但不能被打败", "en": "A man can be destroyed but not defeated"}, {"zh": "人不是为失败而生的", "en": "Man is not made for defeat"}, {"zh": "真正的胜利是永不放弃", "en": "True victory is never giving up"}, {"zh": "尊严在于如何面对失败", "en": "Dignity lies in how one faces defeat"}, {"zh": "孤独是人生的常态", "en": "Loneliness is the normal state of life"}, {"zh": "人与自然的搏斗是人类命运的象征", "en": "Human struggle with nature symbolizes human destiny"}, {"zh": "老不代表无用", "en": "Old age does not mean uselessness"}, {"zh": "经验比力量更重要", "en": "Experience matters more than strength"}, {"zh": "希望和信心支撑人前行", "en": "Hope and faith keep one going"}, {"zh": "真正的英雄主义是明知会输仍全力以赴", "en": "True heroism is giving everything knowing you'll lose"}], "gb046": [{"zh": "过去都是假的回忆是一条没有归途的路", "en": "The past is a lie; memory is a road with no return"}, {"zh": "孤独是人类无法逃避的命运", "en": "Solitude is humanity's inescapable destiny"}, {"zh": "家族的兴衰隐喻历史的循环", "en": "The family's rise and fall metaphorically represents historical cycles"}, {"zh": "爱是无法学会的", "en": "Love cannot be learned"}, {"zh": "魔幻与现实交织——拉美的独特体验", "en": "Magic and reality intertwined—Latin America's unique experience"}, {"zh": "时间不是直线而是循环", "en": "Time is not linear but cyclical"}, {"zh": "历史在重复中前进", "en": "History advances through repetition"}, {"zh": "每个人都在以自己的方式对抗孤独", "en": "Everyone fights solitude in their own way"}, {"zh": "记忆是身份的根基", "en": "Memory is the foundation of identity"}, {"zh": "真正的爱情需要勇气和牺牲", "en": "True love requires courage and sacrifice"}], "gb047": [{"zh": "当你真心渴望某样东西时整个宇宙都会联合起来帮助你", "en": "When you want something, all the universe conspires to help you achieve it"}, {"zh": "天命是你来到这个世界的使命", "en": "Your Personal Legend is your life's mission"}, {"zh": "旅程本身就是宝藏", "en": "The journey itself is the treasure"}, {"zh": "倾听你的心——心知道一切", "en": "Listen to your heart—it knows all things"}, {"zh": "不要害怕失去——失去是获得的前提", "en": "Do not fear loss—loss is the prerequisite for gain"}, {"zh": "当下是唯一真实的时刻", "en": "The present is the only real moment"}, {"zh": "世界之魂连接万物", "en": "The Soul of the World connects all things"}, {"zh": "勇敢追寻梦想不留遗憾", "en": "Bravely pursue your dreams without regret"}, {"zh": "真正的宝藏在你出发的地方", "en": "The true treasure is where you started"}, {"zh": "爱不应阻碍天命而应助其实现", "en": "Love should not hinder destiny but help fulfill it"}], "gb048": [{"zh": "幸福的家庭都是相似的不幸的家庭各有各的不幸", "en": "All happy families are alike; each unhappy family is unhappy in its own way"}, {"zh": "爱情不能成为背叛道德的理由", "en": "Love cannot be a reason to betray morality"}, {"zh": "社会舆论可以毁灭一个人", "en": "Social opinion can destroy a person"}, {"zh": "个人幸福与社会责任冲突", "en": "Personal happiness conflicts with social responsibility"}, {"zh": "宽恕是超越仇恨的唯一途径", "en": "Forgiveness is the only way to transcend hatred"}, {"zh": "信仰给人面对苦难的力量", "en": "Faith gives strength to face suffering"}, {"zh": "真正的爱是超越肉体", "en": "True love transcends the physical"}, {"zh": "农业劳动有净化心灵的力量", "en": "Agricultural labor has the power to purify the soul"}, {"zh": "人不能逃避自己的选择", "en": "One cannot escape one's choices"}, {"zh": "幸福需要道德的支撑", "en": "Happiness requires moral support"}], "gb049": [{"zh": "虚荣与骄傲是不同的东西", "en": "Vanity and pride are different things"}, {"zh": "第一印象可能完全错误", "en": "First impressions can be completely wrong"}, {"zh": "真正的了解需要时间和耐心", "en": "True understanding requires time and patience"}, {"zh": "社会等级不应决定人的价值", "en": "Social class should not determine human worth"}, {"zh": "自我反省是成长的关键", "en": "Self-reflection is key to growth"}, {"zh": "偏见比无知更可怕", "en": "Prejudice is worse than ignorance"}, {"zh": "真正的爱情建立在相互尊重上", "en": "True love is built on mutual respect"}, {"zh": "家庭关系影响个人品格", "en": "Family relationships shape personal character"}, {"zh": "人可以超越自己的局限", "en": "People can transcend their limitations"}, {"zh": "理性的判断需要克服情感偏见", "en": "Rational judgment requires overcoming emotional bias"}], "gb050": [{"zh": "每个人都以为自己是审判者其实每个人都是罪人", "en": "Everyone thinks himself a judge, but everyone is a sinner"}, {"zh": "忏悔是灵魂复活的第一步", "en": "Repentance is the first step of the soul's resurrection"}, {"zh": "社会不公使人堕落", "en": "Social injustice degrades people"}, {"zh": "真正的救赎需要实际行动", "en": "True salvation requires concrete action"}, {"zh": "爱是改变人心的力量", "en": "Love is the power that changes hearts"}, {"zh": "放弃特权是忏悔的开始", "en": "Giving up privilege is the beginning of repentance"}, {"zh": "制度之恶比个人之恶更可怕", "en": "Institutional evil is worse than individual evil"}, {"zh": "宽恕不等于忘记", "en": "Forgiveness does not mean forgetting"}, {"zh": "道德觉醒可能伴随痛苦", "en": "Moral awakening may come with pain"}, {"zh": "人的精神可以复活", "en": "The human spirit can be resurrected"}], "gb051": [{"zh": "真诚地对他人感兴趣", "en": "Become genuinely interested in other people"}, {"zh": "记住对方的名字", "en": "Remember the other person's name"}, {"zh": "让对方觉得自己重要", "en": "Make the other person feel important"}, {"zh": "倾听比说更重要", "en": "Listening is more important than talking"}, {"zh": "从对方的角度看问题", "en": "See things from the other person's perspective"}, {"zh": "赞美比批评更有效", "en": "Praise is more effective than criticism"}, {"zh": "承认自己的错误", "en": "Admit your own mistakes"}, {"zh": "以友善的方式开始", "en": "Begin in a friendly way"}, {"zh": "让对方说是——建立共识", "en": "Get the other person saying 'yes'—build agreement"}, {"zh": "给对方保全面子", "en": "Save the other person's face"}], "gb052": [{"zh": "积极主动——为自己的选择负责", "en": "Be proactive—take responsibility for your choices"}, {"zh": "以终为始——从目标出发规划人生", "en": "Begin with the end in mind—plan from your goals"}, {"zh": "要事第一——优先处理最重要的事", "en": "Put first things first—prioritize what matters most"}, {"zh": "双赢思维——寻求互惠的解决方案", "en": "Think win-win—seek mutually beneficial solutions"}, {"zh": "知彼解己——先理解再被理解", "en": "Seek first to understand, then to be understood"}, {"zh": "统合综效——整体大于部分之和", "en": "Synergize—the whole is greater than the parts"}, {"zh": "不断更新——持续成长", "en": "Sharpen the saw—continuously renew yourself"}, {"zh": "品格伦理比技巧伦理更根本", "en": "Character ethic is more fundamental than personality ethic"}, {"zh": "关注你能控制的而非你不能控制的", "en": "Focus on what you can control, not what you can't"}, {"zh": "信任是人际关系的基础", "en": "Trust is the foundation of relationships"}], "gb053": [{"zh": "人可以被夺走一切唯独不能被夺走选择态度的自由", "en": "Everything can be taken from a person but the freedom to choose one's attitude"}, {"zh": "知道为什么而活的人便能生存", "en": "He who has a why to live can bear almost any how"}, {"zh": "意义不在享乐而在承担责任", "en": "Meaning is not in pleasure but in taking responsibility"}, {"zh": "苦难本身不是意义但面对苦难的态度是", "en": "Suffering itself is not meaning, but the attitude toward it is"}, {"zh": "生命的意义在于爱与工作", "en": "Life's meaning lies in love and work"}, {"zh": "人可以选择自己的态度", "en": "Humans can choose their own attitude"}, {"zh": "终极意义超越逻辑", "en": "Ultimate meaning transcends logic"}, {"zh": "每个人都有独特的生命使命", "en": "Everyone has a unique life mission"}, {"zh": "精神自由不可被剥夺", "en": "Spiritual freedom cannot be taken away"}, {"zh": "在绝望中寻找意义", "en": "Finding meaning in despair"}], "gb054": [{"zh": "你掌控的是内心而非外在事件", "en": "You have power over your mind, not outside events"}, {"zh": "障碍即道路", "en": "The obstacle is the way"}, {"zh": "接受你无法改变的事", "en": "Accept what you cannot change"}, {"zh": "每一天都当做最后一天来过", "en": "Live each day as if it were your last"}, {"zh": "愤怒比引起愤怒的事更有害", "en": "Anger is more harmful than the thing that caused it"}, {"zh": "人被思想所困扰而非事物本身", "en": "People are disturbed by thoughts, not by things"}, {"zh": "最好的报复是不效仿对方", "en": "The best revenge is not to be like the wrongdoer"}, {"zh": "不要做你不愿被知道的事", "en": "Do nothing you would not wish others to know"}, {"zh": "宇宙是变化的人生也是", "en": "The universe is change; life is change"}, {"zh": "理性是克服激情的工具", "en": "Reason is the tool to overcome passions"}], "gb055": [{"zh": "一切烦恼都来自人际关系", "en": "All problems are interpersonal relationship problems"}, {"zh": "自由就是被别人讨厌", "en": "Freedom is being disliked by other people"}, {"zh": "课题分离——分清什么是自己的事什么是别人的事", "en": "Separation of tasks—distinguish what is yours from what is others'"}, {"zh": "人不是为了满足他人期待而活", "en": "People don't live to meet others' expectations"}, {"zh": "共同体感觉——人的终极目标", "en": "Community feeling—humanity's ultimate goal"}, {"zh": "目的论而非原因论——人选择自己的行为", "en": "Teleology, not etiology—humans choose their behavior"}, {"zh": "自卑感是成长的动力", "en": "Feelings of inferiority are the driving force of growth"}, {"zh": "人可以随时改变", "en": "People can change at any time"}, {"zh": "过去不决定现在", "en": "The past does not determine the present"}, {"zh": "自我接纳——接受不完美的自己", "en": "Self-acceptance—accept your imperfect self"}], "gb05 let currentLang = 'zh';
let currentPage = 'huaxia';
let currentCategory = 'all';
let searchTerm = '';
let currentTheme = 'warm';

function setTheme(theme) {
  currentTheme = theme;
  document.documentElement.classList.remove('theme-warm', 'theme-military');
  document.documentElement.classList.add('theme-' + theme);
  document.querySelectorAll('.theme-btn').forEach(btn => {
    btn.classList.toggle('active', btn.classList.contains('theme-' + theme));
  });
}

function L(key) {
  return currentLang === 'zh' ? (key + '_zh') : (key + '_en');
}

function applyLang() {
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = el.dataset[currentLang] || el.dataset.zh;
  });
  document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';
  render();
}

function toggleLang() {
  currentLang = currentLang === 'zh' ? 'en' : 'zh';
  applyLang();
}

function showPage(page) {
  currentPage = page;
  currentCategory = 'all';
  searchTerm = '';
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.page === page);
  });
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function setCategory(cat) {
  currentCategory = cat;
  render();
}

function search(val) {
  searchTerm = val.toLowerCase().trim();
  render();
}

function renderBookCard(book, index) {
  const pageKey = currentPage === 'huaxia' ? 'huaxia' : 'global';
  const cat = DATA.categories[pageKey][book.cat];
  const catName = cat ? cat[currentLang] : '';
  const title = book[L('title')];
  const titleOther = book[currentLang === 'zh' ? 'title_en' : 'title_zh'];
  const author = book[L('author')];
  const era = book[L('era')];
  const content = book[L('content')];
  
  // Build insights HTML
  let insightsHtml = '';
  const insights = INSIGHTS[pageKey] && INSIGHTS[pageKey][book.id];
  if (insights && insights.length > 0) {
    const langKey = currentLang === 'zh' ? 'zh' : 'en';
    const insightsTitle = currentLang === 'zh' ? '10个核心观点' : '10 Key Insights';
    let items = insights.map(ins => 
      `<li>${escapeHtml(ins[langKey])}</li>`
    ).join('');
    insightsHtml = `<div class="insights-section">
      <div class="insights-title">${insightsTitle}</div>
      <ol class="insights-list">${items}</ol>
    </div>`;
  }
  
  const expandHint = currentLang === 'zh' 
    ? '点击展开观点 / 收起' 
    : 'Click to expand insights / Collapse';
  
  return `<div class="book-card fade-in" onclick="this.classList.toggle('expanded')">
    <div class="num">${String(index + 1).padStart(3, '0')}</div>
    <div class="title">${escapeHtml(title)}</div>
    <div class="title-en">${escapeHtml(titleOther)}</div>
    <div class="meta">
      <span>${escapeHtml(author)}</span>
      <span>${escapeHtml(era)}</span>
      <span>${escapeHtml(catName)}</span>
    </div>
    <div class="content">${escapeHtml(content)}</div>
    ${insightsHtml}
    <div class="expand-hint">
      <span>${expandHint}</span>
    </div>
  </div>`;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function renderBooks() {
  let books = currentPage === 'huaxia' ? DATA.huaxia : DATA.global;
  
  if (currentCategory !== 'all') {
    books = books.filter(b => b.cat === currentCategory);
  }
  
  if (searchTerm) {
    books = books.filter(b => {
      const fields = [b.title_zh, b.title_en, b.author_zh, b.author_en, b.content_zh, b.content_en, b.era_zh, b.era_en];
      return fields.some(f => f.toLowerCase().includes(searchTerm));
    });
  }
  
  const cats = DATA.categories[currentPage === 'huaxia' ? 'huaxia' : 'global'];
  
  let html = '';
  
  // Section title
  const pageTitle = currentPage === 'huaxia' 
    ? (currentLang === 'zh' ? '华夏最好的100本善书' : 'Top 100 Good Books of China')
    : (currentLang === 'zh' ? '地球村最好的100本善书' : 'Top 100 Good Books of the World');
  html += `<div class="section-title">${pageTitle}</div>`;
  
  // Search
  const placeholder = currentLang === 'zh' ? '搜索书名、作者、内容...' : 'Search title, author, content...';
  html += `<div class="filters">
    <input type="text" class="search-box" placeholder="${placeholder}" value="${escapeHtml(searchTerm)}" oninput="search(this.value)" />
  </div>`;
  
  // Category chips
  html += '<div class="filter-chips">';
  const allLabel = currentLang === 'zh' ? '全部' : 'All';
  html += `<div class="chip ${currentCategory === 'all' ? 'active' : ''}" onclick="setCategory('all')">${allLabel}</div>`;
  for (const [key, val] of Object.entries(cats)) {
    html += `<div class="chip ${currentCategory === key ? 'active' : ''}" onclick="setCategory('${key}')">${val[currentLang]}</div>`;
  }
  html += '</div>';
  
  // Stats
  const statsText = currentLang === 'zh' 
    ? `共 ${books.length} 本` 
    : `${books.length} books`;
  html += `<div class="stats">${statsText}</div>`;
  
  // Books
  if (books.length === 0) {
    const noResults = currentLang === 'zh' ? '未找到相关善书' : 'No books found';
    html += `<div class="no-results">${noResults}</div>`;
  } else {
    html += '<div class="book-grid">';
    books.forEach((book, i) => {
      html += renderBookCard(book, i);
    });
    html += '</div>';
  }
  
  return html;
}

function renderEaco() {
  const e = DATA.eaco;
  const def = e[L('definition')];
  const goals = e[L('goals')];
  const tags = e[L('tags')];
  
  let goalsHtml = goals.map(g => `<li>${escapeHtml(g)}</li>`).join('');
  
  let linksHtml = e.links.map(l => 
    `<a href="${l.url}" target="_blank" class="eaco-link">${escapeHtml(l[L('label')])}</a>`
  ).join('');
  
  return `
  <div class="eaco-page fade-in">
    <div class="eaco-hero">
      <h1>${escapeHtml(e[L('title')])}</h1>
      <div class="subtitle">${escapeHtml(e[L('subtitle')])}</div>
      <div class="tags">${escapeHtml(tags)}</div>
    </div>
    <div class="eaco-body">
      <div class="eaco-section">
        <h2>${currentLang === 'zh' ? '合约地址 Contract Address' : 'Contract Address'}</h2>
        <div class="eaco-ca-label">${currentLang === 'zh' ? '点击复制 Click to copy' : 'Click to copy'}</div>
        <div class="eaco-ca" onclick="copyCA(this)">${e.ca}</div>
      </div>
      <div class="eaco-section">
        <h2>${currentLang === 'zh' ? '定义 Definition' : 'Definition'}</h2>
        <div class="eaco-definition">${escapeHtml(def)}</div>
      </div>
      <div class="eaco-section">
        <h2>${currentLang === 'zh' ? '核心目标 Core Goals' : 'Core Goals'}</h2>
        <ul class="eaco-goals">${goalsHtml}</ul>
      </div>
      <div class="eaco-section">
        <h2>${currentLang === 'zh' ? '相关链接 Links' : 'Links'}</h2>
        <div class="eaco-links">${linksHtml}</div>
      </div>
    </div>
    <div class="eaco-footer">
      ${currentLang === 'zh' ? 'EACO — 地球村民的 MEMEcoin · 社区驱动 · Solana 链' : 'EACO — Earth Citizens\' MEMEcoin · Community Driven · Solana Chain'}
      <br/>Earth's Best Coin = EACO = E
    </div>
  </div>`;
}

function copyCA(el) {
  navigator.clipboard.writeText(el.textContent).then(() => {
    const orig = el.textContent;
    const msg = currentLang === 'zh' ? '已复制!' : 'Copied!';
    el.textContent = msg;
    setTimeout(() => { el.textContent = orig; }, 1500);
  });
}

function render() {
  const main = document.getElementById('main-content');
  if (currentPage === 'eaco') {
    main.innerHTML = renderEaco();
  } else {
    main.innerHTML = renderBooks();
  }
  // Re-apply data-zh/en for dynamically rendered elements
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = el.dataset[currentLang] || el.dataset.zh;
  });
}

// Init
render();
</script>
