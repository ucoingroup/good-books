this life but to descendants"}, {"zh": "淫恶之报最为惨烈", "en": "Retribution for sexual evil is the most devastating"}, {"zh": "义气交友，患难相扶", "en": "Make friends with righteousness; support each other in adversity"}, {"zh": "改过自新，犹未为晚", "en": "It is never too late to reform and start anew"}, {"zh": "命由心造，相由心生", "en": "Destiny is created by the mind; appearance arises from the heart"}, {"zh": "世态炎凉，唯有善心常暖", "en": "The world is fickle; only a kind heart remains warm"}], "hx013": [{"zh": "以图解文，使善书通俗化", "en": "Illustrating the text, making moral books accessible"}, {"zh": "历史故事佐证每一句经文", "en": "Historical stories verify each line of scripture"}, {"zh": "因果实例增强说服力", "en": "Karmic cases strengthen persuasiveness"}, {"zh": "阴骘（暗中行善）功德大于阳善", "en": "Hidden virtue has greater merit than visible good deeds"}, {"zh": "济贫救危是积德最快的方法", "en": "Helping the poor and saving the endangered is the fastest way to accumulate virtue"}, {"zh": "敬惜字纸，文化传承即积德", "en": "Cherish written characters; cultural preservation is virtue"}, {"zh": "不杀生、不偷盗、不邪淫为三大根本善行", "en": "Not killing, not stealing, and not engaging in sexual misconduct are three fundamental good deeds"}, {"zh": "嫉妒毁人是大恶", "en": "Jealousy and destroying others is a great evil"}, {"zh": "诚敬天地，必有福报", "en": "Sincerely reverencing Heaven and Earth surely brings blessings"}, {"zh": "善书流通功德无量", "en": "Circulating moral books yields boundless merit"}], "hx014": [{"zh": "十殿阎罗审判，善恶逃不过冥界", "en": "The Ten Courts of Hell judge all; good and evil cannot escape the underworld"}, {"zh": "地狱景象警示世人弃恶从善", "en": "Hellish scenes warn people to abandon evil and pursue good"}, {"zh": "杀生、邪淫、不孝三大罪堕地狱", "en": "Killing, sexual misconduct, and unfilial conduct are three great sins leading to hell"}, {"zh": "生前忏悔改过可免地狱之苦", "en": "Repenting and reforming before death can avoid hellish suffering"}, {"zh": "善恶记录在案，分毫不差", "en": "Good and evil deeds are recorded precisely, without error"}, {"zh": "孝道是免地狱的第一保障", "en": "Filial piety is the first guarantee against hell"}, {"zh": "口业（妄语、恶口、两舌、绮语）也有重报", "en": "Verbal karma (lying, harsh words, divisive speech, idle chatter) also brings heavy retribution"}, {"zh": "贪官污吏死后受酷刑", "en": "Corrupt officials suffer torture after death"}, {"zh": "放生、印经、布施可消业免灾", "en": "Releasing lives, printing scriptures, and giving can eliminate karma and avert disaster"}, {"zh": "因果不虚，慎独修身", "en": "Karma is not false; cultivate yourself even when alone"}], "hx015": [{"zh": "集福先须消灾，消灾先须改过", "en": "To accumulate blessings, first dispel disasters; to dispel disasters, first correct faults"}, {"zh": "因果报应是铁律", "en": "Karmic retribution is an iron law"}, {"zh": "太上感应篇是善书总纲", "en": "Taishang's Tractate is the master framework of moral books"}, {"zh": "行善须辨真伪端偏半满", "en": "Doing good requires distinguishing true/false, whole/partial, full/half"}, {"zh": "救人一命胜造七级浮屠", "en": "Saving one life surpasses building a seven-story pagoda"}, {"zh": "不彰人短即是大善", "en": "Not exposing others' shortcomings is a great good"}, {"zh": "敬惜字纸即尊师重道", "en": "Cherishing written characters is respecting teachers and the Way"}, {"zh": "忠孝为百行之首", "en": "Loyalty and filial piety are foremost among all virtues"}, {"zh": "慈悲心是行善的根本", "en": "A compassionate heart is the root of doing good"}, {"zh": "福报从谦虚、勤俭、慈悲中来", "en": "Blessings come from humility, diligence, frugality, and compassion"}], "hx016": [{"zh": "首孝悌——孝敬父母、友爱兄弟是做人之本", "en": "Filial piety and brotherly love first—the foundation of being human"}, {"zh": "次谨信——言行谨慎、诚实守信", "en": "Carefulness and trustworthiness next—cautious words and honest actions"}, {"zh": "泛爱众而亲仁——博爱众人，亲近仁者", "en": "Love all people and be close to the virtuous"}, {"zh": "有余力则学文——道德修养先于知识学习", "en": "With remaining energy, study—moral cultivation precedes academic learning"}, {"zh": "父母呼应勿缓——及时回应父母是孝的开始", "en": "Respond promptly when parents call—this is the beginning of filial piety"}, {"zh": "称尊长勿呼名——对长辈要有尊敬之心", "en": "Do not address elders by name—show respect to seniors"}, {"zh": "凡是人皆须爱——平等博爱一切人", "en": "Love all people equally—universal compassion"}, {"zh": "己有能勿自私——有能力当分享", "en": "When you have ability, do not be selfish—share with others"}, {"zh": "过能改归于无——勇于改过是美德", "en": "Correcting faults erases them—the courage to reform is a virtue"}, {"zh": "步从容立端正——举止得体反映内心修养", "en": "Walk calmly and stand straight—proper demeanor reflects inner cultivation"}], "hx017": [{"zh": "人之初性本善——人性本善是教育的根基", "en": "People at birth are inherently good—this is the foundation of education"}, {"zh": "性相近习相远——后天环境塑造人", "en": "Natures are similar; habits make them diverge—environment shapes the person"}, {"zh": "苟不教性乃迁——不教育则善性会改变", "en": "Without education, good nature deteriorates"}, {"zh": "教之道贵以专——教育贵在专一", "en": "The way of education values focus and consistency"}, {"zh": "玉不琢不成器——人需教育才能成才", "en": "Jade uncut remains a stone—people need education to become capable"}, {"zh": "融四岁能让梨——品德教育应从幼小开始", "en": "Rong at four could yield pears—moral education starts from childhood"}, {"zh": "首孝悌次见闻——先学做人再学知识", "en": "Filial piety and brotherly love first, then knowledge"}, {"zh": "勤有功戏无益——勤奋有成效，嬉戏无益", "en": "Diligence brings results; idle play brings no benefit"}, {"zh": "苏老泉二十七始发愤——何时开始学习都不晚", "en": "Su Laoquan started at 27—it is never too late to learn"}, {"zh": "人遗子金满嬴我教子惟一经——教育比遗产更重要", "en": "Others leave children gold; I teach my child one classic—education matters more than inheritance"}], "hx018": [{"zh": "孝为德之本——所有道德的根基是孝", "en": "Filial piety is the root of all virtue"}, {"zh": "身体发肤受之父母不敢毁伤——爱护身体即孝", "en": "Body and hair come from parents; not daring to harm them is filial piety"}, {"zh": "立身行道扬名于后世——成就自我是大孝", "en": "Establishing oneself and making a name for posterity is the greatest filial piety"}, {"zh": "天子之孝在于爱敬天下", "en": "The emperor's filial piety lies in loving and respecting all under Heaven"}, {"zh": "孝始于事亲，中于事君，终于立身", "en": "Filial piety begins with serving parents, extends to serving the ruler, and culminates in establishing oneself"}, {"zh": "不爱其亲而爱他人者谓之悖德", "en": "Loving others while not loving one's own parents is contrary to virtue"}, {"zh": "孝悌之至通于神明", "en": "The highest filial piety and brotherly love reach the spirits"}, {"zh": "教民亲爱莫善于孝", "en": "To teach people to love one another, nothing is better than filial piety"}, {"zh": "移风易俗莫善于乐，安上治民莫善于礼", "en": "To transform customs, nothing beats music; to govern, nothing beats propriety"}, {"zh": "罪莫大于不孝——不孝是最大的罪过", "en": "No sin is greater than unfilial conduct"}], "hx019": [{"zh": "己所不欲勿施于人——黄金法则", "en": "Do not do to others what you do not want done to yourself—the Golden Rule"}, {"zh": "学而时习之——学习需不断实践", "en": "Learn and practice constantly—knowledge requires continuous application"}, {"zh": "三人行必有我师——人人皆可为师", "en": "Among three people, there must be a teacher for me—everyone can teach"}, {"zh": "己欲立而立人，己欲达而达人——成就他人即成就自己", "en": "Establish others as you wish to be established; help others succeed as you wish to succeed"}, {"zh": "君子喻于义，小人喻于利——价值取向决定品格", "en": "The noble person pursues righteousness; the petty person pursues profit"}, {"zh": "吾日三省吾身——持续自省是修养关键", "en": "I reflect on myself three times daily—continuous self-reflection is key to cultivation"}, {"zh": "德不孤必有邻——有德者不会孤立", "en": "Virtue is never alone; it must have neighbors"}, {"zh": "过而不改是谓过矣——不改正错误才是真正的错", "en": "To err and not reform—that is the true error"}, {"zh": "仁者爱人——仁的核心是爱人", "en": "The benevolent person loves others—the core of benevolence is love"}, {"zh": "朝闻道夕死可矣——追求真理高于生命", "en": "To hear the Way in the morning and die in the evening is acceptable—truth transcends life"}], "hx020": [{"zh": "格物致知——探究事物本质以获得真知", "en": "Investigate things to extend knowledge—examine reality to gain true understanding"}, {"zh": "诚意正心——意念真诚、心念端正", "en": "Sincere intention and rectified mind"}, {"zh": "修身齐家——个人修养是家庭和谐的基础", "en": "Self-cultivation leads to family harmony"}, {"zh": "治国平天下——由内而外的伦理扩展", "en": "Governing the state and bringing peace to the world—ethics expanding outward"}, {"zh": "明明德——彰显天生的光明德性", "en": "Manifesting innate bright virtue"}, {"zh": "亲民——亲近关爱民众", "en": "Loving and being close to the people"}, {"zh": "止于至善——追求最高善为目标", "en": "Resting in the highest good as the ultimate goal"}, {"zh": "知止而后有定——知目标才能心定", "en": "Knowing where to stop brings determination"}, {"zh": "苟日新日日新又日新——日日革新", "en": "If you can improve one day, improve every day—daily renewal"}, {"zh": "自天子以至于庶人壹是皆以修身为本——修身是所有人的根本", "en": "From emperor to commoner, all must take self-cultivation as the foundation"}], "hx021": [{"zh": "天命之谓性——天性是天所赋予", "en": "What Heaven confers is called nature"}, {"zh": "率性之谓道——顺应本性即是道", "en": "Following nature is called the Way"}, {"zh": "修道之谓教——修养此道即是教育", "en": "Cultivating the Way is called education"}, {"zh": "喜怒哀乐之未发谓之中——情感未发是中", "en": "Before joy, anger, sorrow, and pleasure are expressed, it is called the Mean"}, {"zh": "发而皆中节谓之和——发而适度是和", "en": "When expressed in proper measure, it is called harmony"}, {"zh": "致中和天地育万物——中和是宇宙秩序的根基", "en": "Achieving the Mean and harmony, Heaven and Earth flourish and all things grow"}, {"zh": "慎独——独处时仍能自律是最高修养", "en": "Watchfulness when alone—self-discipline in solitude is the highest cultivation"}, {"zh": "诚者天之道也——诚是天道", "en": "Sincerity is the Way of Heaven"}, {"zh": "诚之者人之道也——追求诚是人道", "en": "Achieving sincerity is the Way of humanity"}, {"zh": "博学之审问之慎思之明辨之笃行之——五步学习法", "en": "Study broadly, inquire carefully, reflect deeply, discern clearly, practice earnestly—the five-step learning method"}], "hx022": [{"zh": "性善论——人性本善是孟子核心主张", "en": "Innate goodness—the core of Mencius' philosophy"}, {"zh": "仁政——以仁爱治国的政治理想", "en": "Benevolent governance—the political ideal of ruling with compassion"}, {"zh": "老吾老以及人之老——推己及人的博爱", "en": "Respect the elderly of others as your own—extending love outward"}, {"zh": "富贵不能淫贫贱不能移威武不能屈——大丈夫精神", "en": "Not corrupted by wealth, not swayed by poverty, not bent by force—the spirit of the great person"}, {"zh": "民为贵社稷次之君为轻——民本思想", "en": "The people are most important, the state next, the ruler least—people-first thinking"}, {"zh": "生于忧患死于安乐——逆境磨炼人", "en": "Life springs from sorrow and trouble; death comes from ease and pleasure"}, {"zh": "天将降大任于是人也必先苦其心志——磨炼成材", "en": "When Heaven is about to confer a great mission, it first tests the person's resolve"}, {"zh": "得道者多助失道者寡助——正义必胜", "en": "The just receive much help; the unjust receive little"}, {"zh": "鱼我所欲也熊掌亦我所欲也——舍生取义", "en": "Fish and bear paw both desired—choosing righteousness over life"}, {"zh": "尽其心者知其性也知其性则知天矣——尽心知性知天", "en": "One who fully exercises the mind knows their nature; knowing nature, they know Heaven"}], "hx023": [{"zh": "毋不敬——时刻保持敬意", "en": "Never be irreverent—maintain respect at all times"}, {"zh": "俨若思安定辞——举止庄重言语稳重", "en": "Be composed as in thought, steady in speech"}, {"zh": "敖不可长欲不可从——不可放任傲慢和欲望", "en": "Arrogance must not grow; desires must not be followed blindly"}, {"zh": "礼尚往来——礼的根本是互敬", "en": "Propriety values reciprocity—the root of etiquette is mutual respect"}, {"zh": "临丧不笑——场合不同行为当异", "en": "Do not laugh at funerals—behavior must match the occasion"}, {"zh": "贤者狎而敬之——亲近贤人而保持敬意", "en": "Be close to the wise while maintaining respect"}, {"zh": "夫礼者所以定亲疏决嫌疑——礼的功能是界定关系", "en": "Propriety defines relationships and resolves ambiguities"}, {"zh": "入竟而问禁入国而问俗——尊重当地规矩", "en": "Entering a territory, ask about its prohibitions; entering a state, ask about its customs"}, {"zh": "君子不尽人之欢——不使人难堪", "en": "The noble person does not push others to their limits"}, {"zh": "礼不逾节——行为不超越应有的界限", "en": "Propriety does not exceed proper boundaries"}], "hx024": [{"zh": "黎明即起洒扫庭除——勤劳始于晨", "en": "Rise at dawn and sweep the courtyard—diligence starts in the morning"}, {"zh": "一粥一饭当思来处不易——感恩与节俭", "en": "With each bowl of porridge and rice, remember it did not come easily—gratitude and frugality"}, {"zh": "半丝半缕恒念物力维艰——珍惜一切资源", "en": "With every thread of silk, remember the difficulty of production—cherish all resources"}, {"zh": "宜未雨而绸缪毋临渴而掘井——提前准备", "en": "Prepare before the rain; do not dig a well when thirsty—foresight"}, {"zh": "自奉必须俭约宴客切勿留连——生活简朴", "en": "Live simply and frugally; do not linger at banquets"}, {"zh": "器具质而洁瓦缶胜金玉——实用胜于奢华", "en": "Utensils should be simple and clean—pottery surpasses gold and jade"}, {"zh": "饮食约而精园蔬愈珍馐——简朴饮食更健康", "en": "Eat simply but well—garden vegetables surpass delicacies"}, {"zh": "勿营华屋勿谋良田——不贪图物质享受", "en": "Do not build lavish houses or seek fine fields—do not covet material luxury"}, {"zh": "善欲人见不是真善——真善不求人知", "en": "Good done for show is not true good—true virtue seeks no audience"}, {"zh": "施惠无念受恩莫忘——施恩不记受恩不忘", "en": "When giving, do not remember; when receiving, do not forget"}], "hx025": [{"zh": "早教为重——教育须从幼年开始", "en": "Early education is crucial—teaching must begin in childhood"}, {"zh": "父母威严而有慈则子女畏慎而生孝", "en": "Parents who are strict yet loving raise children who are respectful and filial"}, {"zh": "教妇初来教儿婴孩——教育要及时", "en": "Teach a bride when she first arrives; teach a child in infancy—timing matters"}, {"zh": "兄弟不睦则子侄不爱", "en": "When brothers are not harmonious, nephews will not be loved"}, {"zh": "积财千万不如薄技在身", "en": "Accumulating millions in wealth is inferior to having a small skill"}, {"zh": "借人典籍皆须爱护", "en": "All borrowed books must be cared for"}, {"zh": "未知养亲者不可不学", "en": "Those who do not know how to care for parents must learn"}, {"zh": "慕贤为立身之本", "en": "Admiring the virtuous is the foundation of establishing oneself"}, {"zh": "谚云积财千万不如薄技在身——技能比财富更重要", "en": "A proverb says: a million in wealth is less than a small skill—ability matters more than riches"}, {"zh": "世间小事不可忽略——细节决定成败", "en": "No small matter in the world should be neglected—details determine success"}], "hx026": [{"zh": "命由我作福自己求——命运可改变", "en": "Destiny is made by oneself; fortune is sought by oneself"}, {"zh": "立命改过积善谦德——改命四步法", "en": "Four steps: understand destiny, correct faults, accumulate good, cultivate humility"}, {"zh": "日日知非日日改过——持续反省", "en": "Know your faults daily; correct them daily—continuous reflection"}, {"zh": "善有真假端半大小——行善需辨别", "en": "Good has true/false, whole/partial, great/small—discernment in doing good"}, {"zh": "谦虚受益满招损——谦德是改命关键", "en": "Humility brings benefit; pride brings loss—humility is key to changing destiny"}, {"zh": "行善不图报方为真善", "en": "True good is done without expecting reward"}, {"zh": "爱敬存心是善的根本", "en": "Love and respect in the heart is the root of good"}, {"zh": "功德需以清净心行之", "en": "Merit must be practiced with a pure heart"}, {"zh": "从前种种譬如昨日死——放下过去从头开始", "en": "The past is like yesterday's death—let go and start anew"}, {"zh": "造命者天立命者己——天给命数人改命运", "en": "Heaven creates destiny; the individual establishes it—Heaven gives the number, humans change the fate"}], "hx027": [{"zh": "心即理——真理在心中不在外", "en": "Mind is Principle—truth is within, not without"}, {"zh": "知行合一——知与行不可分割", "en": "Unity of knowledge and action—knowing and doing are inseparable"}, {"zh": "致良知——回归天生的良知", "en": "Extending innate knowledge—returning to one's natural conscience"}, {"zh": "心外无理心外无物——一切从心出发", "en": "No principle outside the mind; no thing outside the mind—all starts from within"}, {"zh": "破山中贼易破心中贼难——内心的恶最难克服", "en": "Breaking mountain bandits is easy; breaking the mind's bandits is hard"}, {"zh": "无善无恶心之体——心本体超越善恶", "en": "Neither good nor evil is the mind's original substance"}, {"zh": "有善有恶意之动——意念产生善恶", "en": "Good and evil arise when intention moves"}, {"zh": "知善知恶是良知——良知能辨别善恶", "en": "Knowing good and evil is innate knowledge"}, {"zh": "为善去恶是格物——实践即是修行", "en": "Doing good and removing evil is investigating things—practice is cultivation"}, {"zh": "人人皆可为尧舜——人人皆可成圣", "en": "Everyone can become a sage like Yao and Shun"}], "hx028": [{"zh": "小学是大学的基础——品德教育先于知识", "en": "Elementary learning is the foundation of higher learning—character before knowledge"}, {"zh": "明伦——明了人伦关系是教育核心", "en": "Understanding relationships is the core of education"}, {"zh": "敬身——以敬慎之心对待自身", "en": "Reverence for oneself—treating oneself with care and respect"}, {"zh": "嘉言——以圣贤之言为榜样", "en": "Admirable words—taking sages' words as models"}, {"zh": "善行——以历史善人为典范", "en": "Virtuous deeds—taking historical good people as examples"}, {"zh": "教人以伦常为先", "en": "Teach relationships and ethics first"}, {"zh": "童蒙养正——儿童时期培养正道", "en": "Nurturing righteousness in childhood"}, {"zh": "礼乐射御书数——全面发展", "en": "Rites, music, archery, charioteering, calligraphy, mathematics—comprehensive development"}, {"zh": "敬胜百邪——恭敬心可战胜一切邪念", "en": "Reverence conquers all evil thoughts"}, {"zh": "师严然后道尊——教师威严则道受尊重", "en": "When the teacher is respected, the Way is honored"}], "hx029": [{"zh": "存诚——保持真诚是修身之本", "en": "Preserving sincerity is the foundation of self-cultivation"}, {"zh": "慎独——独处时自律是最高修养", "en": "Watchfulness when alone is the highest cultivation"}, {"zh": "务实——不尚空谈重实践", "en": "Practical action—valuing deeds over empty talk"}, {"zh": "省过——每日反省自身过失", "en": "Reflecting on faults—examining one's own mistakes daily"}, {"zh": "养心莫善于寡欲——减少欲望以养心", "en": "Nothing nourishes the mind better than reducing desires"}, {"zh": "人各有能不能——承认人的局限性", "en": "Everyone has strengths and limitations—acknowledge human finitude"}, {"zh": "天道远人道迩——从近处着手", "en": "The heavenly Way is far; the human Way is near—start from what is close"}, {"zh": "以理服人以德感人", "en": "Convince with reason; move with virtue"}, {"zh": "学者须先辨义利——学习先分清义与利", "en": "Scholars must first distinguish righteousness from profit"}, {"zh": "今日之我当胜昨日之我", "en": "Today's self should surpass yesterday's self"}], "hx030": [{"zh": "养正——从幼培养正气", "en": "Nurturing righteousness—cultivating right character from youth"}, {"zh": "教女——女性教育同样重要", "en": "Educating women—female education is equally important"}, {"zh": "训俗——教化民俗移风易俗", "en": "Training customs—transforming social practices and customs"}, {"zh": "学仕——为官者的道德规范", "en": "Scholar-officials—ethical standards for those in government"}, {"zh": "从政——政治中的道德原则", "en": "In government—moral principles in political life"}, {"zh": "教人以孝悌为本", "en": "Teach filial piety and brotherly love as the foundation"}, {"zh": "正风俗在于正人心", "en": "Correcting customs begins with correcting hearts"}, {"zh": "为官当以廉为本以仁为心", "en": "Officials should be based on integrity and guided by benevolence"}, {"zh": "家风正则子孙贤", "en": "When the family tradition is upright, descendants will be worthy"}, {"zh": "勤俭传家久诗书继世长", "en": "Diligence and frugality sustain a family; learning and literature endure across generations"}], "hx031": [{"zh": "道法自然——最高法则是自然", "en": "The Way follows nature—the highest law is naturalness"}, {"zh": "无为而治——不强为而自成的智慧", "en": "Governing through non-action—the wisdom of achieving without forcing"}, {"zh": "上善若水——最高善如水般利万物而不争", "en": "The highest good is like water—benefiting all without competing"}, {"zh": "柔弱胜刚强——以柔克刚的智慧", "en": "Softness overcomes hardness—the wisdom of yielding"}, {"zh": "千里之行始于足下——大事始于微小", "en": "A journey of a thousand miles begins with a single step—great things start small"}, {"zh": "知人者智自知者明——认识自己比认识别人更高明", "en": "Knowing others is wisdom; knowing yourself is enlightenment"}, {"zh": "天之道损有余而补不足——天道追求平衡", "en": "The Way of Heaven reduces excess and supplements deficiency—Heaven seeks balance"}, {"zh": "祸兮福之所倚福兮祸之所伏——祸福相依", "en": "Fortune relies on disaster; disaster hides in fortune—blessing and curse are intertwined"}, {"zh": "见素抱朴少私寡欲——回归简朴本真", "en": "See the simple, embrace the uncarved block, reduce selfishness, and lessen desires—return to simplicity"}, {"zh": "信言不美美言不信——真实的不华丽华丽的不真实", "en": "Truthful words are not beautiful; beautiful words are not truthful"}], "hx032": [{"zh": "逍遥游——精神自由是最高境界", "en": "Free and easy wandering—spiritual freedom is the highest state"}, {"zh": "齐物论——万物平等无高下", "en": "On the equality of things—all things are equal without hierarchy"}, {"zh": "天地与我并生万物与我为一——天人合一", "en": "Heaven and Earth were born with me; all things are one with me—unity of human and cosmos"}, {"zh": "至人无己神人无功圣人无名——超越自我功利名声", "en": "The ultimate person has no self; the divine person has no achievement; the sage has no name"}, {"zh": "无用之用——看似无用的东西有大用", "en": "The use of the useless—what seems useless has great use"}, {"zh": "庖丁解牛——顺应自然规律才能游刃有余", "en": "Cook Ding cutting up an ox—following natural patterns leads to mastery"}, {"zh": "心斋坐忘——心灵的斋戒与忘我", "en": "The fasting of the mind and sitting in oblivion"}, {"zh": "蝴蝶梦——物我两忘的哲学思考", "en": "The butterfly dream—philosophical reflection on the dissolution of self"}, {"zh": "泉涸鱼相与处于陆相呴以湿相濡以沫——不如相忘于江湖", "en": "Fish stranded in a dry puddle, moistening each other—it is better to forget each other in the river"}, {"zh": "子非鱼安知鱼之乐——认知的局限性", "en": "You are not a fish, how do you know the fish's joy—the limits of knowledge"}], "hx033": [{"zh": "人能常清静天地悉皆归——清静心是一切的根本", "en": "If one can remain constantly pure and still, Heaven and Earth will all return"}, {"zh": "内观其心心无其心——向内观照发现心本空", "en": "Observe the mind within; the mind has no fixed substance"}, {"zh": "外观其形形无其形——观察身体发现形非实有", "en": "Observe the body without; the body has no fixed form"}, {"zh": "远观其物物无其物——观察万物发现物皆虚幻", "en": "Observe things afar; things have no fixed substance"}, {"zh": "寂无所寂欲岂能生——寂静到极点欲望无从生起", "en": "When stillness reaches its utmost, how can desire arise?"}, {"zh": "众生所以不得真道者为何——妄心", "en": "Why do beings not attain the true Way? Because of the deluded mind"}, {"zh": "澄其心而神自清", "en": "Clarify the mind and the spirit naturally becomes pure"}, {"zh": "自然六欲不生三毒消灭", "en": "Naturally the six desires do not arise and the three poisons are eliminated"}, {"zh": "上士无争下士好争——境界决定行为", "en": "The superior person does not contend; the inferior person loves contention"}, {"zh": "常能遣其欲而心自静", "en": "Constantly dispel desires and the mind naturally becomes still"}], "hx034": [{"zh": "收心——收摄散乱的心是修行第一步", "en": "Gathering the mind—collecting the scattered mind is the first step of practice"}, {"zh": "断缘——减少不必要的世俗交往", "en": "Severing ties—reducing unnecessary worldly connections"}, {"zh": "简事——简化事务以减少心理负担", "en": "Simplifying affairs—reducing mental burden"}, {"zh": "真观——以智慧观察事物的本质", "en": "True observation—seeing the nature of things with wisdom"}, {"zh": "泰定——深度宁静中与道合一", "en": "Calm stability—uniting with the Way in deep stillness"}, {"zh": "敬信——对道法的恭敬与信心是基础", "en": "Reverence and faith—respect and trust in the Way are foundational"}, {"zh": "得道——最终达到与道合一的境界", "en": "Attaining the Way—finally reaching unity with the Way"}, {"zh": "心如止水才能映照万物", "en": "Only a mind like still water can reflect all things"}, {"zh": "修道在日用之间——修行融入日常生活", "en": "Cultivating the Way in daily life—practice integrated into everyday living"}, {"zh": "息虑忘缘乃入道之要", "en": "Quieting thoughts and forgetting entanglements is the key to entering the Way"}], "hx035": [{"zh": "虚化神神化气气化血血化形——万物从虚而来", "en": "The void transforms into spirit, spirit into qi, qi into blood, blood into form—all comes from the void"}, {"zh": "万物皆化——变化是宇宙的根本规律", "en": "All things transform—change is the fundamental law of the universe"}, {"zh": "以俭化奢——节俭是化俗的关键", "en": "Transforming extravagance through frugality—thrift is key to transforming customs"}, {"zh": "以德化力——道德比暴力更有效", "en": "Transforming force through virtue—morality is more effective than violence"}, {"zh": "以仁化暴——仁慈化解暴力", "en": "Transforming violence through benevolence—kindness dissolves brutality"}, {"zh": "食为政首——民生是政治的根本", "en": "Food is the head of government—people's livelihood is the foundation of politics"}, {"zh": "化民先化己——教化他人先教化自己", "en": "To transform others, first transform yourself"}, {"zh": "道生万物而不有——道创造万物但不占有", "en": "The Way generates all things but does not possess them"}, {"zh": "术化是道化的具体方法", "en": "Technical transformation is the specific method of the Way's transformation"}, {"zh": "一切变化最终归于虚", "en": "All transformations ultimately return to the void"}], "hx036": [{"zh": "贵虚——以虚为贵，空灵自在", "en": "Valuing emptiness—cherishing the void, free and unbounded"}, {"zh": "齐物——万物齐一，无分贵贱", "en": "Equalizing things—all things are one, without hierarchy"}, {"zh": "愚公移山——持之以恒可改天换地", "en": "The foolish old man removes mountains—persistence can transform the world"}, {"zh": "杞人忧天——过度的忧虑是无意义的", "en": "The man of Qi worried about the sky—excessive worry is meaningless"}, {"zh": "顺应自然——不违逆天理", "en": "Following nature—going against the heavenly Way"}, {"zh": "超脱生死——生死不过气之聚散", "en": "Transcending life and death—they are merely the gathering and dispersing of qi"}, {"zh": "天瑞——自然的祥瑞不需外求", "en": "Heavenly auspiciousness—nature's blessings need not be sought externally"}, {"zh": "力命——人力与天命的关系", "en": "Effort and destiny—the relationship between human effort and heavenly fate"}, {"zh": "杨朱篇——重视生命的价值", "en": "The Yang Zhu chapter—valuing the worth of life"}, {"zh": "说符——言行一致方为真道", "en": "Explaining correspondences—words and actions must match for the true Way"}], "hx037": [{"zh": "以道化人——用道来教化世人", "en": "Transforming people through the Way"}, {"zh": "以德治国——德治优于法治", "en": "Governing through virtue—virtue governance surpasses law governance"}, {"zh": "道无为而无不为", "en": "The Way does nothing yet leaves nothing undone"}, {"zh": "水之德——至柔至刚", "en": "The virtue of water—the softest yet the strongest"}, {"zh": "静为躁君——宁静统率躁动", "en": "Stillness is the master of restlessness"}, {"zh": "微明——见微知著的智慧", "en": "Subtle illumination—the wisdom of seeing the large in the small"}, {"zh": "柔弱处上——柔弱反处优势", "en": "The soft and weak occupy the superior position"}, {"zh": "知足不辱知止不殆", "en": "Knowing enough, one is not disgraced; knowing when to stop, one is not endangered"}, {"zh": "为学日益为道日损——求道是减法", "en": "Studying increases daily; pursuing the Way decreases daily—the Way is subtraction"}, {"zh": "大道废有仁义——失道而后德", "en": "When the great Way declined, benevolence and righteousness appeared—losing the Way, then virtue"}], "hx038": [{"zh": "道为主兼融百家——以道为体以百家为用", "en": "Daoism as the core, incorporating all schools"}, {"zh": "天人感应——天人之间的互动关系", "en": "Resonance between Heaven and humanity—the interactive relationship"}, {"zh": "无为而治是理想政治模式", "en": "Governance through non-action is the ideal political model"}, {"zh": "原道——探求道的本源", "en": "Investigating the Way—exploring the origin of the Way"}, {"zh": "精神训——修养精神的方法", "en": "Training the spirit—methods for spiritual cultivation"}, {"zh": "时则——顺应天时节令", "en": "Seasonal rules—following heavenly time and seasons"}, {"zh": "主术——君主治国的方略", "en": "The ruler's techniques—strategies for governing"}, {"zh": "缪称——名称与实际的关系", "en": "Erroneous names—the relationship between names and reality"}, {"zh": "齐俗——不同风俗的平等对待", "en": "Equalizing customs—treating different customs equally"}, {"zh": "道德之至归于自然", "en": "The summit of morality returns to nature"}], "hx039": [{"zh": "内宝养身外用利物——内外兼修", "en": "Inner treasure nourishes the body; outer application benefits things—cultivating both within and without"}, {"zh": "神仙可学——通过修炼可以成仙", "en": "Immortality can be learned—one can become immortal through cultivation"}, {"zh": "炼丹术——内丹与外丹的修行体系", "en": "Alchemy—the inner and outer elixir cultivation system"}, {"zh": "养生——身体与精神的双重保养", "en": "Nourishing life—dual care of body and spirit"}, {"zh": "抱朴——守住本真朴素", "en": "Embracing simplicity—maintaining one's original true simplicity"}, {"zh": "博学而贵择——学贵在择善", "en": "Study broadly but value selection—learning's worth is in choosing well"}, {"zh": "忠孝是修道的基础", "en": "Loyalty and filial piety are the foundation of cultivating the Way"}, {"zh": "善恶报应如影响声", "en": "Good and evil retribution is like echo to sound and shadow to form"}, {"zh": "不争而善胜", "en": "Winning without competing"}, {"zh": "守一存想——专注一处以修心", "en": "Guarding the One and visualization—focusing on one point to cultivate the mind"}], "hx040": [{"zh": "性命双修——心性与身体同时修炼", "en": "Dual cultivation of nature and destiny—practicing both mind and body"}, {"zh": "先修命后修性——从身体入手再到心性", "en": "First cultivate destiny, then nature—starting from the body, then the mind"}, {"zh": "阴阳相交——内丹修炼的核心原理", "en": "The interaction of yin and yang—the core principle of inner alchemy"}, {"zh": "火候——修炼时机的把握至关重要", "en": "Fire timing—grasping the right timing in cultivation is crucial"}, {"zh": "药物——精气神为内丹三宝", "en": "Medicine—essence, qi, and spirit are the three treasures of inner alchemy"}, {"zh": "抽铅添汞——阴阳调和的方法", "en": "Extracting lead and adding mercury—the method of harmonizing yin and yang"}, {"zh": "温养——修炼后的保养", "en": "Warm nourishment—maintenance after cultivation"}, {"zh": "脱胎神化——最终达到超越境界", "en": "Shedding the mortal body and spiritual transformation—reaching transcendence"}, {"zh": "道法自然——修炼遵循自然规律", "en": "The Way follows nature—cultivation follows natural laws"}, {"zh": "真铅真汞——先天的精气而非后天物质", "en": "True lead and true mercury—inherent essence and spirit, not acquired substances"}], "hx041": [{"zh": "十善业是一切善法的根本", "en": "The ten virtuous actions are the foundation of all wholesome dharmas"}, {"zh": "不杀生——尊重一切生命", "en": "Not killing—respecting all life"}, {"zh": "不偷盗——不取不义之财", "en": "Not stealing—not taking what is not given"}, {"zh": "不邪淫——守持清净戒行", "en": "No sexual misconduct—maintaining pure conduct"}, {"zh": "不妄语——诚实不欺", "en": "Not lying—being honest and truthful"}, {"zh": "不两舌——不挑拨离间", "en": "No divisive speech—not sowing discord"}, {"zh": "不恶口——不用粗暴语言", "en": "No harsh words—not using abusive language"}, {"zh": "不绮语——不说无义之语", "en": "No idle chatter—not speaking meaninglessly"}, {"zh": "不贪——少欲知足", "en": "Not coveting—having few desires and being content"}, {"zh": "不嗔不痴——息怒增慧", "en": "No anger and no wrong views—quelling anger and increasing wisdom"}], "hx042": [{"zh": "地狱不空誓不成佛——地藏大愿", "en": "Not becoming a Buddha until all hells are empty—Ksitigarbha's great vow"}, {"zh": "孝亲报恩是佛教入世的核心", "en": "Filial piety and gratitude are the core of Buddhist worldly engagement"}, {"zh": "因果轮回真实不虚", "en": "Karma and rebirth are real and not empty"}, {"zh": "布施修福能改变命运", "en": "Giving and accumulating merit can change destiny"}, {"zh": "临终一念决定来世去向", "en": "The final thought at death determines the next life's direction"}, {"zh": "造恶堕地狱造善生人天", "en": "Evil deeds lead to hell; good deeds lead to human and heavenly realms"}, {"zh": "为亡者修福可超度", "en": "Practicing merit for the deceased can aid their liberation"}, {"zh": "不孝父母堕无间地狱", "en": "Being unfilial to parents leads to the Avici Hell"}, {"zh": "布施功德中以法布施最为殊胜", "en": "Among charitable giving, the gift of Dharma is supreme"}, {"zh": "一切众生皆有佛性——皆可成佛", "en": "All beings have Buddha-nature—all can become Buddhas"}], "hx043": [{"zh": "凡所有相皆是虚妄——破相显性", "en": "All appearances are illusory—breaking appearances to reveal nature"}, {"zh": "应无所住而生其心——不执着", "en": "Give rise to the mind without dwelling anywhere—non-attachment"}, {"zh": "过去心不可得现在心不可得未来心不可得——三世心不可得", "en": "The past mind cannot be grasped; the present mind cannot be grasped; the future mind cannot be grasped"}, {"zh": "一切有为法如梦幻泡影如露亦如电", "en": "All conditioned phenomena are like dreams, illusions, bubbles, shadows, dew, and lightning"}, {"zh": "无我相无人相无众生相无寿者相", "en": "No self, no person, no being, no life span"}, {"zh": "法尚应舍何况非法——不执着于法", "en": "Even the Dharma should be relinquished, let alone non-Dharma"}, {"zh": "所谓佛法者即非佛法——超越概念", "en": "What is called Buddha-Dharma is not Buddha-Dharma—transcending concepts"}, {"zh": "以无我无人修一切善法", "en": "Practice all good dharmas without self or person"}, {"zh": "如来者无所从来亦无所去故名如来", "en": "The Tathagata comes from nowhere and goes nowhere—hence 'Tathagata'"}, {"zh": "信心清净则生实相", "en": "When faith is pure, the true reality manifests"}], "hx044": [{"zh": "色不异空空不异色——色空不二", "en": "Form is not different from emptiness; emptiness is not different from form—form and emptiness are one"}, {"zh": "色即是空空即是色——万物本质为空", "en": "Form is emptiness; emptiness is form—the essence of all things is empty"}, {"zh": "受想行识亦复如是——五蕴皆空", "en": "Feeling, perception, mental formation, and consciousness are likewise empty"}, {"zh": "是诸法空相不生不灭不垢不净不增不减", "en": "The empty nature of all dharmas: neither arising nor ceasing, neither defiled nor pure, neither increasing nor decreasing"}, {"zh": "无眼耳鼻舌身意无色声香味触法——六根六境皆空", "en": "No eye, ear, nose, tongue, body, or mind; no form, sound, smell, taste, touch, or thought"}, {"zh": "无苦集灭道——四谛亦空", "en": "No suffering, cause, cessation, or path—even the Four Noble Truths are empty"}, {"zh": "无智亦无得——智慧与所得皆空", "en": "No wisdom and no attainment—both wisdom and gain are empty"}, {"zh": "心无挂碍无有恐怖——无执着即无恐惧", "en": "With no obstacles in the mind, there is no fear—non-attachment means no fear"}, {"zh": "远离颠倒梦想——超越妄想", "en": "Far from inverted dreams and fantasies—transcending delusion"}, {"zh": "究竟涅槃——最终觉悟", "en": "Ultimate nirvana—final awakening"}], "hx045": [{"zh": "不可以少善根福德因缘得生彼国——往生需多善根", "en": "One cannot be born in the Pure Land with few good roots, blessings, and conditions"}, {"zh": "执持名号一心不乱——念佛是往生关键", "en": "Hold fast to the name with an undistracted mind—Buddha recitation is key to rebirth"}, {"zh": "极乐世界无有众苦但受诸乐", "en": "The Pure Land has no suffering but only joy"}, {"zh": "七宝池八功德水——极乐世界的庄严", "en": "Pools of seven jewels and water of eight virtues—the splendor of the Pure Land"}, {"zh": "阿弥陀佛光照无量", "en": "Amitabha Buddha's light is boundless"}, {"zh": "众生闻者应当发愿生彼国土", "en": "Beings who hear this should vow to be born in that land"}, {"zh": "已发愿今发愿当发愿——信愿行三资粮", "en": "Those who have vowed, are vowing, and will vow—faith, vow, and practice as provisions"}, {"zh": "念佛念法念僧——三念即修行", "en": "Mindful of Buddha, Dharma, and Sangha—three mindfulnesses are practice"}, {"zh": "不退转——往生后不再退堕", "en": "Non-retrogression—after rebirth, one does not fall back"}, {"zh": "一切诸佛所护念经——诸佛护持", "en": "The sutra protected and remembered by all Buddhas"}], "hx046": [{"zh": "会三归一——三乘最终归于一乘", "en": "Unifying the three vehicles into one—all paths lead to the One Vehicle"}, {"zh": "开示悟入佛之知见——佛出世的本怀", "en": "Revealing, showing, awakening, and entering the Buddha's knowledge and vision"}, {"zh": "一切众生皆可成佛——佛性平等", "en": "All beings can become Buddhas—Buddha-nature is equal"}, {"zh": "方便品——佛以方便力度众生", "en": "Expedient means—the Buddha uses skillful methods to save beings"}, {"zh": "火宅喻——三界如火宅当求出离", "en": "The burning house parable—the three realms are like a burning house; seek to escape"}, {"zh": "穷子喻——众生本具佛性而不自知", "en": "The poor son parable—beings inherently possess Buddha-nature but do not know it"}, {"zh": "药草喻——佛说法如雨普润万物", "en": "The medicinal herbs parable—the Buddha's teaching is like rain, nourishing all"}, {"zh": "化城喻——中途设方便城令人前进", "en": "The phantom city parable—setting up provisional resting places to encourage progress"}, {"zh": "常不轻菩萨——不轻视任何众生", "en": "Bodhisattva Never Despise—never looking down on any being"}, {"zh": "观世音菩萨普门品——大慈大悲救苦救难", "en": "The Universal Gate chapter—great compassion, saving from all suffering"}], "hx047": [{"zh": "楞严大定——首楞严三昧是最高禅定", "en": "The Surangama Samadhi—the highest meditative concentration"}, {"zh": "七处征心——心不在身内身外等七处", "en": "Seven locations investigating the mind—the mind is not found in seven places"}, {"zh": "二十五圆通——二十五种修行方法", "en": "Twenty-five methods of penetrating to enlightenment"}, {"zh": "观世音菩萨耳根圆通——观音法门", "en": "Avalokitesvara's sound-base penetration—the Guanyin method"}, {"zh": "四种清净明诲——戒杀盗淫妄", "en": "Four clear precepts—against killing, stealing, sexual misconduct, and lying"}, {"zh": "五十阴魔——修行中的五十种魔障", "en": "Fifty demon-states—fifty obstacles in meditation practice"}, {"zh": "楞严咒——降魔第一神咒", "en": "The Surangama Mantra—the foremost mantra for subduing demons"}, {"zh": "狂心顿歇即菩提", "en": "When the wild mind suddenly stops, that is bodhi (awakening)"}, {"zh": "因地不真果招迂曲——发心要正", "en": "If the cause is not true, the result will be distorted—the intention must be correct"}, {"zh": "不假修行但言理悟无有是处", "en": "It is impossible to attain liberation through intellectual understanding without practice"}], "hx048": [{"zh": "一即一切一切即一——法界缘起", "en": "One is all; all is one—the interdependent origination of the dharma realm"}, {"zh": "不忘初心成佛有余——初发心至关重要", "en": "Never forget the initial aspiration, and Buddhahood is assured"}, {"zh": "普贤十大愿王导归极乐", "en": "Samantabhadra's Ten Great Vows guide to the Pure Land"}, {"zh": "善财童子五十三参——参学精神", "en": "Sudhana's fifty-three visits—the spirit of seeking learning"}, {"zh": "心佛众生三无差别", "en": "Mind, Buddha, and beings are three without difference"}, {"zh": "一切唯心造——万法由心", "en": "All is created by the mind—ten thousand dharmas arise from mind"}, {"zh": "理事无碍法界——理与事圆融无碍", "en": "The dharma realm of non-obstruction between principle and phenomena"}, {"zh": "因陀罗网——重重无尽互摄互入", "en": "Indra's net—infinitely interpenetrating and mutually containing"}, {"zh": "菩萨行以利益众生为本", "en": "Bodhisattva practice is rooted in benefiting beings"}, {"zh": "知幻即离离幻即觉", "en": "Knowing illusion is to depart from it; departing from illusion is awakening"}], "hx049": [{"zh": "菩提本无树明镜亦非台——破除执着", "en": "Bodhi originally has no tree; the bright mirror has no stage—breaking attachments"}, {"zh": "本来无一物何处惹尘埃——自性本空", "en": "Originally there is not a single thing—where could dust alight?"}, {"zh": "见性成佛——认识自性即成佛", "en": "Seeing one's nature and becoming a Buddha—recognizing one's true nature"}, {"zh": "顿悟——瞬间觉悟自性", "en": "Sudden awakening—instantly realizing one's true nature"}, {"zh": "无念为宗——不执着于念头", "en": "Non-thought as the principle—not clinging to thoughts"}, {"zh": "无相为体——超越一切相", "en": "Non-form as the substance—transcending all appearances"}, {"zh": "无住为本——心不执着于任何处", "en": "Non-dwelling as the foundation—the mind does not cling anywhere"}, {"zh": "佛法在世间不离世间觉", "en": "The Buddha-Dharma is in the world; awakening is not apart from the world"}, {"zh": "迷时师度悟了自度", "en": "When deluded, the teacher saves you; when awakened, you save yourself"}, {"zh": "心平何劳持戒行直何用修禅", "en": "When the mind is peaceful, why work at keeping precepts? When conduct is straight, why practice meditation?"}], "hx050": [{"zh": "四十二章经是佛教入华第一经", "en": "The Sutra of Forty-Two Sections is the first Buddhist text to enter China"}, {"zh": "持戒是修行的根本", "en": "Keeping precepts is the foundation of practice"}, {"zh": "财色之于人譬如小儿贪刀刃之蜜", "en": "Wealth and lust are like a child licking honey on a knife blade"}, {"zh": "恶人害贤者犹仰天而唾", "en": "An evil person harming a sage is like spitting at the sky"}, {"zh": "夫为道者如牛负重行深泥中", "en": "One pursuing the Way is like an ox carrying a heavy load through deep mud"}, {"zh": "慎勿信汝意汝意不可信", "en": "Be careful not to trust your own mind; your mind cannot be trusted"}, {"zh": "忍辱第一——忍是最好的修行", "en": "Patience is foremost—endurance is the best practice"}, {"zh": "心若调适道可得矣", "en": "If the mind is properly adjusted, the Way can be attained"}, {"zh": "人命在几间——呼吸之间", "en": "How long is a human life? Between breaths"}, {"zh": "凡所有相皆是虚妄——早期般若思想", "en": "All appearances are illusory—early Prajna thought"}], "hx051": [{"zh": "世间无常——一切都在变化", "en": "The world is impermanent—everything changes"}, {"zh": "多欲为苦——欲望是痛苦的根源", "en": "Excessive desire brings suffering—desire is the root of suffering"}, {"zh": "心无厌足——人心的贪求永无止境", "en": "The mind is never satisfied—human greed is endless"}, {"zh": "懈怠堕落——懒惰导致退步", "en": "Laziness leads to decline—sloth causes regression"}, {"zh": "愚痴生死——无明是轮回之因", "en": "Ignorance causes birth and death—delusion is the cause of samsara"}, {"zh": "贫苦多怨——贫穷容易产生怨恨", "en": "Poverty breeds resentment—the poor easily complain"}, {"zh": "五欲过患——感官享乐的危害", "en": "The dangers of five desires—the harm of sensual pleasure"}, {"zh": "生死炽然——生死如火燃烧", "en": "Birth and death burn fiercely—the cycle of samsara blazes"}, {"zh": "发大乘心普济一切", "en": "Arousing the Mahayana mind to universally save all beings"}, {"zh": "八大人觉是菩萨修行纲领", "en": "The eight realizations are the bodhisattva's practice framework"}], "hx052": [{"zh": "父母恩重如山——孝道是根本", "en": "Parents' kindness is heavy as a mountain—filial piety is fundamental"}, {"zh": "怀胎十月守护之恩", "en": "The grace of protecting the fetus for ten months"}, {"zh": "临产受苦之恩", "en": "The grace of suffering through childbirth"}, {"zh": "咽苦吐甘之恩", "en": "The grace of swallowing the bitter and giving the sweet"}, {"zh": "回干就湿之恩——母亲让孩子睡干处自己睡湿处", "en": "The grace of sleeping in the wet so the child can sleep dry"}, {"zh": "哺乳养育之恩", "en": "The grace of nursing and raising"}, {"zh": "洗濯不净之恩", "en": "The grace of washing the unclean"}, {"zh": "远行忆念之恩——父母时刻挂念远行的子女", "en": "The grace of constant longing when children travel far"}, {"zh": "究竟怜愍之恩——无条件的爱", "en": "The grace of ultimate compassion—unconditional love"}, {"zh": "不孝父母罪同出佛身血", "en": "Being unfilial is as sinful as shedding the Buddha's blood"}], "hx053": [{"zh": "药师佛十二大愿——救度众生疾苦", "en": "Medicine Buddha's twelve great vows—relieving beings' suffering"}, {"zh": "消灾延寿——药师佛的现世利益", "en": "Dispersing disasters and extending life—Medicine Buddha's worldly benefits"}, {"zh": "琉璃世界——东方净土的庄严", "en": "The Lapis Lazuli world—the splendor of the Eastern Pure Land"}, {"zh": "日光月光二菩萨——药师佛的两大助手", "en": "Sunlight and Moonlight bodhisattvas—Medicine Buddha's two chief assistants"}, {"zh": "持戒修行是消灾的根本", "en": "Keeping precepts and practicing is the root of dispelling disasters"}, {"zh": "供养药师佛可消病延寿", "en": "Making offerings to Medicine Buddha can cure illness and extend life"}, {"zh": "药师佛誓愿救一切病苦众生", "en": "Medicine Buddha vows to save all beings from illness and suffering"}, {"zh": "十二药叉大将——护持修药师法者", "en": "Twelve yaksha generals—protecting practitioners of the Medicine Buddha dharma"}, {"zh": "现身受乐后生善趣——现世与来世双益", "en": "Enjoying happiness now and born in good realms later—benefits in both this life and next"}, {"zh": "修药师法不离世间觉", "en": "Practicing the Medicine Buddha dharma without leaving worldly awakening"}], "hx054": [{"zh": "礼敬诸佛——对一切佛的恭敬心", "en": "Revering all Buddhas—respect for all awakened beings"}, {"zh": "称赞如来——赞叹佛的功德", "en": "Praising the Tathagata—extolling the Buddha's merits"}, {"zh": "广修供养——以物质和精神供养", "en": "Extensive offerings—material and spiritual giving"}, {"zh": "忏悔业障——反省并消除业障", "en": "Confessing karmic obstacles—reflecting on and eliminating karma"}, {"zh": "随喜功德——为他人的善行欢喜", "en": "Rejoicing in merit—being glad for others' good deeds"}, {"zh": "请转法轮——请佛说法利益众生", "en": "Requesting the turning of the Dharma wheel—asking the Buddha to teach"}, {"zh": "请佛住世——请佛长久住世度生", "en": "Requesting the Buddha to remain—asking the Buddha to stay in the world"}, {"zh": "常随佛学——持续向佛学习", "en": "Constantly following the Buddha's teaching—continuous learning"}, {"zh": "恒 ipline"}, {"zh": "信交朋友惠普乡邻——诚信待人", "en": "Make friends with trust; benefit neighbors with kindness"}], "hx057": [{"zh": "静以修身——宁静是修养的基础", "en": "Quietness cultivates the self—stillness is the foundation of cultivation"}, {"zh": "俭以养德——节俭培养品德", "en": "Frugality nurtures virtue—thrift builds character"}, {"zh": "非淡泊无以明志——淡泊才能明志", "en": "Without detachment, one cannot clarify aspirations"}, {"zh": "非宁静无以致远——宁静才能致远", "en": "Without stillness, one cannot reach far"}, {"zh": "夫学须静也——学习需要安静的心", "en": "Study requires a quiet mind"}, {"zh": "才须学也——才华来自学习", "en": "Talent comes from learning"}, {"zh": "非学无以广才——不学无法扩展才能", "en": "Without learning, one cannot expand talent"}, {"zh": "非志无以成学——没有志向无法完成学业", "en": "Without aspiration, one cannot complete learning"}, {"zh": "淫慢则不能励精——放纵懈怠无法精进", "en": "Self-indulgence and laziness prevent excellence"}, {"zh": "险躁则不能治性——急躁不能修养心性", "en": "Rashness and impatience prevent character cultivation"}], "hx058": [{"zh": "勤——勤勉是立身第一要义", "en": "Diligence—the foremost principle of life"}, {"zh": "俭——节俭是持家根本", "en": "Frugality—the root of managing a household"}, {"zh": "刚——刚毅不屈是品格", "en": "Firmness—unbending strength of character"}, {"zh": "明——明事理是智慧", "en": "Clarity—understanding principles is wisdom"}, {"zh": "忠——忠信是做人根本", "en": "Loyalty—faithfulness is the foundation of being human"}, {"zh": "恕——恕道是待人之本", "en": "Forgiveness—the Way of empathy in treating others"}, {"zh": "谦——谦虚是保身之道", "en": "Humility—the way to protect oneself"}, {"zh": "浑——浑厚是处世智慧", "en": "Wholeness—comprehensive wisdom in life"}, {"zh": "读书可以变化气质", "en": "Reading can transform one's temperament"}, {"zh": "家俭则兴人勤则健——勤俭兴家", "en": "A frugal family prospers; a diligent person is healthy"}], "hx059": [{"zh": "后世子孙仕宦有犯赃滥者不得放归本家", "en": "Any descendant serving as official who commits corruption shall not return to the family"}, {"zh": "亡殁之后不得葬于大茔之中——死后不入祖坟", "en": "After death, shall not be buried in the family tomb"}, {"zh": "以廉洁为家训核心——清官精神传承", "en": "Integrity as the family's core value—the legacy of the incorruptible official"}, {"zh": "不从吾志非吾子孙——不守家训不算后人", "en": "Those who do not follow my will are not my descendants"}, {"zh": "为官当以公正为本", "en": "Officials must be based on justice"}, {"zh": "清廉是最好的遗产", "en": "Integrity is the best inheritance"}, {"zh": "家训刻石警示后人", "en": "Family instructions carved in stone to warn descendants"}, {"zh": "不以权谋私是底线", "en": "Not using power for personal gain is the baseline"}, {"zh": "包公精神：铁面无私执法如山", "en": "Bao Zheng's spirit: impartial and unyielding, enforcing law like a mountain"}, {"zh": "廉洁传家比财富传家更持久", "en": "Passing on integrity lasts longer than passing on wealth"}], "hx060": [{"zh": "后生才锐者最易坏——有才华的年轻人最容易堕落", "en": "Talented youth are most easily corrupted"}, {"zh": "天下之事常成于困约而败于奢靡", "en": "Affairs of the world succeed through hardship and fail through extravagance"}, {"zh": "勤学——读书是第一等事", "en": "Diligent study—reading is the foremost pursuit"}, {"zh": "节俭——俭以养德", "en": "Frugality—thrift nurtures virtue"}, {"zh": "爱国——位卑未敢忘忧国", "en": "Patriotism—not forgetting the nation even in humble position"}, {"zh": "忧民——心系百姓疾苦", "en": "Concern for the people—caring about the common people's suffering"}, {"zh": "严于律己宽以待人", "en": "Strict with oneself, generous with others"}, {"zh": "不做空头文章——务实精神", "en": "Do not write empty words—the spirit of practicality"}, {"zh": "后人毋以富贵骄人", "en": "Descendants should not be arrogant because of wealth and position"}, {"zh": "遗金于子孙子孙未必能守——不如遗德", "en": "Leaving gold to descendants, they may not keep it—better to leave virtue"}], "hx061": [{"zh": "有德者皆由俭来也——俭是德之本", "en": "Those with virtue all come from frugality—thrift is the root of virtue"}, {"zh": "俭则寡欲——节俭则欲望减少", "en": "Frugality leads to few desires"}, {"zh": "遗金于子孙子孙未必能守", "en": "Leaving gold to descendants, they may not be able to keep it"}, {"zh": "遗书于子孙子孙未必能读", "en": "Leaving books to descendants, they may not be able to read them"}, {"zh": "不如积阴德于冥冥之中", "en": "Better to accumulate hidden virtue in the unseen realm"}, {"zh": "以德传家是最佳传承", "en": "Passing on virtue is the best legacy"}, {"zh": "由俭入奢易由奢入俭难", "en": "Going from frugal to luxurious is easy; from luxurious to frugal is hard"}, {"zh": "君子以俭德辟难", "en": "The noble person uses frugal virtue to avoid difficulties"}, {"zh": "德胜才谓之君子才胜德谓之小人", "en": "When virtue exceeds talent, one is a noble person; when talent exceeds virtue, one is petty"}, {"zh": "治家以勤俭为本以和睦为贵", "en": "Managing a household: diligence and frugality as the base, harmony as the treasure"}], "hx062": [{"zh": "难得糊涂——大智若愚的智慧", "en": "Rare is foolishness—the wisdom of appearing foolish while being wise"}, {"zh": "吃亏是福——以退为进的处世哲学", "en": "Taking a loss is a fortune—the philosophy of yielding to advance"}, {"zh": "爱民如子——为官当以民为本", "en": "Love the people as your children—officials must be people-centered"}, {"zh": "读书明理——读书是为了明事理", "en": "Study to understand—reading is for understanding principles"}, {"zh": "助人为乐——帮助他人是快乐", "en": "Helping others is joy—assisting people brings happiness"}, {"zh": "以平等心待人——不分贵贱", "en": "Treat people equally—without distinction of high and low"}, {"zh": "不趋炎附势——保持独立人格", "en": "Do not curry favor with the powerful—maintain independent character"}, {"zh": "诗书画三绝——艺术修身", "en": "Poetry, calligraphy, and painting—cultivating through art"}, {"zh": "一枝一叶总关情——关怀百姓", "en": "Every branch and leaf shows concern—care for the common people"}, {"zh": "立身端正不随俗流", "en": "Stand upright; do not follow the crowd"}], "hx063": [{"zh": "勤读书——读书是第一要务", "en": "Study diligently—reading is the first priority"}, {"zh": "要孝弟——孝悌是做人之本", "en": "Be filial and fraternal—these are the foundations of being human"}, {"zh": "学谦恭——谦虚恭敬是美德", "en": "Learn humility—modesty and respect are virtues"}, {"zh": "循礼仪——以礼待人", "en": "Follow propriety—treat others with ritual propriety"}, {"zh": "节饮食——饮食有节制", "en": "Moderate diet—eat with restraint"}, {"zh": "戒游戏——不沉迷于游乐", "en": "Avoid idle play—do not indulge in games"}, {"zh": "毋说谎——诚实是根本", "en": "Do not lie—honesty is fundamental"}, {"zh": "毋 , "en": "Conducting oneself—with humility and harmony"}, {"zh": "做人——以诚实做人", "en": "Being a person—be honest"}, {"zh": "朴实是真传家宝", "en": "Simplicity is the true family treasure"}, {"zh": "不与人争只与己争", "en": "Do not compete with others; compete only with yourself"}, {"zh": "遗德于子孙胜过遗财", "en": "Leaving virtue to descendants surpasses leaving wealth"}], "hx071": [{"zh": "天地之大德曰生——尊重生命是最大的德", "en": "The greatest virtue of Heaven and Earth is life—respecting life is the greatest virtue"}, {"zh": "戒杀放生——不杀生是第一善行", "en": "Abstaining from killing and releasing lives—not killing is the foremost good deed"}, {"zh": "一切众生皆有佛性——不可杀害", "en": "All beings have Buddha-nature—they must not be killed"}, {"zh": "杀生招致疾病短命——因果报应", "en": "Killing leads to illness and short life—karmic retribution"}, {"zh": "放生增福延寿——善有善报", "en": "Releasing lives increases blessings and extends life—good brings good"}, {"zh": "慈悲心是戒杀的根本动力", "en": "Compassion is the fundamental motivation for not killing"}, {"zh": "食素是戒杀的实践方式", "en": "Vegetarianism is the practical way to abstain from killing"}, {"zh": "护生即护心——保护生命就是保护善心", "en": "Protecting life is protecting the heart—guarding beings is guarding goodness"}, {"zh": "万物同体——众生本为一体", "en": "All things are one body—all beings are fundamentally one"}, {"zh": "戒杀功德不可思量", "en": "The merit of abstaining from killing is inconceivable"}], "hx072": [{"zh": "万恶淫为首——邪淫是最大的恶", "en": "Of all evils, lust is foremost—sexual misconduct is the greatest evil"}, {"zh": "淫欲伤身损德败家亡国", "en": "Lust damages health, destroys virtue, ruins families, and topples nations"}, {"zh": "节欲保身是健康长寿的关键", "en": "Restraint in desire is key to health and longevity"}, {"zh": "不净观可对治淫欲", "en": "Contemplation of impurity counteracts lust"}, {"zh": "邪淫的因果报应最为惨烈", "en": "Karmic retribution for sexual misconduct is the most devastating"}, {"zh": "贞节是品德的重要组成", "en": "Chastity is an important component of character"}, {"zh": "夫妇之道以敬以节", "en": "The way of husband and wife: respect and moderation"}, {"zh": "远色不 ouse compassion"}, {"zh": "戒杀放生消除业障", "en": "Abstaining from killing and releasing lives eliminate karmic obstacles"}], "hx075": [{"zh": "功过格——量化善恶以自省", "en": "The merit ledger—quantifying good and evil for self-reflection"}, {"zh": "日日记录善恶功过", "en": "Daily recording good and evil merit and demerit"}, {"zh": "一月不知非便一月安于自是", "en": "A month without knowing one's faults is a month of complacency"}, {"zh": "善有大小真假——需辨别", "en": "Good has great/small and true/false—must be distinguished"}, {"zh": "功过相抵——修行是持续累积", "en": "Merit offsets demerit—practice is continuous accumulation"}, {"zh": "救人一命五十功", "en": "Saving a life: 50 merit points"}, {"zh": "杀生一命五十过", "en": "Killing a life: 50 demerit points"}, {"zh": "知非才能改非——自省是修行基础", "en": "Knowing faults enables correcting them—self-reflection is the foundation of practice"}, {"zh": "功过格是修身实用工具", "en": "The merit ledger is a practical tool for self-cultivation"}, {"zh": "持续记录才能持续进步", "en": "Continuous recording enables continuous progress"}], "hx076": [{"zh": "善恶行为可量化为功过分数", "en": "Good and evil deeds can be quantified into merit and demerit points"}, {"zh": "日日记录月月核算", "en": "Record daily, tally monthly"}, {"zh": "功过格是明清善书文化的核心工具", "en": "The merit ledger is the core tool of Ming-Qing moral book culture"}, {"zh": "善行有具体分数标准", "en": "Good deeds have specific point standards"}, {"zh": "恶行也有具体扣分标准", "en": "Evil deeds also have specific deduction standards"}, {"zh": "自省是功过格的根本目的", "en": "Self-reflection is the fundamental purpose of the merit ledger"}, {"zh": "功过格使道德修行可操作化", "en": "The merit ledger makes moral cultivation actionable"}, {"zh": "持续记录才能看到进步", "en": "Only continuous recording reveals progress"}, {"zh": "功过相抵不是目的——净善才是目标", "en": "Offsetting merit and demerit is not the goal—net goodness is the target"}, {"zh": "功过格是知行合一的实践工具", "en": "The merit ledger is a practical tool for unity of knowledge and action"}], "hx077": [{"zh": "百行孝为先——孝道是一切善行的根本", "en": "Of all virtues, filial piety is first—it is the root of all good deeds"}, {"zh": "孝扩展至天地之孝——大孝", "en": "Filial piety extends to Heaven and Earth—great filial piety"}, {"zh": "不孝父母敬天无益", "en": "Being unfilial to parents makes revering Heaven meaningless"}, {"zh": "孝能感动天地", "en": "Filial piety can move Heaven and Earth"}, {"zh": "守身——爱护身体是对父母的孝", "en": "Guarding the body—caring for oneself is filial to parents"}, {"zh": "体亲——理解父母的心意", "en": "Understanding parents—comprehending their intentions"}, {"zh": "育子——教育好子女也是孝", "en": "Raising children—educating them well is also filial piety"}, {"zh": "辩孝——辨别什么是真孝", "en": "Defining filial piety—distinguishing true filial piety"}, {"zh": "孝是道教修行的根本", "en": "Filial piety is the foundation of Daoist practice"}, {"zh": "孝道通天——孝行可与天通", "en": "Filial piety reaches Heaven—filial conduct connects with the divine"}], "hx078": [{"zh": "百行孝为先——孝道是所有美德之首", "en": "Of all virtues, filial piety is first"}, {"zh": "不孝之罪天地不容", "en": "The sin of unfilial conduct is not tolerated by Heaven and Earth"}, {"zh": "孝行必获福报", "en": "Filial conduct surely brings blessings"}, {"zh": "以因果报应警示不孝", "en": "Using karmic retribution to warn against unfilial behavior"}, {"zh": "孝是做人的根本", "en": "Filial piety is the foundation of being human"}, {"zh": "事亲当竭力——尽心尽力侍奉父母", "en": "Serve parents with all your might"}, {"zh": "不孝招致天地惩罚", "en": "Unfilial conduct invites punishment from Heaven and Earth"}, {"zh": "孝感动天——孝行可感动天地", "en": "Filial piety moves Heaven—filial conduct can touch the divine"}, {"zh": "以真武大帝之威劝人行孝", "en": "Using Lord Zhenwu's authority to urge filial piety"}, {"zh": "孝是修行第一事", "en": "Filial piety is the first matter of cultivation"}], "hx079": [{"zh": "万恶淫为首——邪淫是万恶之源", "en": "Of all evils, lust is foremost—sexual misconduct is the source of all evil"}, {"zh": "以关帝忠义之威警示戒淫", "en": "Using Lord Guan's righteous authority to warn against lust"}, {"zh": "邪淫败德亡身家破人亡", "en": "Sexual misconduct destroys virtue, ruins the body, and breaks families"}, {"zh": "历史实例证明淫报不虚", "en": "Historical cases prove retribution for lust is no  from doing good"}, {"zh": "人有一善不可不自知", "en": "One should know one's own good qualities"}, {"zh": "人有一恶不可不自觉", "en": "One should be aware of one's own faults"}, {"zh": "修身以正心诚意为根本", "en": "Self-cultivation is rooted in a rectified mind and sincere intention"}], "hx082": [{"zh": "近朱者赤近墨者黑——环境影响人", "en": "Near vermilion, one becomes red; near ink, one becomes black—environment shapes people"}, {"zh": "善有善报恶有恶报——因果报应", "en": "Good is rewarded with good; evil with evil—karmic retribution"}, {"zh": "一年之计在于春一日之计在于晨——珍惜时光", "en": "The year's plan starts in spring; the day's plan starts in the morning—cherish time"}, {"zh": "人无远虑必有近忧——要有长远眼光", "en": "Without long-term plans, one will have near worries—think ahead"}, {"zh": "路遥知马力日久见人心——时间检验一切", "en": "A long road tests a horse's strength; time reveals a person's heart—time tests all"}, {"zh": "少壮不努力老大徒伤悲——年轻时当努力", "en": "If you don't work hard in youth, you will regret it in old age"}, {"zh": "人贫志短马瘦毛长——困境中保持志气", "en": "When poor, people lose ambition—maintain your aspirations in adversity"}, {"zh": "善言一句三冬暖恶语伤人六月寒——言语有力量", "en": "A kind word warms three winter months; a harsh word chills in June—words have power"}, {"zh": "忍一时风平浪静退一步海阔天空", "en": "Endure a moment and the storm calms; step back and the sky opens wide"}, {"zh": "害人之心不可有防人之心不可无", "en": "Do not harbor intent to harm; but do not lack caution against harm"}], "hx083": [{"zh": "继善——持续行善是人生根本", "en": "Continuing good—persistently doing good is life's foundation"}, {"zh": "天理——顺应天道是智慧", "en": "Heavenly principles—following the Way of Heaven is wisdom"}, {"zh": "顺命——接受命运但努力改善", "en": "Accepting fate—accept destiny but strive to improve"}, {"zh": "孝行——孝道是所有善行之本", "en": "Filial conduct—filial piety is the root of all good deeds"}, {"zh": "正心——心正是修身之本", "en": "Rectifying the mind—a right mind is the foundation of self-cultivation"}, {"zh": "安分——安守本分是处世之道", "en": "Knowing one's place—staying in one's proper role is the way of life"}, {"zh": "存信——诚信是立身之本", "en": "Preserving trust—honesty is the foundation of life"}, {"zh": "言语——谨慎言语是修养", "en": "Speech—careful speech is cultivation"}, {"zh": "交友——择善友是关键", "en": "Friendship—choosing good friends is key"}, {"zh": "勤学——终身学习是进步之道", "en": "Diligent study—lifelong learning is the path to progress"}], "hx084": [{"zh": "一切言动都要安详——言行要沉稳", "en": "In all words and actions, be calm and composed"}, {"zh": "十差九错只为慌张——慌张是错误的根源", "en": "Nine out of ten mistakes come from rushing—panic is the root of error"}, {"zh": "以儿童能懂的语言传授道理", "en": "Teaching principles in language children can understand"}, {"zh": "从小培养良好习惯", "en": "Cultivating good habits from childhood"}, {"zh": "诚实守信是基本品格", "en": "Honesty and trustworthiness are fundamental character"}, {"zh": "不说不该说的话", "en": "Do not say what should not be said"}, {"zh": "不做不该做的事", "en": "Do not do what should not be done"}, {"zh": "尊老爱幼是基本礼貌", "en": "Respecting the elderly and cherishing the young are basic manners"}, {"zh": "勤俭节约是美德", "en": "Diligence and frugality are virtues"}, {"zh": "谦虚谨慎是处世之道", "en": "Humility and carefulness are the way of life"}], "hx085": [{"zh": "要好人须寻好友——交友影响品格", "en": "To be a good person, seek good friends—friendship shapes character"}, {"zh": "闭邪存诚——防止邪念保持真诚", "en": "Guard against evil and preserve sincerity"}, {"zh": "勿慎勿欺——不疏忽不欺骗", "en": "Do not be careless; do not deceive"}, {"zh": "以更深刻内容继续教化儿童", "en": "Continuing to educate children with deeper content"}, {"zh": "做人要诚实做事要认真", "en": "Be honest as a person; be earnest in work"}, {"zh": "少年养正是教育关键期", "en": "Childhood is the critical period for moral education"}, {"zh": "勤奋学习是本分", "en": "Diligent study is one's duty"}, {"zh": "不以善小而不为", "en": "Do not fail to do good because it seems small"}, {"zh": "不以恶小而为之", "en": "Do not do evil because it seems minor"}, {"zh": "知错能改就是进步", "en": "Recognizing and correcting mistakes is progress"}], "hx086": [{"zh": "女诫——班昭论述女子修身之道", "en": "Precepts for Women—Ban Zhao's teachings on women's self-cultivation"}, {"zh": "内训——徐皇后的宫廷女子教育", "en": "Inner Training—Empress Xu's education for court women"}, {"zh": "女论语——以对话体论述女德", "en": "Analects for Women—dialogue on female virtue"}, {"zh": "女子修身以贞顺为本", "en": "Women's self-cultivation is based on chastity and obedience"}, {"zh": "相夫教子是女子重要职责", "en": "Supporting the husband and educating children are important duties"}, {"zh": "女子以柔顺为德", "en": "Women's virtue lies in gentleness and compliance"}, {"zh": "妇德妇言妇容妇功——四德", "en": "Women's virtue, speech, appearance, and work—the four virtues"}, {"zh": "女子教育注重品德培养", "en": "Women's education focuses on character cultivation"}, {"zh": "男女虽有别但教育同等重要", "en": "Though men and women differ, education is equally important for both"}, {"zh": "贤妻良母是传统女子理想", "en": "The virtuous wife and good mother is the traditional female ideal"}], "hx087": [{"zh": "模仿孝经体例论述女子孝道", "en": "Modeled on the Classic of Filial Piety for women"}, {"zh": "后妃之孝——以德化天下", "en": "Empress's filial piety—transforming the world through virtue"}, {"zh": "庶人之孝——尽本分即为孝", "en": "Commoner's filial piety—fulfilling duties is filial"}, {"zh": "女子孝道是女性教育核心", "en": "Women's filial piety is the core of female education"}, {"zh": "孝道不分男女", "en": "Filial piety does not distinguish between men and women"}, {"zh": "女子以孝为本以顺为德", "en": "Women base themselves on filial piety and value compliance"}, {"zh": "事舅姑如事父母", "en": "Serve parents-in-law as one's own parents"}, {"zh": "女子孝行可化家化国", "en": "Women's filial conduct can transform family and nation"}, {"zh": "孝是女子品德的第一要义", "en": "Filial piety is the first principle of women's character"}, {"zh": "女子行孝当尽心竭力", "en": "Women should practice filial piety with all their heart"}], "hx088": [{"zh": "心不负人面无惭色——内心无愧则坦然", "en": "If the heart doesn't betray others, the face shows no shame"}, {"zh": "做事不可不存长远心", "en": "In all actions, maintain long-term vision"}, {"zh": "省心——反省内心是修行关键", "en": "Self-reflection—examining the mind is key to cultivation"}, {"zh": "不欺暗室——独处时也不做亏心事", "en": "Do not deceive even in a dark room—do no wrong even when
