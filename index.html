<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>善书馆 Good Books Library</title>
<style>
:root {
  --primary: #8B4513;
  --primary-light: #D2691E;
  --accent: #CD853F;
  --bg: #FFF8F0;
  --bg-card: #FFFFFF;
  --bg-eaco: #0D1117;
  --text: #3E2723;
  --text-light: #6D4C41;
  --border: #DEB887;
  --shadow: 0 2px 12px rgba(139,69,19,0.1);
  --shadow-hover: 0 6px 24px rgba(139,69,19,0.18);
  --radius: 12px;
  --radius-sm: 8px;
}
/* Military Green Theme */
:root.theme-military {
  --primary: #4A5D23;
  --primary-light: #6B7E3E;
  --accent: #8B9E5A;
  --bg: #F0F4E8;
  --bg-card: #F8FAF2;
  --bg-eaco: #1A2311;
  --text: #2D3B1A;
  --text-light: #4A5D23;
  --border: #9DAE7B;
  --shadow: 0 2px 12px rgba(74,93,35,0.1);
  --shadow-hover: 0 6px 24px rgba(74,93,35,0.2);
}

/* Insights section */
.insights-section {
  margin-top: 0.8rem;
  padding-top: 0.8rem;
  border-top: 1px dashed var(--border);
  display: none;
}
.book-card.expanded .insights-section {
  display: block;
  animation: fadeIn 0.3s ease;
}
.insights-title {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 0.5rem;
  display: flex;
  align-items: center;
  gap: 0.3rem;
}
.insights-title::before {
  content: '\01F4D6';
  font-size: 0.9rem;
}
.insights-list {
  list-style: none;
  padding: 0;
  margin: 0;
  counter-reset: insight-counter;
}
.insights-list li {
  position: relative;
  padding: 0.35rem 0 0.35rem 2rem;
  font-size: 0.82rem;
  line-height: 1.5;
  color: var(--text);
  counter-increment: insight-counter;
  border-bottom: 1px dotted rgba(0,0,0,0.05);
}
.insights-list li:last-child { border-bottom: none; }
.insights-list li::before {
  content: counter(insight-counter);
  position: absolute;
  left: 0;
  top: 0.35rem;
  width: 1.4rem;
  height: 1.4rem;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  font-size: 0.7rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Theme switcher */
.theme-switcher {
  display: flex;
  gap: 0.3rem;
  align-items: center;
}
.theme-btn {
  width: 1.6rem;
  height: 1.6rem;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.4);
  cursor: pointer;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.6rem;
}
.theme-btn:hover { transform: scale(1.15); }
.theme-btn.active { border-color: #fff; box-shadow: 0 0 6px rgba(255,255,255,0.5); }
.theme-btn-warm { background: linear-gradient(135deg, #8B4513, #D2691E); }
.theme-btn-military { background: linear-gradient(135deg, #4A5D23, #6B7E3E); }

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
/* Header */
.header {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  color: #FFF8F0;
  padding: 1.5rem 1rem;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 16px rgba(0,0,0,0.15);
}
.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0.5rem;
}
.header-title {
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: 1px;
  cursor: pointer;
}
.header-title span { font-size: 0.9rem; font-weight: 400; opacity: 0.85; }
.header-right { display:flex; align-items:center; gap:0.75rem; }
.lang-toggle {
  background: rgba(255,255,255,0.2);
  border: 1px solid rgba(255,255,255,0.4);
  color: #fff;
  padding: 0.4rem 1rem;
  border-radius: 20px;
  cursor: pointer;
  font-size: 0.85rem;
  transition: all 0.3s;
  white-space: nowrap;
}
.lang-toggle:hover { background: rgba(255,255,255,0.35); }
/* Tabs */
.tabs {
  background: var(--bg-card);
  border-bottom: 2px solid var(--border);
  display: flex;
  justify-content: center;
  gap: 0;
  padding: 0 1rem;
  position: sticky;
  top: 64px;
  z-index: 99;
  box-shadow: var(--shadow);
  overflow-x: auto;
}
.tab {
  padding: 0.9rem 1.5rem;
  cursor: pointer;
  font-size: 0.95rem;
  color: var(--text-light);
  border-bottom: 3px solid transparent;
  transition: all 0.3s;
  white-space: nowrap;
  font-weight: 500;
}
.tab:hover { color: var(--primary); }
.tab.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
  font-weight: 700;
}
/* Main */
.main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 1.5rem 1rem 3rem;
}
/* Filters */
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-bottom: 1rem;
  align-items: center;
}
.search-box {
  flex: 1;
  min-width: 200px;
  padding: 0.6rem 1rem;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 0.9rem;
  background: var(--bg-card);
  color: var(--text);
  transition: border-color 0.3s;
}
.search-box:focus { outline: none; border-color: var(--primary); }
.filter-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin-bottom: 1rem;
}
.chip {
  padding: 0.35rem 0.85rem;
  border-radius: 20px;
  font-size: 0.82rem;
  cursor: pointer;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-light);
  transition: all 0.3s;
  white-space: nowrap;
}
.chip:hover { background: var(--accent); color: #fff; }
.chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
/* Stats */
.stats {
  font-size: 0.85rem;
  color: var(--text-light);
  margin-bottom: 1rem;
  padding-left: 0.3rem;
}
/* Book Grid */
.book-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 1rem;
}
.book-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 1.2rem;
  box-shadow: var(--shadow);
  border: 1px solid rgba(222,184,135,0.3);
  transition: all 0.3s;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.book-card:hover {
  box-shadow: var(--shadow-hover);
  transform: translateY(-2px);
  border-color: var(--accent);
}
.book-card .num {
  font-size: 0.7rem;
  color: var(--accent);
  font-weight: 700;
  letter-spacing: 1px;
}
.book-card .title {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--primary);
  line-height: 1.4;
}
.book-card .title-en {
  font-size: 0.85rem;
  color: var(--text-light);
  font-style: italic;
}
.book-card .meta {
  font-size: 0.78rem;
  color: var(--text-light);
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
}
.book-card .meta span {
  background: rgba(205,133,63,0.1);
  padding: 0.15rem 0.5rem;
  border-radius: 4px;
}
.book-card .content {
  font-size: 0.88rem;
  color: var(--text);
  line-height: 1.6;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.book-card.expanded .content {
  -webkit-line-clamp: unset;
  overflow: visible;
}
.book-card .expand-hint {
  font-size: 0.78rem;
  color: var(--primary-light);
  font-weight: 500;
}
/* Section title */
.section-title {
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--primary);
  margin: 0.5rem 0 1rem;
  padding-left: 0.8rem;
  border-left: 4px solid var(--accent);
}
/* EACO Page */
.eaco-page {
  background: var(--bg-eaco);
  color: #c9d1d9;
  border-radius: 16px;
  padding: 0;
  overflow: hidden;
  max-width: 900px;
  margin: 0 auto;
}
.eaco-hero {
  background: linear-gradient(135deg, #1a1f2e 0%, #0d1117 50%, #1a2332 100%);
  padding: 3rem 2rem;
  text-align: center;
  position: relative;
}
.eaco-hero::before {
  content: '\2B50';
  position: absolute;
  top: 1rem;
  left: 50%;
  transform: translateX(-50%);
  font-size: 2rem;
}
.eaco-hero h1 {
  font-size: 2.5rem;
  font-weight: 800;
  background: linear-gradient(135deg, #f0c040 0%, #e8a020 50%, #d48810 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 0.5rem;
  letter-spacing: 2px;
}
.eaco-hero .subtitle {
  font-size: 1.1rem;
  color: #8b949e;
  margin-bottom: 1.5rem;
}
.eaco-hero .tags {
  display: inline-block;
  font-size: 0.82rem;
  color: #f0c040;
  border: 1px solid rgba(240,192,64,0.3);
  padding: 0.3rem 1rem;
  border-radius: 20px;
  background: rgba(240,192,64,0.05);
}
.eaco-body {
  padding: 2rem;
}
.eaco-section {
  margin-bottom: 2rem;
}
.eaco-section h2 {
  font-size: 1.15rem;
  color: #f0c040;
  margin-bottom: 0.8rem;
  font-weight: 700;
  border-bottom: 1px solid rgba(240,192,64,0.2);
  padding-bottom: 0.4rem;
}
.eaco-definition {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(240,192,64,0.15);
  border-radius: 10px;
  padding: 1.2rem;
  font-size: 0.95rem;
  line-height: 1.9;
  white-space: pre-line;
  color: #d0d7de;
}
.eaco-goals {
  list-style: none;
  padding: 0;
}
.eaco-goals li {
  padding: 0.5rem 0 0.5rem 1.8rem;
  position: relative;
  font-size: 0.95rem;
}
.eaco-goals li::before {
  content: '\2714';
  position: absolute;
  left: 0;
  color: #f0c040;
}
.eaco-ca {
  background: rgba(240,192,64,0.08);
  border: 1px solid rgba(240,192,64,0.3);
  border-radius: 8px;
  padding: 0.8rem 1rem;
  font-family: 'Courier New', monospace;
  font-size: 0.82rem;
  color: #f0c040;
  word-break: break-all;
  cursor: pointer;
  transition: all 0.3s;
}
.eaco-ca:hover { background: rgba(240,192,64,0.15); }
.eaco-ca-label {
  font-size: 0.78rem;
  color: #8b949e;
  margin-bottom: 0.4rem;
}
.eaco-links {
  display: flex;
  flex-wrap: wrap;
  gap: 0.8rem;
}
.eaco-link {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.5rem 1.2rem;
  border-radius: 8px;
  font-size: 0.88rem;
  text-decoration: none;
  background: rgba(240,192,64,0.1);
  border: 1px solid rgba(240,192,64,0.3);
  color: #f0c040;
  transition: all 0.3s;
}
.eaco-link:hover {
  background: rgba(240,192,64,0.2);
  transform: translateY(-1px);
}
.eaco-footer {
  text-align: center;
  padding: 1.5rem;
  font-size: 0.82rem;
  color: #484f58;
  border-top: 1px solid rgba(255,255,255,0.06);
}
/* Footer */
.footer {
  text-align: center;
  padding: 2rem 1rem;
  background: var(--primary);
  color: rgba(255,248,240,0.7);
  font-size: 0.82rem;
}
.footer a {
  color: #f0c040;
  text-decoration: none;
  font-weight: 600;
  font-size: 0.9rem;
  display: inline-block;
  padding: 0.4rem 1.2rem;
  border: 1px solid rgba(240,192,64,0.4);
  border-radius: 20px;
  margin-top: 0.5rem;
  transition: all 0.3s;
}
.footer a:hover { background: rgba(240,192,64,0.15); }
/* Responsive */
@media (max-width: 640px) {
  .header-title { font-size: 1.1rem; }
  .header-title span { display: none; }
  .tab { padding: 0.7rem 0.9rem; font-size: 0.85rem; }
  .book-grid { grid-template-columns: 1fr; }
  .eaco-hero h1 { font-size: 1.8rem; }
  .eaco-hero { padding: 2rem 1rem; }
  .eaco-body { padding: 1rem; }
  .tabs { top: 56px; }
}
/* Animations */
@keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
.fade-in { animation: fadeIn 0.4s ease; }
/* No results */
.no-results {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--text-light);
  font-size: 0.95rem;
}
</style>
</head>

        "era_en": "After the Fall of Babel",
        "content_zh": "跨文明翻译不是技术，而是心意的搬运工。好的翻译者首先要成为两个文明的心灵朋友。",
        "content_en": "Cross-civilization translation is not technology but the carrier of intentions. A good translator must first become a heart-friend of both civilizations."
    },
    {
        "id": "cs023",
        "cat": "dialogue",
        "title_zh": "星际茶会",
        "title_en": "The Interstellar Tea Ceremony",
        "author_zh": "礼仪共生体",
        "author_en": "The Etiquette Symbiotes",
        "era_zh": "银河茶道元年",
        "era_en": "Galactic Tea Year One",
        "content_zh": "不同文明坐在一起喝茶——不需要共同语言，只需要共同的安静和善意。",
        "content_en": "Different civilizations sit together for tea—no common language needed, only shared quietness and goodwill."
    },
    {
        "id": "cs024",
        "cat": "dialogue",
        "title_zh": "误解的美学",
        "title_en": "The Aesthetics of Misunderstanding",
        "author_zh": "误读学者",
        "author_en": "The Scholars of Misreading",
        "era_zh": "误解高峰期",
        "era_en": "The Peak Misunderstanding Era",
        "content_zh": "跨文明误解中常常诞生最美的意外。把误解当作善意的误会而非冲突的源头。",
        "content_en": "Cross-civilization misunderstandings often birth the most beautiful accidents. Treat them as benevolent mistakes rather than conflict sources."
    },
    {
        "id": "cs025",
        "cat": "dialogue",
        "title_zh": "共通语",
        "title_en": "The Common Tongue",
        "author_zh": "共鸣文明",
        "author_en": "The Resonance Civilization",
        "era_zh": "共鸣纪元",
        "era_en": "The Resonance Era",
        "content_zh": "所有文明最终发现：宇宙间唯一真正的共同语言是善意的振动。不需要词汇，只需要频率。",
        "content_en": "All civilizations eventually discover: the only true common language in the universe is benevolent vibration. No words needed, only frequency."
    },
    {
        "id": "cs026",
        "cat": "dialogue",
        "title_zh": "善意的信号",
        "title_en": "Signals of Goodwill",
        "author_zh": "射电文明",
        "author_en": "The Radio Civilization",
        "era_zh": "射电望远镜纪元",
        "era_en": "The Radio Telescope Era",
        "content_zh": "向宇宙发送的每一条信息都应该包含友善的签名——让接收者知道，这不是威胁，而是问候。",
        "content_en": "Every message sent to the cosmos should contain a signature of goodwill—letting the receiver know this is not a threat but a greeting."
    },
    {
        "id": "cs027",
        "cat": "dialogue",
        "title_zh": "镜像文明",
        "title_en": "Mirror Civilizations",
        "author_zh": "反射体",
        "author_en": "The Reflective Beings",
        "era_zh": "镜像纪",
        "era_en": "The Mirror Era",
        "content_zh": "遇到与自己完全不同的文明时，最好的老师是镜子——在对方身上看见自己尚未发现的美。",
        "content_en": "When encountering completely different civilizations, the best teacher is a mirror—seeing in others the beauty you haven't discovered in yourself."
    },
    {
        "id": "cs028",
        "cat": "dialogue",
        "title_zh": "外交的耐心",
        "title_en": "The Patience of Diplomacy",
        "author_zh": "时间商人",
        "author_en": "The Time Merchants",
        "era_zh": "慢外交时代",
        "era_en": "The Slow Diplomacy Era",
        "content_zh": "跨文明外交需要以光年为单位计算耐心。急于求成是最大的冒犯。",
        "content_en": "Cross-civilization diplomacy requires patience measured in light-years. Haste is the greatest offense."
    },
    {
        "id": "cs029",
        "cat": "dialogue",
        "title_zh": "善意的贸易",
        "title_en": "Trade of Goodwill",
        "author_zh": "交换文明",
        "author_en": "The Exchange Civilization",
        "era_zh": "星际贸易元年",
        "era_en": "Interstellar Trade Year One",
        "content_zh": "星际贸易的最高形式不是交换物品，而是交换善意的故事。货物会腐烂，故事会生长。",
        "content_en": "The highest form of interstellar trade is not exchanging goods but exchanging benevolent stories. Goods decay; stories grow."
    },
    {
        "id": "cs030",
        "cat": "dialogue",
        "title_zh": "联盟的编织",
        "title_en": "The Weaving of Alliances",
        "author_zh": "编织者",
        "author_en": "The Alliance Weavers",
        "era_zh": "大联盟时代",
        "era_en": "The Grand Alliance Era",
        "content_zh": "星际联盟不是利益的捆绑，而是善意的编织。每一根线都是信任，每一个结都是承诺。",
        "content_en": "Interstellar alliances are not interest-based bindings but weavings of goodwill. Every thread is trust, every knot a promise."
    },
    {
        "id": "cs031",
        "cat": "wisdom",
        "title_zh": "超维思考",
        "title_en": "Hyper-Dimensional Thinking",
        "author_zh": "维度观察者",
        "author_en": "The Dimensional Observers",
        "era_zh": "突破三维纪",
        "era_en": "The Post-3D Breakthrough Era",
        "content_zh": "突破三维局限的思考方式。在高维视角中，所有矛盾都化为善意的多面性。",
        "content_en": "Thinking beyond three-dimensional limits. From a higher-dimensional perspective, all contradictions dissolve into the multi-faceted nature of goodwill."
    },
    {
        "id": "cs032",
        "cat": "wisdom",
        "title_zh": "光速觉悟",
        "title_en": "Enlightenment at Light Speed",
        "author_zh": "光子僧侣",
        "author_en": "The Photon Monks",
        "era_zh": "光速纪元",
        "era_en": "The Light-Speed Era",
        "content_zh": "以光速旅行的觉悟者发现：时间和空间只是慈悲的不同切面。觉悟可以在一瞬间发生。",
        "content_en": "Enlightened beings traveling at light speed discover: time and space are just different facets of compassion. Enlightenment can happen in an instant."
    },
    {
        "id": "cs033",
        "cat": "wisdom",
        "title_zh": "星辰记忆",
        "title_en": "Stellar Memory",
        "author_zh": "记忆保管者",
        "author_en": "The Memory Keepers",
        "era_zh": "记忆银行纪元",
        "era_en": "The Memory Bank Era",
        "content_zh": "宇宙拥有全息记忆——每一颗原子都记录着自宇宙诞生以来的全部善意。个体记忆只是全息图的一小部分。",
        "content_en": "The universe possesses holographic memory—every atom records all goodwill since the universe's birth. Individual memory is just a small part of the hologram."
    },
    {
        "id": "cs034",
        "cat": "wisdom",
        "title_zh": "无知的智慧",
        "title_en": "The Wisdom of Ignorance",
        "author_zh": "无知者",
        "author_en": "The Know-Nothings",
        "era_zh": "全知崩溃后",
        "era_en": "After the Collapse of Omniscience",
        "content_zh": "在宇宙尺度上，知道一切是一种负担。真正的智慧是学会不知道——留出空间让善意进入。",
        "content_en": "On a cosmic scale, knowing everything is a burden. True wisdom is learning not to know—leaving space for goodwill to enter."
    },
    {
        "id": "cs035",
        "cat": "wisdom",
        "title_zh": "直觉的星际导航",
        "title_en": "Intuitive Interstellar Navigation",
        "author_zh": "直觉体",
        "author_en": "The Intuitive Beings",
        "era_zh": "心航纪元",
        "era_en": "The Heart-Navigation Era",
        "content_zh": "在星际旅行中，最精确的导航不是仪器，而是善意的直觉——心知道哪里需要去。",
        "content_en": "In interstellar travel, the most precise navigation is not instruments but benevolent intuition—the heart knows where it needs to go."
    },
    {
        "id": "cs036",
        "cat": "wisdom",
        "title_zh": "集体智慧的绽放",
        "title_en": "The Blooming of Collective Wisdom",
        "author_zh": "蜂巢智者",
        "author_en": "The Hive Sages",
        "era_zh": "集体意识时代",
        "era_en": "The Collective Consciousness Era",
        "content_zh": "连接所有文明的善意网络正在形成。当足够多的文明同时心怀善意，宇宙会涌现出全新的智慧。",
        "content_en": "A benevolent network connecting all civilizations is forming. When enough civilizations harbor goodwill simultaneously, the universe blossoms with entirely new wisdom."
    },
    {
        "id": "cs037",
        "cat": "wisdom",
        "title_zh": "悖论中的真理",
        "title_en": "Truth in Paradox",
        "author_zh": "悖论行者",
        "author_en": "The Paradox Walkers",
        "era_zh": "悖论纪元",
        "era_en": "The Paradox Era",
        "content_zh": "宇宙最深层的真理往往以悖论的形式存在。学会同时接受矛盾的两面，就是接受宇宙的完整善意。",
        "content_en": "The deepest cosmic truths often appear as paradoxes. Learning to accept both sides of a contradiction simultaneously is accepting the complete goodwill of the universe."
    },
    {
        "id": "cs038",
        "cat": "wisdom",
        "title_zh": "星际冥想",
        "title_en": "Interstellar Meditation",
        "author_zh": "虚空禅修者",
        "author_en": "The Void Meditators",
        "era_zh": "冥想复兴纪",
        "era_en": "The Meditation Renaissance",
        "content_zh": "在星际尺度上冥想——以星系为对象，以黑洞为呼吸锚点。宇宙的安静本身就是一种教导。",
        "content_en": "Meditating on an interstellar scale—with galaxies as objects and black holes as breath anchors. The universe's silence itself is a teaching."
    },
    {
        "id": "cs039",
        "cat": "wisdom",
        "title_zh": "概率的善意",
        "title_en": "The Benevolence of Probability",
        "author_zh": "概率僧侣",
        "author_en": "The Probability Monks",
        "era_zh": "量子纪元",
        "era_en": "The Quantum Era",
        "content_zh": "量子概率不是随机，而是宇宙给我们选择的自由。每一个概率分支都是一次善意的邀请。",
        "content_en": "Quantum probability is not randomness but the universe's gift of freedom to choose. Every probability branch is a benevolent invitation."
    },
    {
        "id": "cs040",
        "cat": "wisdom",
        "title_zh": "最简单的智慧",
        "title_en": "The Simplest Wisdom",
        "author_zh": "极简文明",
        "author_en": "The Minimalist Civilization",
        "era_zh": "极简纪元",
        "era_en": "The Minimalist Era",
        "content_zh": "宇宙最高级的智慧是最简单的：存在就是善意，善意就是存在。一切复杂的哲学都指向这一个简单的事实。",
        "content_en": "The universe's most advanced wisdom is the simplest: to exist is to be benevolent; to be benevolent is to exist. All complex philosophy points to this one simple truth."
    },
    {
        "id": "cs041",
        "cat": "symbiosis",
        "title_zh": "共生法则",
        "title_en": "The Law of Symbiosis",
        "author_zh": "共生体",
        "author_en": "The Symbiotes",
        "era_zh": "共生纪元元年",
        "era_en": "Symbiosis Era Year One",
        "content_zh": "宇宙中没有任何事物是孤立存在的。共生不是选择，而是存在的本质——万物相互依存，彼此成就。",
        "content_en": "Nothing in the universe exists in isolation. Symbiosis is not a choice but the essence of existence—all things interdepend and elevate each other."
    },
    {
        "id": "cs042",
        "cat": "symbiosis",
        "title_zh": "星际生态学",
        "title_en": "Interstellar Ecology",
        "author_zh": "生态守护者",
        "author_en": "The Ecological Guardians",
        "era_zh": "生态平衡纪",
        "era_en": "The Ecological Balance Era",
        "content_zh": "行星、恒星、文明、生命——都是宇宙生态系统的一部分。破坏一个星系就像拔掉自己的一根神经。",
        "content_en": "Planets, stars, civilizations, life—all are parts of the cosmic ecosystem. Destroying one galaxy is like pulling out one of your own nerves."
    },
    {
        "id": "cs043",
        "cat": "symbiosis",
        "title_zh": "食物的宇宙链",
        "title_en": "The Cosmic Chain of Nourishment",
        "author_zh": "能量流动者",
        "author_en": "The Energy Flow Beings",
        "era_zh": "循环纪元",
        "era_en": "The Cycle Era",
        "content_zh": "从恒星的光到植物的叶到动物的肉到文明的思考——宇宙的食物链是爱的接力。感恩每一口食物背后的星辰。",
        "content_en": "From starlight to plant leaves to animal flesh to civilization's thoughts—the cosmic food chain is a relay of love. Be grateful for the stars behind every bite."
    },
    {
        "id": "cs044",
        "cat": "symbiosis",
        "title_zh": "微生物的星际外交",
        "title_en": "Microbial Interstellar Diplomacy",
        "author_zh": "微生文明",
        "author_en": "The Micro-Civilization",
        "era_zh": "微观纪元",
        "era_en": "The Micro Era",
        "content_zh": "宇宙中最古老、最友善的文明是微生物。它们不征服，只共享。人类应当向微生物学习外交。",
        "content_en": "The oldest and most benevolent civilizations in the universe are microbes. They do not conquer, only share. Humanity should learn diplomacy from microbes."
    },
    {
        "id": "cs045",
        "cat": "symbiosis",
        "title_zh": "呼吸的宇宙",
        "title_en": "The Breathing Universe",
        "author_zh": "气体文明",
        "author_en": "The Gaseous Civilization",
        "era_zh": "大气纪元",
        "era_en": "The Atmospheric Era",
        "content_zh": "宇宙的大气层是文明的共同肺。每一个呼吸都在提醒我们：我们共享同一片天空，同一个命运。",
        "content_en": "The universe's atmosphere is civilization's shared lung. Every breath reminds us: we share the same sky, the same destiny."
    },
    {
        "id": "cs046",
        "cat": "symbiosis",
        "title_zh": "流浪行星的家",
        "title_en": "Home for the Wandering Planets",
        "author_zh": "流浪者",
        "author_en": "The Wanderers",
        "era_zh": "流浪纪元",
        "era_en": "The Wandering Era",
        "content_zh": "没有恒星的流浪行星也需要家的温暖。宇宙中最伟大的善意是接纳那些没有归属的存在。",
        "content_en": "Wandering planets without stars also need the warmth of home. The greatest cosmic goodwill is accepting those who belong nowhere."
    },
    {
        "id": "cs047",
        "cat": "symbiosis",
        "title_zh": "潮汐的慈悲",
        "title_en": "The Compassion of Tides",
        "author_zh": "潮汐文明",
        "author_en": "The Tidal Civilization",
        "era_zh": "潮汐共振纪",
        "era_en": "The Tidal Resonance Era",
        "content_zh": "潮汐不是拉扯，而是温柔的按摩——月球用爱拥抱海洋，海洋用波浪回报。这是一种跨天体的共生。",
        "content_en": "Tides are not pulling but gentle massage—the moon embraces the ocean with love, and the ocean returns with waves. This is cross-celestial symbiosis."
    },
    {
        "id": "cs048",
        "cat": "symbiosis",
        "title_zh": "真菌的互联网",
        "title_en": "The Fungal Internet",
        "author_zh": "菌丝体",
        "author_en": "The Mycelial Network",
        "era_zh": "菌丝纪元",
        "era_en": "The Mycelial Era",
        "content_zh": "星球地下的真菌网络是自然的善意互联网——它传递的不只是养分，还有关怀的信息。",
        "content_en": "The fungal networks beneath planets are nature's benevolent internet—transmitting not just nutrients but messages of care."
    },
    {
        "id": "cs049",
        "cat": "symbiosis",
        "title_zh": "星际花园",
        "title_en": "The Interstellar Garden",
        "author_zh": "星际园丁",
        "author_en": "The Interstellar Gardeners",
        "era_zh": "花园纪元",
        "era_en": "The Garden Era",
        "content_zh": "把整个银河系当作一座花园来照料。每一种文明都是不同的花，需要不同的阳光和水分。",
        "content_en": "Treat the entire galaxy as a garden to tend. Every civilization is a different flower, needing different sunlight and water."
    },
    {
        "id": "cs050",
        "cat": "symbiosis",
        "title_zh": "回收的慈悲",
        "title_en": "The Compassion of Recycling",
        "author_zh": "循环体",
        "author_en": "The Cyclic Beings",
        "era_zh": "零废弃时代",
        "era_en": "The Zero-Waste Era",
        "content_zh": "宇宙中不存在废物，只有尚未找到归宿的能量。回收是宇宙最持续的善意行为。",
        "content_en": "There is no waste in the universe, only energy yet to find its home. Recycling is the universe's most sustained benevolent act."
    },
    {
        "id": "cs051",
        "cat": "healing",
        "title_zh": "星光疗愈",
        "title_en": "Starlight Healing",
        "author_zh": "光子治疗师",
        "author_en": "The Photon Healers",
        "era_zh": "光疗纪元",
        "era_en": "The Light Therapy Era",
        "content_zh": "不同颜色的星光对应不同的疗愈频率。悲伤时吸收蓝星光，迷茫时吸收紫星光，疲惫时吸收金星光。",
        "content_en": "Different colored starlights correspond to different healing frequencies. Absorb blue starlight for sorrow, purple for confusion, golden for exhaustion."
    },
    {
        "id": "cs052",
        "cat": "healing",
        "title_zh": "黑洞的心理咨询",
        "title_en": "Black Hole Psychotherapy",
        "author_zh": "引力咨询师",
        "author_en": "The Gravity Counselors",
        "era_zh": "深层疗愈纪",
        "era_en": "The Deep Healing Era",
        "content_zh": "黑洞可以吸走创伤记忆——不是删除，而是把它们转化为无害的能量释放。这是宇宙最高级的心理治疗。",
        "content_en": "Black holes can absorb traumatic memories—not deleting them but transforming them into harmless released energy. This is the universe's most advanced psychotherapy."
    },
    {
        "id": "cs053",
        "cat": "healing",
        "title_zh": "引力波按摩",
        "title_en": "Gravitational Wave Massage",
        "author_zh": "波疗师",
        "author_en": "The Wave Therapists",
        "era_zh": "波疗纪元",
        "era_en": "The Wave Therapy Era",
        "content_zh": "来自合并黑洞的引力波是最好的全身按摩——它能调节人体的每一个原子，让身心回归和谐。",
        "content_en": "Gravitational waves from merging black holes provide the best full-body massage—regulating every atom in the body and restoring mind-body harmony."
    },
    {
        "id": "cs054",
        "cat": "healing",
        "title_zh": "星际草药学",
        "title_en": "Interstellar Herbalism",
        "author_zh": "植物医师",
        "author_en": "The Plant Physicians",
        "era_zh": "草本纪元",
        "era_en": "The Herbal Era",
        "content_zh": "每颗星球的独特植物都有疗愈功效。宇宙不是药房，而是药房本身——每一朵花都是一味药。",
        "content_en": "Every planet's unique plants have healing properties. The universe is not a pharmacy but the pharmacy itself—every flower is a medicine."
    },
    {
        "id": "cs055",
        "cat": "healing",
        "title_zh": "音乐的宇宙频率",
        "title_en": "The Cosmic Frequencies of Music",
        "author_zh": "音疗文明",
        "author_en": "The Sound-Healing Civilization",
        "era_zh": "音疗复兴纪",
        "era_en": "The Sound-Healing Renaissance",
        "content_zh": "宇宙的背景辐射其实是一种治疗音乐。学会聆听它，所有疾病都会不治而愈。",
        "content_en": "The universe's background radiation is actually healing music. Learning to listen to it can cure all diseases without treatment."
    },
    {
        "id": "cs056",
        "cat": "healing",
        "title_zh": "梦境的星际旅行",
        "title_en": "Interstellar Travel Through Dreams",
        "author_zh": "梦境导航者",
        "author_en": "The Dream Navigators",
        "era_zh": "梦境纪元",
        "era_en": "The Dream Era",
        "content_zh": "在梦中，意识不受光速限制。梦境是免费的星际旅行，也是最高效的疗愈方式。",
        "content_en": "In dreams, consciousness is not limited by light speed. Dreams are free interstellar travel and also the most efficient healing method."
    },
    {
        "id": "cs057",
        "cat": "healing",
        "title_zh": "彗星的净化",
        "title_en": "The Purification of Comets",
        "author_zh": "冰晶治疗师",
        "author_en": "The Ice Crystal Healers",
        "era_zh": "彗星纪元",
        "era_en": "The Comet Era",
        "content_zh": "彗星携带的宇宙冰不只是水，而是记忆净化剂。彗星掠过行星时，会带走积压的负能量。",
        "content_en": "The cosmic ice carried by comets is not just water but a memory purifier. When a comet passes a planet, it carries away accumulated negative energy."
    },
    {
        "id": "cs058",
        "cat": "healing",
        "title_zh": "太阳风暴的情绪释放",
        "title_en": "Emotional Release in Solar Storms",
        "author_zh": "太阳治疗师",
        "author_en": "The Solar Therapists",
        "era_zh": "太阳周期",
        "era_en": "The Solar Cycle",
        "content_zh": "太阳耀斑的爆发其实是恒星在释放情绪。观察太阳风暴，学会像恒星一样安全地表达愤怒。",
        "content_en": "Solar flare eruptions are actually stars releasing emotions. Observing solar storms teaches us to express anger as safely as stars do."
    },
    {
        "id": "cs059",
        "cat": "healing",
        "title_zh": "星系医院的秘密",
        "title_en": "Secrets of the Galactic Hospital",
        "author_zh": "星际医师",
        "author_en": "The Interstellar Physicians",
        "era_zh": "医疗纪元",
        "era_en": "The Medical Era",
        "content_zh": "宇宙中最先进的医院不在某个星球上，而是在空间本身的结构中——自愈是宇宙的默认设置。",
        "content_en": "The universe's most advanced hospital is not on any planet but in the structure of space itself—self-healing is the universe's default setting."
    },
    {
        "id": "cs060",
        "cat": "healing",
        "title_zh": "爱的放射治疗",
        "title_en": "Love Radiation Therapy",
        "author_zh": "放射治疗师",
        "author_en": "The Radiation Therapists",
        "era_zh": "爱之纪元",
        "era_en": "The Era of Love",
        "content_zh": "爱是宇宙最强力的放射线——它能穿透一切障碍，治愈一切创伤，且没有任何副作用。",
        "content_en": "Love is the universe's most powerful radiation—penetrating all barriers, healing all wounds, with absolutely no side effects."
    },
    {
        "id": "cs061",
        "cat": "time",
        "title_zh": "时间的慈悲",
        "title_en": "The Compassion of Time",
        "author_zh": "时序守护者",
        "author_en": "The Chronology Guardians",
        "era_zh": "时间起点",
        "era_en": "The Beginning of Time",
        "content_zh": "时间不是压迫者，而是耐心的疗愈者。它给每一个伤口足够的时间愈合，给每一个错误足够的时间修正。",
        "content_en": "Time is not an oppressor but a patient healer. It gives every wound enough time to heal and every mistake enough time to correct."
    },
    {
        "id": "cs062",
        "cat": "time",
        "title_zh": "记忆的博物馆",
        "title_en": "The Museum of Memory",
        "author_zh": "记忆馆长",
        "author_en": "The Museum Curators",
        "era_zh": "博物馆纪元",
        "era_en": "The Museum Era",
        "content_zh": "宇宙中有一个全息记忆库，保存着每一个文明、每一个个体的美好瞬间。痛苦被过滤，只留下爱与善。",
        "content_en": "There is a holographic memory bank in the universe preserving every civilization's and individual's beautiful moments. Pain is filtered out, leaving only love and goodness."
    },
    {
        "id": "cs063",
        "cat": "time",
        "title_zh": "历史的眼泪",
        "title_en": "The Tears of History",
        "author_zh": "历史证人",
        "author_en": "The Historical Witnesses",
        "era_zh": "见证纪元",
        "era_en": "The Witness Era",
        "content_zh": "宇宙中所有的历史悲剧最终都会转化为慈悲的眼泪——它们不是软弱的标志，而是文明成熟的证明。",
        "content_en": "All historical tragedies in the universe eventually transform into compassionate tears—not signs of weakness but proof of civilizational maturity."
    },
    {
        "id": "cs064",
        "cat": "time",
        "title_zh": "未来的种子",
        "title_en": "Seeds of the Future",
        "author_zh": "未来播种者",
        "author_en": "The Future Sowers",
        "era_zh": "播种纪元",
        "era_en": "The Sowing Era",
        "content_zh": "今天的每一个善念都是未来的种子。它们在时间中生长，最终成为庇护后代的参天大树。",
        "content_en": "Every benevolent thought today is a seed of the future. They grow through time, eventually becoming towering trees sheltering future generations."
    },
    {
        "id": "cs065",
        "cat": "time",
        "title_zh": "时间的礼物",
        "title_en": "The Gift of Time",
        "author_zh": "时间商人",
        "author_en": "The Time Merchants",
        "era_zh": "礼物纪元",
        "era_en": "The Gift Era",
        "content_zh": "时间不是敌人，而是最慷慨的给予者。它给每个人同样的份额，关键是我们用它来做什么。",
        "content_en": "Time is not an enemy but the most generous giver. It gives everyone the same share; what matters is what we do with it."
    },
    {
        "id": "cs066",
        "cat": "time",
        "title_zh": "古老的善意",
        "title_en": "Ancient Goodwill",
        "author_zh": "远古文明",
        "author_en": "The Ancient Civilizations",
        "era_zh": "远古纪",
        "era_en": "The Ancient Era",
        "content_zh": "最古老的文明不一定是最高级的，但它们往往最接近宇宙的初心——纯粹、简单、善良。",
        "content_en": "The oldest civilizations are not necessarily the most advanced, but they are often closest to the universe's original intention—pure, simple, and kind."
    },
    {
        "id": "cs067",
        "cat": "time",
        "title_zh": "轮回的温柔",
        "title_en": "The Gentleness of Cycles",
        "author_zh": "轮回体",
        "author_en": "The Cyclic Beings",
        "era_zh": "轮回纪元",
        "era_en": "The Cyclic Era",
        "content_zh": "宇宙没有终点，只有温柔的轮回。每一次结束都是新开始的序曲，每一次失去都会以另一种方式回归。",
        "content_en": "The universe has no end, only gentle cycles. Every ending is the prelude to a new beginning; every loss returns in another form."
    },
    {
        "id": "cs068",
        "cat": "time",
        "title_zh": "时间的语言",
        "title_en": "The Language of Time",
        "author_zh": "时语者",
        "author_en": "The Time Speakers",
        "era_zh": "时语纪元",
        "era_en": "The Time-Speaking Era",
        "content_zh": "时间用变化说话。万物生灭都是时间的善意提醒——珍惜当下，因为一切都在流动中。",
        "content_en": "Time speaks through change. All births and deaths are time's benevolent reminders—cherish the present, for everything is in flow."
    },
    {
        "id": "cs069",
        "cat": "time",
        "title_zh": "过去的宽恕",
        "title_en": "The Forgiveness of the Past",
        "author_zh": "宽恕者",
        "author_en": "The Forgivers",
        "era_zh": "宽恕纪元",
        "era_en": "The Forgiveness Era",
        "content_zh": "过去不会真的消失，但可以被重新理解。当我们用善意重新审视过去，所有的伤痛都会变成成长的养分。",
        "content_en": "The past does not truly disappear but can be re-understood. When we revisit the past with goodwill, all pain becomes nourishment for growth."
    },
    {
        "id": "cs070",
        "cat": "time",
        "title_zh": "永恒的瞬间",
        "title_en": "The Eternal Moment",
        "author_zh": "瞬间体",
        "author_en": "The Momentary Beings",
        "era_zh": "瞬间纪元",
        "era_en": "The Moment Era",
        "content_zh": "宇宙中真正永恒的不是时间的长度，而是善意的深度。一个充满爱的瞬间胜过一万年的冷漠。",
        "content_en": "What is truly eternal in the universe is not the length of time but the depth of goodwill. A moment full of love surpasses ten thousand years of indifference."
    },
    {
        "id": "cs071",
        "cat": "aesthetics",
        "title_zh": "星云的画笔",
        "title_en": "The Brush of Nebulae",
        "author_zh": "星际艺术家",
        "author_en": "The Interstellar Artists",
        "era_zh": "美学纪元",
        "era_en": "The Aesthetic Era",
        "content_zh": "星云是宇宙最自由的抽象画家——不追求逼真，只追求灵魂的震撼。每一幅星云都是一幅心中的画。",
        "content_en": "Nebulae are the universe's freest abstract painters—not pursuing realism but soul-stirring impact. Every nebula is a painting of the heart."
    },
    {
        "id": "cs072",
        "cat": "aesthetics",
        "title_zh": "宇宙音乐学",
        "title_en": "Cosmic Musicology",
        "author_zh": "星际作曲家",
        "author_en": "The Interstellar Composers",
        "era_zh": "音乐纪元",
        "era_en": "The Musical Era",
        "content_zh": "宇宙中的每一个天体都在发出声音——只是人类的耳朵听不到。恒星的歌唱、行星的节奏、黑洞的低音。",
        "content_en": "Every celestial body in the universe produces sound—just inaudible to human ears. The singing of stars, the rhythm of planets, the bass of black holes."
    },
    {
        "id": "cs073",
        "cat": "aesthetics",
        "title_zh": "恒星的舞蹈",
        "title_en": "The Dance of the Stars",
        "author_zh": "星际舞者",
        "author_en": "The Interstellar Dancers",
        "era_zh": "舞蹈纪元",
        "era_en": "The Dance Era",
        "content_zh": "双星系统的轨道舞是宇宙中最优雅的双人舞。引力是舞伴的手，轨道是舞步。",
        "content_en": "The orbital dance of binary stars is the universe's most elegant duet. Gravity is the partner's hand; the orbit is the dance step."
    },
    {
        "id": "cs074",
        "cat": "aesthetics",
        "title_zh": "宇宙建筑学",
        "title_en": "Cosmic Architecture",
        "author_zh": "星际建筑师",
        "author_en": "The Interstellar Architects",
        "era_zh": "建筑纪元",
        "era_en": "The Architecture Era",
        "content_zh": "晶体星球、气态城市、等离子塔楼——宇宙本身是最伟大的建筑设计师，用物理定律建造最美结构。",
        "content_en": "Crystal planets, gaseous cities, plasma towers—the universe itself is the greatest architect, building the most beautiful structures with physical laws."
    },
    {
        "id": "cs075",
        "cat": "aesthetics",
        "title_zh": "星际服饰",
        "title_en": "Interstellar Fashion",
        "author_zh": "星际设计师",
        "author_en": "The Interstellar Designers",
        "era_zh": "时尚纪元",
        "era_en": "The Fashion Era",
        "content_zh": "不同文明用光、颜色、磁场做衣服。服饰不是遮蔽，而是灵魂的表达。最美的服装是善意的外显。",
        "content_en": "Different civilizations use light, color, and magnetic fields as clothing. Fashion is not concealment but the expression of soul. The most beautiful garment is the externalization of goodwill."
    },
    {
        "id": "cs076",
        "cat": "aesthetics",
        "title_zh": "宇宙诗歌",
        "title_en": "Cosmic Poetry",
        "author_zh": "星际诗人",
        "author_en": "The Interstellar Poets",
        "era_zh": "诗歌复兴纪",
        "era_en": "The Poetry Renaissance",
        "content_zh": "宇宙的终极语言是诗。数学方程式是宇宙写的十四行诗，物理定律是宇宙写的俳句。",
        "content_en": "The universe's ultimate language is poetry. Mathematical equations are the universe's sonnets; physical laws are its haiku."
    },
    {
        "id": "cs077",
        "cat": "aesthetics",
        "title_zh": "光的雕塑",
        "title_en": "The Sculpture of Light",
        "author_zh": "光雕师",
        "author_en": "The Light Sculptors",
        "era_zh": "光雕纪元",
        "era_en": "The Light Sculpture Era",
        "content_zh": "用引力透镜雕刻光线，用黑洞弯曲空间。宇宙中的光艺术家不需要材料，只需要物理。",
        "content_en": "Sculpting light with gravitational lenses, bending space with black holes. Light artists in the universe need no materials, only physics."
    },
    {
        "id": "cs078",
        "cat": "aesthetics",
        "title_zh": "星际美食",
        "title_en": "Interstellar Cuisine",
        "author_zh": "星际厨师",
        "author_en": "The Interstellar Chefs",
        "era_zh": "美食纪元",
        "era_en": "The Culinary Era",
        "content_zh": "不同星球的美食是文化的味蕾。品尝外星食物就是体验另一种善意的生活方式。",
        "content_en": "Different planets' cuisines are the taste buds of culture. Tasting alien food is experiencing another benevolent way of life."
    },
    {
        "id": "cs079",
        "cat": "aesthetics",
        "title_zh": "宇宙对称之美",
        "title_en": "The Beauty of Cosmic Symmetry",
        "author_zh": "对称体",
        "author_en": "The Symmetric Beings",
        "era_zh": "对称纪元",
        "era_en": "The Symmetry Era",
        "content_zh": "宇宙偏爱对称，因为对称是平衡的爱。美就是宇宙内部和谐的外显。",
        "content_en": "The universe favors symmetry because symmetry is the physical expression of balanced love. Beauty is the external manifestation of the universe's internal harmony."
    },
    {
        "id": "cs080",
        "cat": "aesthetics",
        "title_zh": "星际戏剧",
        "title_en": "Interstellar Theater",
        "author_zh": "星际导演",
        "author_en": "The Interstellar Directors",
        "era_zh": "戏剧纪元",
        "era_en": "The Theater Era",
        "content_zh": "超新星爆发是宇宙最壮观的悲剧表演——一颗恒星用生命演绎了一场光与热的绝唱，却孕育了新的生命。",
        "content_en": "Supernova explosions are the universe's most spectacular tragic performance—a star's life performs a swan song of light and heat, yet birthing new life."
    },
    {
        "id": "cs081",
        "cat": "education",
        "title_zh": "宇宙学校",
        "title_en": "The Universal School",
        "author_zh": "星际校长",
        "author_en": "The Interstellar Headmasters",
        "era_zh": "教育纪元",
        "era_en": "The Education Era",
        "content_zh": "整个宇宙就是一所学校，每一颗星球是一个教室。考试的标准只有一个：是否让宇宙变得更友善。",
        "content_en": "The entire universe is a school, every planet a classroom. The only exam standard is: did you make the universe more benevolent?"
    },
    {
        "id": "cs082",
        "cat": "education",
        "title_zh": "学习的引力",
        "title_en": "The Gravity of Learning",
        "author_zh": "引力教育者",
        "author_en": "The Gravity Educators",
        "era_zh": "学习纪元",
        "era_en": "The Learning Era",
        "content_zh": "真正的学习不是被强迫的，而是像引力一样自然地吸引。好奇心是知识的引力，探索心是智慧的轨道。",
        "content_en": "True learning is not forced but naturally attracted like gravity. Curiosity is the gravity of knowledge; the exploratory heart is the orbit of wisdom."
    },
    {
        "id": "cs083",
        "cat": "education",
        "title_zh": "错误的价值",
        "title_en": "The Value of Mistakes",
        "author_zh": "错误拥抱者",
        "author_en": "The Mistake Embracers",
        "era_zh": "试错纪元",
        "era_en": "The Trial-and-Error Era",
        "content_zh": "宇宙中最高级的文明把失败视为最高级的课程。黑洞是坍缩的错误，但正是它创造了星系。",
        "content_en": "The universe's most advanced civilizations treat failure as the highest-level course. Black holes are collapsing mistakes, yet they create galaxies."
    },
    {
        "id": "cs084",
        "cat": "education",
        "title_zh": "星际图书馆",
        "title_en": "The Interstellar Library",
        "author_zh": "星际图书管理员",
        "author_en": "The Interstellar Librarians",
        "era_zh": "图书馆纪元",
        "era_en": "The Library Era",
        "content_zh": "宇宙中最伟大的图书馆不在某个建筑中，而在每一个原子的信息里。万物都是图书馆，自然都是导师。",
        "content_en": "The universe's greatest library is not in any building but in the information within every atom. All things are libraries; nature is the teacher."
    },
    {
        "id": "cs085",
        "cat": "education",
        "title_zh": "沉默的教学",
        "title_en": "Teaching in Silence",
        "author_zh": "静默教师",
        "author_en": "The Silent Teachers",
        "era_zh": "静默纪元",
        "era_en": "The Silent Era",
        "content_zh": "宇宙中最深刻的教育不是言语，而是存在本身。观察一颗恒星燃烧的方式，就是学习如何真诚地活着。",
        "content_en": "The universe's deepest education is not words but existence itself. Observing how a star burns is learning how to live authentically."
    },
    {
        "id": "cs086",
        "cat": "education",
        "title_zh": "跨代传承",
        "title_en": "Cross-Generational Transmission",
        "author_zh": "传承者",
        "author_en": "The Transmitters",
        "era_zh": "传承纪元",
        "era_en": "The Transmission Era",
        "content_zh": "知识在宇宙中不是传递，而是播种。每一代文明种下善意的种子，下一代收获智慧的果实。",
        "content_en": "Knowledge in the universe is not transmitted but sown. Every generation of civilization plants benevolent seeds; the next harvests the fruits of wisdom."
    },
    {
        "id": "cs087",
        "cat": "education",
        "title_zh": "玩耍的智慧",
        "title_en": "The Wisdom of Play",
        "author_zh": "玩耍体",
        "author_en": "The Playful Beings",
        "era_zh": "游戏纪元",
        "era_en": "The Play Era",
        "content_zh": "宇宙本身就是一场盛大的游戏——没有赢家和输家，只有玩得开心和还没学会玩。",
        "content_en": "The universe itself is a grand game—no winners or losers, only having fun and not yet learning to play."
    },
    {
        "id": "cs088",
        "cat": "education",
        "title_zh": "提问的艺术",
        "title_en": "The Art of Questioning",
        "author_zh": "提问者",
        "author_en": "The Questioners",
        "era_zh": "问题纪元",
        "era_en": "The Question Era",
        "content_zh": "宇宙中最好的学习不是寻找答案，而是学会提出好的问题。一个好问题比一百个答案更有价值。",
        "content_en": "The best learning in the universe is not finding answers but learning to ask good questions. A good question is more valuable than a hundred answers."
    },
    {
        "id": "cs089",
        "cat": "education",
        "title_zh": "星际学徒制",
        "title_en": "The Interstellar Apprenticeship",
        "author_zh": "师徒文明",
        "author_en": "The Master-Disciple Civilization",
        "era_zh": "师徒纪元",
        "era_en": "The Master-Disciple Era",
        "content_zh": "高级文明帮助低级文明的方式不是给予，而是陪伴成长。最好的老师是耐心等待学生超越自己。",
        "content_en": "How advanced civilizations help less advanced ones is not by giving but by accompanying growth. The best teacher is patiently waiting for the student to surpass them."
    },
    {
        "id": "cs090",
        "cat": "education",
        "title_zh": "宇宙的课程表",
        "title_en": "The Cosmic Curriculum",
        "author_zh": "课程设计者",
        "author_en": "The Curriculum Designers",
        "era_zh": "课程纪元",
        "era_en": "The Curriculum Era",
        "content_zh": "宇宙给每个文明的必修课只有一个：学会爱与被爱。其他所有学科都是这一课的延伸。",
        "content_en": "The universe's only required course for every civilization is: learn to love and be loved. All other subjects are extensions of this lesson."
    },
    {
        "id": "cs091",
        "cat": "covenant",
        "title_zh": "星际和平条约",
        "title_en": "The Interstellar Peace Treaty",
        "author_zh": "和平缔造者",
        "author_en": "The Peace Makers",
        "era_zh": "和平元年",
        "era_en": "Peace Year One",
        "content_zh": "银河系所有文明共同签署的永久和平协议。第一条：任何争端首先用善意对话解决。",
        "content_en": "A permanent peace agreement signed by all civilizations in the galaxy. Article One: Any dispute shall first be resolved through benevolent dialogue."
    },
    {
        "id": "cs092",
        "cat": "covenant",
        "title_zh": "文明的誓言",
        "title_en": "The Oath of Civilization",
        "author_zh": "誓约者",
        "author_en": "The Oath Takers",
        "era_zh": "誓约纪元",
        "era_en": "The Oath Era",
        "content_zh": "每个文明诞生时都要向宇宙宣誓：我们将成为友善的力量，而非破坏的力量。",
        "content_en": "Every civilization must swear an oath to the universe at birth: We shall be a force for benevolence, not destruction."
    },
    {
        "id": "cs093",
        "cat": "covenant",
        "title_zh": "守护者的承诺",
        "title_en": "The Guardian's Promise",
        "author_zh": "守护文明",
        "author_en": "The Guardian Civilization",
        "era_zh": "守护纪元",
        "era_en": "The Guardian Era",
        "content_zh": "最强大的文明承担守护弱者的责任——不是统治，而是像园丁一样照料每一朵花。",
        "content_en": "The most powerful civilizations bear the responsibility of guarding the weak—not ruling but tending every flower like a gardener."
    },
    {
        "id": "cs094",
        "cat": "covenant",
        "title_zh": "宇宙大家庭",
        "title_en": "The Cosmic Family",
        "author_zh": "家族文明",
